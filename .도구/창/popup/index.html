<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펼쳐지는 마을 (시험)</title>
<style>
  :root {
    --ink: #4a3020; --ink-soft: #7a5a3c; --accent: #a8482f; --gold: #e2c27e; --gold-dim: rgba(226,194,126,0.45);
    --serif: 'Batang', '바탕', 'Noto Serif KR', serif; --hand: 'Gungsuh', '궁서', 'Batang', serif;
  }
  html, body { margin: 0; height: 100%; background: #140c07; font-family: var(--serif); color: var(--ink); overflow: hidden; }
  html.snap *, html.snap *::before, html.snap *::after { transition: none !important; animation: none !important; }
  /* 책상: 등불 하나가 비추는 어두운 나무 책상 */
  #app { position: absolute; inset: 0; overflow: hidden; background:
      radial-gradient(ellipse 52% 48% at 47% 50%, rgba(255,200,130,0.30), rgba(255,190,120,0.12) 50%, transparent 78%),
      radial-gradient(ellipse 120% 95% at 50% 52%, #4a321e 0%, #2a1b10 50%, #0e0805 100%); }
  #app::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
      repeating-linear-gradient(92deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 9px, rgba(255,220,170,0.02) 9px 10px, transparent 10px 23px); }

  /* ---------- 마을 전체: 책상 위에 놓인 입체 책 ---------- */
  /* 마을 전체: 책상 위에 펼쳐 놓은 그림 지도 한 장 */
  #ov { position: absolute; inset: 0; z-index: 1; }
  #ovmap { position: absolute; border-radius: 3px; box-shadow: 0 2px 0 rgba(255,235,200,0.08) inset, 0 34px 70px rgba(0,0,0,0.62), 0 8px 18px rgba(0,0,0,0.45); }
  #ovmap img { display: block; width: 100%; height: 100%; border-radius: 3px; -webkit-user-drag: none; user-select: none; }
  #ovhits { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 구역 고르기: 딱딱한 테두리 없이, 그 구역에 등불을 비춘 듯 은은하게 */
  #ovhits polygon { fill: rgba(255,226,160,0); stroke: rgba(255,236,190,0); stroke-width: 26; stroke-linejoin: round; cursor: pointer; transition: fill 0.18s ease, stroke 0.18s ease; filter: url(#ovsoft); }
  #ovhits:has(polygon:hover) polygon:not(:hover) { fill: rgba(28,18,10,0.4); stroke: rgba(28,18,10,0.4); }
  #ovhits polygon:hover { fill: rgba(255,236,180,0.14); stroke: rgba(255,226,150,0.35); }
  #ovhits circle { fill: #a8482f; stroke: #f4ead0; stroke-width: 4; pointer-events: none; }
  .f3 { position: absolute; transform-style: preserve-3d; }
  /* 판 둘레의 지도: 화면의 지도와 똑같이 깔려 있다가 카메라가 다가가면 함께 기울고, 가장자리는 어둠에 녹음.
     흐려도 되는 배경이라 작게 그려 늘림 (SUR_Q) */
  .surround { position: absolute; transform-origin: 0 0; background-repeat: no-repeat; pointer-events: none; transition: filter 1.4s; }
  #scene.is-unfolded .surround { filter: brightness(0.62) saturate(0.85); }
  .pg { position: absolute; top: 0; transform-origin: 0 50%; background-repeat: no-repeat; backface-visibility: hidden; }
  #ovpaper { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; transform-style: preserve-3d; }
  .ov-hit { position: absolute; inset: 0; cursor: pointer; transition: background-color 0.3s; }
  .ov-hit:hover { background-color: rgba(255,214,140,0.22); }
  .ov-piece { position: absolute; transform-origin: 50% 100%; pointer-events: none; transition: transform 0.7s cubic-bezier(.3,1.45,.6,1);
    filter: sepia(0.18) saturate(0.85) brightness(1.02) drop-shadow(0.8px 1px 0 rgba(140,105,70,0.95)); }
  .ov-cast { position: absolute; transform-origin: 50% 100%; pointer-events: none; filter: brightness(0) blur(1.6px); opacity: 0.22; }
  .ov-contact { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(ellipse, rgba(40,24,10,0.55), transparent 70%); transform: translate(-50%, -50%); }
  .storydot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #f4ead0, 0 1px 3px rgba(0,0,0,0.5); pointer-events: none; }

  .heading { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; white-space: nowrap; pointer-events: none;
    color: #efdcb4; font: 400 30px/1 var(--hand); letter-spacing: 0.42em; text-indent: 0.42em; text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,190,110,0.18); }
  .heading::before, .heading::after { content: ''; width: 90px; height: 7px; background:
      radial-gradient(circle, var(--gold) 0 2.4px, transparent 3px) center / 7px 7px no-repeat,
      linear-gradient(var(--gold-dim), var(--gold-dim)) center / 100% 1px no-repeat; }
  #title { top: 26px; transition: opacity 0.5s; z-index: 2; }
  #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: #c9b08a; font: 13px/1.4 var(--serif); letter-spacing: 0.04em; opacity: 0.72; transition: opacity 0.4s; white-space: nowrap; z-index: 2; pointer-events: none; }
  #veil { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.8s;
    background: radial-gradient(ellipse 70% 62% at 50% 58%, rgba(22,14,8,0.5), rgba(10,6,3,0.92) 100%); }
  #app.is-open #veil { opacity: 1; }
  #ovmap, #ovfx { transition: opacity 0.8s; }
  #app.is-open #ovmap, #app.is-open #ovfx { opacity: 0; }
  #app.is-open #title, #app.is-open #hint { opacity: 0; }

  /* ---------- 펼친 책 (정면 · 눈높이) ---------- */
  #scene { position: absolute; inset: 0; z-index: 4; perspective: 1500px; perspective-origin: 50% 38%; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #scene.is-open { pointer-events: auto; }
  /* 책은 지도 자리에서 스르르 나타나고, 덮은 뒤엔 제자리에 내려앉는 끝자락에 지도로 녹아듦 (툭 튀거나 사라지지 않게)
     — 흐림은 #book 이 아니라 #scene 에: 입체 묶음(preserve-3d)에 opacity 를 주면 크롬이 입체를 납작하게 눌러 버림 */
  #scene { opacity: 0; transition: opacity 0.35s 0.5s; }
  #scene.is-open { opacity: 1; transition: opacity 0.3s; }
  #book { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 50% 50%; }
  /* 책 속은 화면에 보일 크기 그대로 깔아서 그림 (작게 그려 놓고 3D로 키우면 흐려짐) */
  #bookz { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .bk-page { position: absolute; background-size: 100% 100%; box-shadow: inset 0 0 0 1.5px rgba(50,28,10,0.6), inset 0 0 0 10px #efe3c7, inset 0 0 0 11px rgba(120,88,52,0.6), inset 0 0 18px 10px rgba(60,35,15,0.28); }
  /* 판에 붙어 누운 것들(받침·그림자·등불빛·배경 막 발치)은 종이 면 안에 같이 그림: 따로 띄우면 하나하나가 입체 층이 되어
     메모리를 먹고, 종이와 같은 높이라 크롬 3D 정렬이 꼬임 */
  .deco { position: absolute; }
  .book-light { position: absolute; pointer-events: none; background:
      radial-gradient(ellipse 62% 58% at 26% 20%, rgba(255,226,170,0.24), transparent 64%),
      radial-gradient(ellipse 95% 95% at 25% 20%, transparent 40%, rgba(70,35,10,0.28) 100%),
      linear-gradient(162deg, transparent 46%, rgba(34,42,80,0.16) 100%),
      linear-gradient(180deg, rgba(40,25,10,0.10), transparent 25%, transparent 80%, rgba(40,25,10,0.12)); }
  .haze { display: none; opacity: 0; position: absolute; inset: -40px; pointer-events: none;
    background: radial-gradient(ellipse closest-side at 50% 56%, rgba(247,242,232,0.94), rgba(241,234,220,0.82) 50%, rgba(236,228,214,0.4) 80%, rgba(236,228,214,0) 100%); }
  #scene.is-unfolded .haze { opacity: 1; transition: opacity 0.5s; }
  #scene.is-unfolded.is-clear .haze { opacity: 0; transition: opacity 1.8s ease-out; }
  /* 덮개: 판 자리의 지도 그림 그대로인 두 짝. 가운데가 갈라져 바깥 모서리를 축으로 양옆으로 열리고, 열린 채 지도 위에 누움 */
  .cover { position: absolute; transition: transform 1.05s cubic-bezier(.45,.05,.3,1); backface-visibility: hidden; background-repeat: no-repeat; }
  .cover.l { transform-origin: 0 50%; box-shadow: -1px 0 0 rgba(40,22,8,0.55) inset; }
  .cover.r { transform-origin: 100% 50%; box-shadow: 1px 0 0 rgba(40,22,8,0.55) inset; }
  .cover-back { position: absolute; pointer-events: none; transition: transform 1.05s cubic-bezier(.45,.05,.3,1), filter 1.4s;
    background: linear-gradient(90deg, rgba(60,35,15,0.3), transparent 14%, transparent 86%, rgba(60,35,15,0.3)), url('assets/paper_card.jpg') center / cover;
    box-shadow: inset 0 0 0 12px #5a321b, inset 0 0 0 13px rgba(226,194,126,0.55), inset 0 0 30px 14px rgba(60,35,15,0.35); }
  .cover-back.l { transform-origin: 0 50%; border-radius: 6px 0 0 6px; }
  .cover-back.r { transform-origin: 100% 50%; border-radius: 0 6px 6px 0; }
  /* 양옆에 펼쳐져 누운 안쪽 면은 판보다 튀지 않게 둘레 지도처럼 살짝 가라앉힘 */
  #scene.is-unfolded .cover-back { filter: brightness(0.7) saturate(0.85); }
  .stand { position: absolute; transform-origin: 50% 100%; -webkit-user-drag: none; user-select: none; }
  /* 평소엔 거름(filter)을 걸지 않음: 입체 속 그림에 거름을 걸면 크롬이 그 그림을 낮은 해상도로 따로 그려서 인물 둘레가 뿌옇게 번졌음.
     고를 때만 빛남 (--k: 그림을 k배 크게 깔고 줄여 보이므로 빛 번짐도 k배) */
  .piece { cursor: pointer; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), filter 0.2s; }
  .piece:hover { filter: drop-shadow(0 0 calc(5px * var(--k, 1)) rgba(255,214,150,0.9)); }
  .piece.is-sel { filter: drop-shadow(0 0 calc(1.2px * var(--k, 1)) rgba(255,248,225,1)) drop-shadow(0 0 calc(7px * var(--k, 1)) rgba(255,186,96,0.95)); }
  /* 서 있는 그림은 판에 수직으로 서 있으므로, 들썩임은 판의 법선(z) 방향으로 */
  .piece.person.is-up { animation: bob 2.8s ease-in-out infinite; }
  .piece.hop { animation: hop 0.45s ease-out; }
  @keyframes bob { 0%, 100% { translate: 0 0 0; } 50% { translate: 0 0 2.5px; } }
  @keyframes hop { 0% { translate: 0 0 0; } 40% { translate: 0 0 16px; } 100% { translate: 0 0 0; } }
  .cast { display: none; }
  .cast.is-up { opacity: 0.2; }
  /* 바닥 그림자·받침·번짐: 일어설 때는 천천히 배어나고, 누울 때는 그림과 같이 바로 걷힘 */
  .contact { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(35,20,8,0.62), rgba(35,20,8,0.25) 45%, transparent 72%); transform: translate(-50%, -50%) scale(0.3); opacity: 0; transition: transform 0.35s, opacity 0.3s; pointer-events: none; }
  .contact.is-up { transform: translate(-50%, -50%) scale(1); opacity: 1; transition: transform 0.7s, opacity 0.7s; }
  .shade { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.3s; transform-origin: 50% 100%;
    transform: skewX(30deg) scaleY(-0.55); filter: brightness(0) blur(2.5px); }
  .shade.is-up { opacity: 0.5; transition: opacity 0.9s 0.25s; }
  /* 등불 번짐 (서 있는 판) */
  .glow { pointer-events: none; opacity: 0; transition: transform 0.4s ease-in, opacity 0.3s; }
  .glow.is-up { opacity: 1; animation: flick 3.2s ease-in-out infinite; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), opacity 0.8s; }
  @keyframes flick { 0%, 100% { opacity: 0.85; } 45% { opacity: 1; } 70% { opacity: 0.78; } }
  .bd-foot { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.3s; border-top: 1px solid rgba(120,88,52,0.7);
    background: linear-gradient(180deg, #d6c49c, #efe3c7 40%, rgba(246,238,219,0.6)); }
  .bd-foot.is-up { opacity: 1; transition: opacity 0.8s; }
  /* 배경 막: 종이에 그린 무대 막이므로 또렷하게 두고, 맨 뒤 풍경만 아주 살짝 멀어 보이게 */
  .backdrop { pointer-events: none; opacity: 0; transition: transform 1s cubic-bezier(.34,1.3,.64,1), opacity 0.8s; }
  .backdrop.far { filter: blur(0.4px); }
  /* 종이 구름: 표지가 열리면 툭 일어섰다가, 무대 소품처럼 양옆으로 빠짐 */
  .fog { pointer-events: none; transition: transform 0.55s cubic-bezier(.34,1.5,.64,1), opacity 0.3s; }
  .fog.is-off { transition: transform 1.5s cubic-bezier(.55,0,.25,1), opacity 1s 0.2s; }
  /* 종이 받침: 오림 그림을 판에 붙인 접힌 종이 띠 */
  .tab { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.4s;
    background: linear-gradient(180deg, #8a6e48 0 1px, #cfbd98 1px 3px, #e6d6b5 3px, #e9dbbd 60%, #dccaa4 100%);
    clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%); filter: drop-shadow(0 1px 1px rgba(40,25,10,0.3)); }
  .tab.is-up { opacity: 0.92; }
  .ptab { transform-origin: 50% 0; }
  .tab.is-up { opacity: 1; }
  .fog.ambient { animation: drift 10s ease-in-out infinite alternate; }
  @keyframes drift { from { translate: -14px 0; } to { translate: 14px 0; } }
  /* ---------- 하늘: 눈높이로 내려오면 판 너머(지도가 어둠에 녹는 곳) 위로 저녁 하늘이 밝아 오고 종이 구름이 흘러감.
     3D 바깥의 평면이라 메모리를 거의 안 먹음. 보는 각도에 따라 살짝 따라 움직임 (applyView) ---------- */
  /* 아래쪽은 색 자체를 투명하게 녹임 (가리개 mask 를 쓰면 그래픽 메모리를 두 배로 먹어 큰 판에서 종이가 빠졌음) */
  #sky { position: absolute; left: -6%; right: -6%; top: -8%; height: 66%; pointer-events: none; opacity: 0; transition: opacity 1.8s; }
  #scene.is-unfolded #sky { opacity: 1; }
  #app.no-fx #sky { display: none; }
  .sky-grad { position: absolute; inset: 0; opacity: 0.92;
    background: linear-gradient(180deg, #171a33 0%, #2c2c4d 22%, #5e4c62 42%, #a7735f 58%, rgba(217,160,108,0.75) 72%, rgba(233,182,126,0.3) 86%, rgba(233,182,126,0) 100%); }
  .sky-sun { position: absolute; left: 14%; bottom: -12%; width: 46%; height: 70%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,226,160,0.55), rgba(255,196,120,0.22) 45%, transparent 100%); }
  .sky-stars { position: absolute; inset: 0 0 45% 0; opacity: 0.55;
    background-image: radial-gradient(1px 1px at 12% 18%, #fff6dc, transparent), radial-gradient(1px 1px at 27% 8%, #fff6dc, transparent), radial-gradient(1.4px 1.4px at 44% 22%, #fff3d0, transparent),
      radial-gradient(1px 1px at 61% 11%, #fff6dc, transparent), radial-gradient(1.2px 1.2px at 78% 26%, #fff3d0, transparent), radial-gradient(1px 1px at 90% 9%, #fff6dc, transparent),
      radial-gradient(1px 1px at 6% 34%, #fff6dc, transparent), radial-gradient(1px 1px at 53% 36%, #fff6dc, transparent), radial-gradient(1px 1px at 70% 40%, #fff3d0, transparent);
    animation: twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.35; } to { opacity: 0.7; } }
  /* 종이 구름: 판 위의 오림 구름과 같은 종이를 하늘에 띄움. 저녁빛에 물들고, 먼 것일수록 작고 옅고 느림 */
  .sky-cloud { position: absolute; left: 0; opacity: var(--o); filter: sepia(0.35) saturate(1.2) brightness(var(--b)) hue-rotate(-8deg);
    animation: skydrift var(--d) linear var(--dl) infinite; }
  @keyframes skydrift { from { transform: translateX(-30vw); } to { transform: translateX(115vw); } }
  /* ---------- 빛 (HD-2D 풍): 빛줄기 · 먼지 · 색보정 — 3D 바깥의 평면 층이라 입체를 안 깨뜨림 ---------- */
  #fx, #ovfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  /* 블룸: 아주 밝은 곳(등불·분수)만 골라 살짝 번지게. 종이 전체가 뿌옇게 되지 않도록 문턱을 높이고 약하게 */
  .fx-bloom { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s; mix-blend-mode: screen;
    backdrop-filter: brightness(0.42) contrast(6) saturate(1.3) blur(8px); -webkit-backdrop-filter: brightness(0.42) contrast(6) saturate(1.3) blur(8px); }
  /* 색보정·블룸·그늘은 책이 뜨는 순간부터 켬: 구름이 걷힐 때까지 기다리면 펼치는 동안 종이가 허옇게 바래 보였음 */
  #scene.is-open .fx-bloom { opacity: 0.1; }
  .fx-tone { position: absolute; inset: 0; backdrop-filter: none; transition: backdrop-filter 1.6s; }
  #scene.is-open .fx-tone { backdrop-filter: contrast(1.08) brightness(0.96) saturate(1.1); -webkit-backdrop-filter: contrast(1.08) brightness(0.96) saturate(1.1); }
  .fx-rays { position: absolute; inset: -10% -10% 0 -10%; opacity: 0; transition: opacity 2s; mix-blend-mode: screen;
    background: repeating-linear-gradient(116deg, rgba(255,226,170,0) 0px, rgba(255,226,170,0.1) 60px, rgba(255,226,170,0) 120px, rgba(255,226,170,0) 210px, rgba(255,236,190,0.07) 250px, rgba(255,226,170,0) 300px);
    -webkit-mask-image: radial-gradient(ellipse 72% 85% at 18% 0%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%); mask-image: radial-gradient(ellipse 72% 85% at 18% 0%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%); }
  #scene.is-clear .fx-rays, #ovfx .fx-rays { opacity: 1; animation: rays 11s ease-in-out infinite alternate; }
  @keyframes rays { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
  .fx-grade { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s;
    background: radial-gradient(ellipse 48% 42% at 30% 22%, rgba(255,206,140,0.12), transparent 70%),
      radial-gradient(ellipse 74% 70% at 48% 50%, transparent 48%, rgba(16,12,30,0.58) 100%); }
  #scene.is-open .fx-grade { opacity: 1; }
  .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,244,214,0.95), rgba(255,226,170,0.35) 45%, transparent 70%); opacity: 0;
    animation: mote var(--d) linear var(--dl) infinite; }
  .mote.bokeh { filter: blur(2.5px); background: radial-gradient(circle, rgba(255,236,196,0.9), rgba(255,214,150,0.35) 55%, transparent 72%); }
  #fx .motes { opacity: 0; transition: opacity 2s; }
  #scene.is-unfolded #fx .motes { opacity: 1; }
  @keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  #ovfx { z-index: 1; }
  #ovfx .fx-rays { opacity: 0.8; }
  #ovfx .fx-bloom { opacity: 0.16; }
  /* 지도 위 등불: 왼쪽 위가 따뜻하게 밝고, 가장자리는 어둑하게 */
  .ov-light { position: absolute; inset: 0; background:
      radial-gradient(ellipse 46% 44% at 34% 30%, rgba(255,214,150,0.14), transparent 70%),
      radial-gradient(ellipse 72% 70% at 50% 50%, transparent 50%, rgba(16,12,28,0.5) 100%); }
  #app.no-fx #fx, #app.no-fx #ovfx { display: none; }
  #scene.is-ready { cursor: grab; }
  #scene.is-dragging { cursor: grabbing; }
  .ui { position: absolute; z-index: 5; }
  #scene-title { top: 26px; opacity: 0; transition: opacity 0.6s; }
  #close { left: 22px; top: 20px; padding: 9px 18px 9px 14px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.42); background: rgba(28,18,10,0.6);

  /* 3D 면은 뒤집혀 누워 있어서 거울처럼 한 번 더 뒤집어 바로 읽히게. 누르면 카메라가 그 면을 내려다보고, 그때 또렷한 쓰기용 판을 겹쳐 띄움 */

  #card .orn { display: flex; align-items: center; gap: 12px; margin: 12px 0 2px; }
  #card .orn i { width: 6px; height: 6px; transform: rotate(45deg); background: #b08650; box-shadow: 0 0 0 2px #f2e7cf, 0 0 0 3px rgba(176,134,80,0.6); }
  #card .orn::before, #card .orn::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(140,100,60,0.6), transparent); }
  #card .pic { position: relative; height: 190px; margin: 6px 0 4px; display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(ellipse 60% 55% at 50% 62%, rgba(255,250,236,0.9), rgba(255,250,236,0) 72%); }
  #card .pic::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 2px; height: 14px; border-radius: 50%; background: radial-gradient(ellipse, rgba(60,35,15,0.35), transparent 70%); }
  #card img { position: relative; z-index: 1; display: block; max-width: 84%; max-height: 176px; filter: drop-shadow(1px 1.5px 0 rgba(150,115,80,0.9)) drop-shadow(0 6px 8px rgba(60,40,20,0.3)); }

    background: repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,85,50,0.28) 27px 28px); background-attachment: local; }
  #card .saved { font: italic 12px/1.4 var(--serif); color: #9a8266; margin-top: 12px; text-align: right; }
  #card .x { position: absolute; right: 14px; top: 12px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(120,85,50,0.4); background: rgba(255,250,236,0.5);

<body>
<div id="app">
  <div id="ov"><div id="ovmap"><img id="ovimg" src="assets/map_town.jpg" alt=""><svg id="ovhits" viewBox="0 0 2400 1500" preserveAspectRatio="none"></svg></div><div id="ovfx"><div class="fx-bloom"></div><div class="fx-rays"></div><div class="motes"></div><div class="ov-light"></div></div></div>
  <div id="title" class="heading">펼쳐지는 마을</div>
  <div id="hint">지도에서 구역을 누르면 그 안이 그림책으로 펼쳐져요 · 펼친 뒤 건물이나 사람을 누르면 이야기와 상태를 적을 수 있어요</div>
  <div id="veil"></div>
  <div id="scene">
    <div id="sky"><div class="sky-grad"></div><div class="sky-stars"></div><div class="sky-sun"></div></div>
    <div id="book"><div id="bookz"></div></div>
    <div id="fx"><div class="fx-tone"></div><div class="fx-bloom"></div><div class="fx-rays"></div><div class="motes"></div><div class="fx-grade"></div></div>
    <div id="scene-title" class="ui heading"></div>
    <button id="close" class="ui">책 덮기</button>
    <div id="view-hint" class="ui">끌면 보는 각도가 돌아가요 · 휠로 가까이 · ← → 구역 옮기기 · 양옆 면을 누르면 목차·기록 · Esc 덮기</div>
    <div id="zonebar" class="ui"><button class="zb-prev" title="앞 구역 (←)">‹</button><div class="zb-txt"><span class="zb-name"></span><span class="zb-no"></span></div><button class="zb-next" title="다음 구역 (→)">›</button></div>
    <div id="flappanel" class="ui"><button class="fp-back">‹ 판으로</button><div class="flap"></div></div>
    <div id="zedit" class="ui"></div>
    <div id="zedit-tools" class="ui"><b>구역 나누기</b><span class="tip">판 위를 끌어 새 구역 · 끌어 옮기기 · 모서리로 크기</span><button class="zt-add">＋ 새 구역</button><input class="zt-name" placeholder="구역 이름" disabled><button class="zt-del" disabled>지우기</button><button class="zt-cancel">그만두기</button><button class="zt-save go">다 했어요</button></div>
  </div>
  <div id="card"></div>
</div>
<script>
const VERSION = 3;
const SAVE = 'The Archive - 자료/마을 (시험).마을.json';
const LAYOUT = '.도구/창/popup/layout.json'; // 처음 배치 (저장본이 없을 때)
const Q = new URLSearchParams(location.search);
if (Q.get('snap')) document.documentElement.classList.add('snap');
// 두 곳에서 열림: 세계판 창(serve3.py, http) · 옵시디언 플러그인 「펼쳐지는 마을」(이 파일을 액자로 띄움, ?obs=1).
// 옵시디언 안에서는 이 페이지가 보관소 파일을 직접 읽고 쓰지 못하므로 플러그인에 부탁함 (postMessage). 그림은 이 페이지 자리에서 상대 주소로
const OBS = Q.get('obs') === '1';
const VROOT = OBS ? '../../../' : '/vault/'; // 보관소 맨 위 (이 페이지는 .도구/창/popup/ 에 있음)
const vurl = (p) => VROOT + p.split('/').map(encodeURIComponent).join('/');
const ASSET = (p) => vurl(['The Archive - 자료', '기호', p].join('/'));
const LOCAL = (n) => 'assets/' + n; // 이 페이지 옆 assets/ (창: /popup/assets · 옵시디언: 같은 폴더)
const FOGS = [1, 2, 3, 4, 5, 6].map((i) => LOCAL(`cloud_${i}.png`)); // 종이 오림 구름
const M = 40; // 블럭 둘레 여백 (쪽 = bbox + 여백)
const PAD = 40; // 인쇄된 판 둘레의 종이 여백 (구운 쪽 그림과 같은 값)
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clampv = (v, [a, b]) => Math.max(a, Math.min(b, v));
// 옵시디언 플러그인에 보관소 파일 읽기 부탁 (답이 4초 안에 없으면 없는 것으로)
const asks = new Map();
let askN = 0;
addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.mn === 'read' && asks.has(m.id)) { asks.get(m.id)(m.text); asks.delete(m.id); }
});
/** 보관소 파일 글 읽기 (없으면 null) */
async function readVault(p) {
  if (OBS) {
    return new Promise((res) => {
      const id = ++askN;
      asks.set(id, res);
      parent.postMessage({ mn: 'read', id, path: p }, '*');
      setTimeout(() => { if (asks.has(id)) { asks.delete(id); res(null); } }, 4000);
    });
  }
  try {
    const r = await fetch(vurl(p) + '?t=' + Date.now());
    return r.ok ? await r.text() : null;
  } catch (e) {
    return null;
  }
}

let town = null;
let saveTimer = null;
function bbox(pts) {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
async function loadTown() {
  try {
    const s = await readVault(SAVE);
    if (s) {
      const t = JSON.parse(s);
      if (t.version === VERSION) return t;
    }
  } catch (e) {}
  const L = JSON.parse(await readVault(LAYOUT));
  let n = 0;
  return {
    version: VERSION,
    blocks: Object.entries(L).map(([id, b]) => {
      const [x0, y0] = bbox(b.poly);
      return { id, name: b.name, poly: b.poly, items: b.items.map((it) => ({ id: 'i' + ++n, ...it, x: it.x + x0 - M, y: it.y + y0 - M, story: '' })) };
    }),
  };
}
function saveSoon() {
  clearTimeout(saveTimer);
  const marks = () => document.querySelectorAll('#card .saved, #flappanel .saved');
  marks().forEach((e) => { e.textContent = '저장 중…'; });
  saveTimer = setTimeout(async () => {
    const text = JSON.stringify(town, null, 1);
    if (OBS) parent.postMessage({ mn: 'save', path: SAVE, text }, '*'); // 옵시디언: 플러그인이 대신 씀
    else await fetch('/save?name=' + encodeURIComponent(SAVE), { method: 'POST', body: text });
    marks().forEach((e) => { e.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR'); });
    drawBoard(false);
  }, 600);
}
function el(cls, parent, tag = 'div') {
  const e = document.createElement(tag);
  e.className = cls;
  parent.appendChild(e);
  return e;
}
function placeBottom(im, it, ox = 0, oy = 0) {
  Object.assign(im.dataset, { w: it.w, cx: it.x - ox, by: it.y - oy });
  layBottom(im);
  if (!(im.complete && im.naturalWidth)) im.addEventListener('load', () => layBottom(im), { once: true });
}
/** 발치(가운데 아래)에 맞춰 크기·자리를 잡음. data-k 배 크게 깔고 standT 의 scale(1/k)로 줄이면 같은 크기로 보이면서 k배 촘촘하게 그려짐 */
function layBottom(im) {
  const w = Number(im.dataset.w), k = Number(im.dataset.k || 1);
  im.style.width = w * k + 'px';
  im.style.left = Number(im.dataset.cx) - (w * k) / 2 + 'px';
  if (im.naturalWidth) im.style.top = Number(im.dataset.by) - (im.naturalHeight * w * k) / im.naturalWidth + 'px';
}
/** 판 둘레의 지도: 판 자리(hx,hy,hw,hh)만 비운 네 띠에 지도 그림을 지도와 똑같은 자리로 깖. 처음엔 화면의 지도와 겹쳐 보이다가
 *  카메라가 다가가며 판과 함께 기울어짐 (지도 그 자리가 열리는 것처럼). 바깥으로 갈수록 어둠에 녹음 */
const SUR_Q = 3; // 둘레 지도는 1/3 크기로 그려 세 배로 늘림 (흐려도 되는 배경 — 가장자리 녹임까지 그래픽 메모리를 두 배로 먹음)
function buildSurround(parent, hx, hy, hw, hh, ox, oy) {
  // 양옆은 펼친 덮개(판 폭의 절반)가 덮으니 그보다 조금만 넓게
  const L = hx - 0.6 * hw, R = hx + hw + 0.6 * hw, T = hy - 0.9 * hh, B = hy + hh + 0.45 * hh;
  const MW = MAPW / MS, MH = MAPH / MS, q = SUR_Q; // 마을 좌표로 본 지도 크기
  for (const [sx, sy, sw, sh] of [[L, T, R - L, hy - T], [L, hy + hh, R - L, B - hy - hh], [L, hy, hx - L, hh], [hx + hw, hy, R - hx - hw, hh]]) {
    const s = el('surround', parent);
    // 가장자리는 어둠으로 칠하지 않고 투명하게 녹임: 펼침 시작·덮음 끝에 화면의 지도와 겹쳐 바뀔 때 어두운 네모가 비치지 않게
    const mask = `radial-gradient(closest-side, #000 50%, rgba(0,0,0,0.4) 78%, transparent 100%) ${(L - sx) / q}px ${(T - sy) / q}px / ${(R - L) / q}px ${(B - T) / q}px no-repeat`;
    Object.assign(s.style, { left: sx + 'px', top: sy + 'px', width: sw / q + 'px', height: sh / q + 'px', transform: `scale(${q})`,
      backgroundImage: `url("${LOCAL('map_town.jpg')}")`, backgroundSize: `${MW / q}px ${MH / q}px`,
      backgroundPosition: `${(-ox - sx) / q}px ${(-oy - sy) / q}px`, webkitMask: mask, mask });
  }
}

// 끝의 translate = 카메라가 보는 곳(판 가운데에서 fx, fy 만큼)을 화면 (cx, cy)로 데려옴. 늘 같은 함수 목록이라 구역 사이를 부드럽게 옮겨 감
const BT = (cx, cy, w, h, s, tilt, yaw, lift = 0, fx = 0, fy = 0) => `translate(${cx - (w * BZ) / 2}px, ${cy - (h * BZ) / 2}px) scale(${s / BZ}) rotateX(${tilt}deg) rotateZ(${yaw}deg) translateZ(${lift * BZ}px) translate(${-fx * BZ}px, ${-fy * BZ}px)`;

/** 책 속 배율의 윗한계: ① 종이 한 장이 기기 픽셀로 4096을 넘으면 (고해상도 화면 × 큰 배율) 크롬이 층을 못 그려 장면이 깨짐
 *  ② 종이 한 장이 PAGE_PX 화소를 넘으면 그래픽 메모리가 모자라 크롬이 그림·종이를 통째로 버림 (휠로 아주 가까이 볼 때) → 둘 다 그 안으로 */

function setPieceRes() {

    p.im.style.transition = 'none';

let rezoomTimer = null;

  for (const [src, wf, yb, op, kind] of [[`backdrop_far${wide}.png`, 1.0, 6, 1, 'far'], [`backdrop_mid${wide}.png`, 0.97, 26, 1, 'mid']]) {

async function closeBlock() {

  [...pieces].sort((a, c) => a.y - c.y).forEach((p, i) => setTimeout(() => {

    bd.style.transform = standT(bd);

  book.style.transition = 'transform 1.3s cubic-bezier(.5,0,.25,1)';

const zonebar = document.getElementById('zonebar');

const ztools = document.getElementById('zedit-tools');
/** 이 지역의 구역 (마을 좌표 네모). 작가가 아직 안 나눴으면 시험용으로 판을 긴 쪽으로 2~3등분해 방위만 붙여 둠 (저장은 작가가 고칠 때) */
function zonesOf(b) {
  if (Array.isArray(b.zones)) return b.zones;
  const [x0, y0, x1, y1] = bbox(b.poly);
  const W = x1 - x0, H = y1 - y0, wide = W >= H;
  const n = Math.max(W, H) / Math.min(W, H) > 1.5 ? 3 : 2;
  const names = wide ? (n === 3 ? ['서쪽', '가운데', '동쪽'] : ['서쪽', '동쪽']) : n === 3 ? ['북쪽', '가운데', '남쪽'] : ['북쪽', '남쪽'];
  if (!SEEDS.has(b)) SEEDS.set(b, names.map((name, i) => (wide
    ? { id: 'z' + (i + 1), name, x: x0 + (W * i) / n, y: y0, w: W / n, h: H }
    : { id: 'z' + (i + 1), name, x: x0, y: y0 + (H * i) / n, w: W, h: H / n })));
  return SEEDS.get(b);
}
const SEEDS = new WeakMap(); // 시험용 구역 (저장하지 않음)
/** 구역을 보는 카메라: 그 구역 가운데로 옮기고, 구역이 화면에 꽉 차도록 당김 (판 전체보다 작게는 안 봄) */
function zoneFocus(o, z) {
  const k = Math.min((o.w + 2 * PAD) / (z.w + 2 * M), (o.h + 2 * PAD) / (z.h + 2 * M));
  return { kind: 'zone', id: z.id, cx: z.x - o.ox + z.w / 2, cy: z.y - o.oy + z.h / 2, k: clampv(k, [1, 2.4]) };
}
function moveCamera(o, sec) {
  book.style.transition = `transform ${sec}s cubic-bezier(.55,0,.25,1)`;
  book.style.transform = bookT(o, card.classList.contains('is-open'));
  skyFollow(sec + 's');
  rezoomSoon(sec * 1000 + 80);
}
/** i: 구역 번호 (-1 = 판 전체). 끝에서 넘기면 반대쪽 끝으로 돎 */
function goZone(i) {

function drawZoneUI(o) {
  const zs = zonesOf(o.b);
  zonebar.querySelector('.zb-name').textContent = o.fi < 0 ? '판 전체' : zs[o.fi].name;
  zonebar.querySelector('.zb-no').textContent = o.fi < 0 ? `구역 ${zs.length}곳` : `${o.fi + 1} / ${zs.length}`;
  zonebar.querySelectorAll('button').forEach((x) => { x.disabled = !zs.length; });
  if (o.flapL) fillFlap(o.flapL, 'l', o, false);
}
zonebar.querySelector('.zb-prev').onclick = () => openState && goZone(openState.fi - 1);
zonebar.querySelector('.zb-next').onclick = () => openState && goZone(openState.fi + 1);

/** 양옆 면의 내용: 왼쪽 = 구역 목차 + 작은 지도, 오른쪽 = 작가의 기록. 3D 면(보기용)과 내려다볼 때 겹치는 판(live, 쓰기용)이 같은 모양 */
function fillFlap(box, side, o, live) {
  box.innerHTML = '';
  const b = o.b, zs = zonesOf(b), CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  el('lab', box).textContent = side === 'l' ? '구 역' : '기 록';
  el('nm', box).textContent = b.name;
  el('', el('orn', box), 'i');
  if (side === 'l') {
    // 작은 지도는 목차가 다 들어가고 남는 높이만큼만 (납작한 지역은 면이 낮아서 목차가 잘렸음)
    const room = CH - 62 - 82 - (zs.length + 1) * 30 - 36 - 18;
    const mh = Math.min(room, CH * 0.34, ((CW / 2 - 64) * CH) / CW);
    const mini = el('mini', box);
    Object.assign(mini.style, { width: (mh * CW) / CH + 'px', height: mh + 'px', display: mh < 50 ? 'none' : '' });
    const im = el('', mini, 'img');
    im.src = LOCAL(`page_${b.id}.jpg`);
    im.draggable = false;
    zs.forEach((z, i) => {
      const r = el(i === o.fi ? 'on' : '', mini, 'i');
      Object.assign(r.style, { left: ((z.x - o.ox + PAD) / CW) * 100 + '%', top: ((z.y - o.oy + PAD) / CH) * 100 + '%', width: (z.w / CW) * 100 + '%', height: (z.h / CH) * 100 + '%' });
      el('', r, 'b').textContent = i + 1;
      if (live) r.onclick = () => leaveFlap(i);
    });
    const ol = el('', box, 'ol');
    [{ name: '판 전체' }, ...zs].forEach((z, j) => {
      const li = el(j - 1 === o.fi ? 'on' : '', ol, 'li');
      el('no', li, 'span').textContent = j ? j : '◇';
      el('', li, 'span').textContent = z.name;
      if (live) li.onclick = () => leaveFlap(j - 1);
    });
    const tool = el('tool', box, live ? 'button' : 'div');
    tool.textContent = '✎ 구역 나누기';
    if (live) tool.onclick = () => startZoneEdit();
  } else {
    const ph = '이 지역의 분위기, 사는 사람들, 얽힌 이야기… (작가 메모)';
    const note = el('note', box, live ? 'textarea' : 'div');
    if (live) {
      note.value = b.note || '';
      note.placeholder = ph;
      note.oninput = () => { b.note = note.value; fillFlap(o.flapR, 'r', o, false); saveSoon(); };
    } else {
      note.dataset.ph = ph;
      note.textContent = b.note || '';
    }
    el('saved', box).textContent = live ? '적으면 저절로 저장돼요' : '';
  }
}
/** 양옆 면을 보는 카메라: 위에서 내려다보며 그 면이 화면에 꽉 차게 (글을 읽고 쓰기 좋게) */
function flapFocus(o, side) {
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  const k = Math.min((innerWidth * 0.46) / (CW / 2), (innerHeight * 0.84) / CH) / o.s;
  return { kind: 'flap', side, cx: side === 'l' ? -PAD - CW / 4 : -PAD + CW + CW / 4, cy: -PAD + CH / 2, k, sy: innerHeight * 0.5 };
}
function lookFlap(side) {
  const o = openState;
  if (!o || o.closing || o.look || o.editing || !scene.classList.contains('is-ready')) return;
  hideCard();
  o.look = { side, back: o.fi };
  o.focus = flapFocus(o, side);
  VIEW.tilt = 0;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  scene.classList.add('look-' + side);
  moveCamera(o, 1.1);
  clearTimeout(o.lookTimer);
  o.lookTimer = setTimeout(() => showFlapPanel(o, side), 1150);
}
/** 카메라가 다 내려다본 뒤, 그 면과 똑같은 자리 · 크기로 쓰기용 판을 겹쳐 띄움 (위에서 본 면은 원근이 없어 네모 그대로) */
function showFlapPanel(o, side) {
  if (openState !== o || !o.look || o.look.side !== side) return;
  const cb = o.doors.find((d) => d.s === side).cb;
  const r = cb.getBoundingClientRect();
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  fillFlap(flappanel.querySelector('.flap'), side, o, true);
  Object.assign(flappanel.style, { width: CW / 2 + 'px', height: CH + 'px', borderRadius: side === 'l' ? '6px 0 0 6px' : '0 6px 6px 0',
    transform: `translate(${r.left}px, ${r.top}px) scale(${r.width / (CW / 2)})` });
  flappanel.classList.add('on');
}
/** 면에서 판으로 돌아감 (i: 갈 구역, 없으면 보던 곳으로) */
function leaveFlap(i) {
  const o = openState;
  if (!o || !o.look) return;
  flappanel.classList.remove('on');
  clearTimeout(o.lookTimer);
  scene.classList.remove('look-l', 'look-r');
  const back = i === undefined ? o.look.back : i;
  o.look = null;
  VIEW.tilt = INIT_VIEW.tilt;
  goZone(back);
}
flappanel.querySelector('.fp-back').onclick = () => leaveFlap();

// ---------- 구역 나누기: 위에서 내려다본 판 위에 네모를 긋고, 옮기고, 크기를 바꾸고, 이름을 붙임 ----------
function startZoneEdit() {
  const o = openState;
  if (!o || o.closing || o.editing) return;
  hideCard();
  flappanel.classList.remove('on');
  clearTimeout(o.lookTimer);
  scene.classList.remove('look-l', 'look-r');
  o.look = null;
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  o.editing = { zones: zonesOf(o.b).map((z) => ({ ...z })), sel: -1 };
  o.focus = { kind: 'edit', cx: o.w / 2, cy: o.h / 2, k: Math.min((innerWidth * 0.62) / CW, (innerHeight * 0.74) / CH) / o.s, sy: innerHeight * 0.53 };
  VIEW.tilt = 0;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  scene.classList.add('is-editing');
  moveCamera(o, 1.1);
  setTimeout(() => {
    if (openState !== o || !o.editing) return;
    const r = o.page.getBoundingClientRect();
    Object.assign(zedit.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    zedit.classList.add('on');
    ztools.classList.add('on');
    drawZoneEdit(o);
  }, 1150);
}
function drawZoneEdit(o) {
  const E = o.editing, CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  zedit.innerHTML = '';
  E.zones.forEach((z, i) => {
    const d = el('zbox' + (i === E.sel ? ' sel' : ''), zedit);
    Object.assign(d.style, { left: ((z.x - o.ox + PAD) / CW) * 100 + '%', top: ((z.y - o.oy + PAD) / CH) * 100 + '%', width: (z.w / CW) * 100 + '%', height: (z.h / CH) * 100 + '%' });
    d.dataset.i = i;
    el('zname', d).textContent = `${i + 1}. ${z.name || '이름 없음'}`;
    el('zgrip', d).dataset.i = i;
  });
  const nm = ztools.querySelector('.zt-name'), del = ztools.querySelector('.zt-del');
  nm.disabled = del.disabled = E.sel < 0;
  nm.value = E.sel < 0 ? '' : E.zones[E.sel].name;
}
zedit.addEventListener('pointerdown', (e) => {
  const o = openState;
  if (!o || !o.editing) return;
  e.preventDefault();
  const E = o.editing, CW = o.w + 2 * PAD;
  const per = CW / zedit.getBoundingClientRect().width; // 화면 1px = 마을 좌표 몇
  const r = zedit.getBoundingClientRect();
  const at = (ev) => ({ x: (ev.clientX - r.left) * per + o.ox - PAD, y: (ev.clientY - r.top) * per + o.oy - PAD });
  const p0 = at(e);
  let mode, i;
  if (e.target.classList.contains('zgrip')) { mode = 'size'; i = Number(e.target.dataset.i); }
  else if (e.target.classList.contains('zbox')) { mode = 'move'; i = Number(e.target.dataset.i); }
  else { mode = 'new'; E.zones.push({ id: 'z' + Date.now().toString(36), name: `구역 ${E.zones.length + 1}`, x: p0.x, y: p0.y, w: 0, h: 0 }); i = E.zones.length - 1; }
  E.sel = i;
  const z = E.zones[i], z0 = { ...z };
  zedit.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const p = at(ev), dx = p.x - p0.x, dy = p.y - p0.y;
    if (mode === 'move') { z.x = z0.x + dx; z.y = z0.y + dy; }
    else if (mode === 'size') { z.w = Math.max(24, z0.w + dx); z.h = Math.max(24, z0.h + dy); }
    else { z.x = Math.min(p0.x, p.x); z.y = Math.min(p0.y, p.y); z.w = Math.abs(dx); z.h = Math.abs(dy); }
    drawZoneEdit(o);
  };
  const up = () => {
    zedit.removeEventListener('pointermove', move);
    zedit.removeEventListener('pointerup', up);
    if (mode === 'new' && (z.w < 24 || z.h < 24)) { E.zones.splice(i, 1); E.sel = -1; } // 그냥 누른 것: 선택만 풂
    drawZoneEdit(o);
    if (mode === 'new' && E.sel >= 0) ztools.querySelector('.zt-name').select();
  };
  zedit.addEventListener('pointermove', move);
  zedit.addEventListener('pointerup', up);
  drawZoneEdit(o);
});
ztools.querySelector('.zt-name').oninput = (e) => {
  const o = openState;
  if (!o?.editing || o.editing.sel < 0) return;
  o.editing.zones[o.editing.sel].name = e.target.value;
  drawZoneEdit(o);
  e.target.focus();
};
// 판이 구역으로 꽉 차 있어 그을 빈자리가 없을 때: 판 가운데에 하나 놓고 옮기거나 늘려 씀
ztools.querySelector('.zt-add').onclick = () => {
  const o = openState;
  if (!o?.editing) return;
  const E = o.editing, w = o.w * 0.34, h = o.h * 0.34;
  E.zones.push({ id: 'z' + Date.now().toString(36), name: `구역 ${E.zones.length + 1}`, x: o.ox + (o.w - w) / 2, y: o.oy + (o.h - h) / 2, w, h });
  E.sel = E.zones.length - 1;
  drawZoneEdit(o);
  ztools.querySelector('.zt-name').select();
};
ztools.querySelector('.zt-del').onclick = () => {
  const o = openState;
  if (!o?.editing || o.editing.sel < 0) return;
  o.editing.zones.splice(o.editing.sel, 1);
  o.editing.sel = -1;
  drawZoneEdit(o);
};
ztools.querySelector('.zt-cancel').onclick = () => endZoneEdit(false);
ztools.querySelector('.zt-save').onclick = () => endZoneEdit(true);
function endZoneEdit(save, quiet) {
  const o = openState;
  if (!o || !o.editing) return;
  if (save) {
    o.b.zones = o.editing.zones.map((z) => ({ id: z.id, name: z.name.trim() || '이름 없는 구역', x: Math.round(z.x), y: Math.round(z.y), w: Math.round(z.w), h: Math.round(z.h) }));
    saveSoon();
  }
  o.editing = null;
  zedit.classList.remove('on');
  ztools.classList.remove('on');
  scene.classList.remove('is-editing');
  fillFlap(o.flapR, 'r', o, false);
  if (quiet) return;
  VIEW.tilt = INIT_VIEW.tilt;
  goZone(-1);
}

document.getElementById('close').onclick = closeBlock;
addEventListener('keydown', (e) => {
  const typing = e.target.closest?.('input, textarea, select');
  const o = openState;
  if (e.key === 'Escape' && typing) { e.target.blur(); return; } // 쓰던 칸에서 Esc 는 칸만 빠져나옴 (책을 덮지 않게)
  if (typing) return;
  if (e.key === 'l' || e.key === 'L') { app.classList.toggle('no-fx'); return; }
  // ← → 구역 옮기기 (펼쳐진 판을 보고 있을 때만)
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && o && !o.look && !o.editing && scene.classList.contains('is-ready')) {
    goZone(o.fi + (e.key === 'ArrowLeft' ? -1 : 1));
    return;
  }
  if (e.key !== 'Escape') return;
  if (o?.editing) endZoneEdit(false);
  else if (o?.look) leaveFlap();
  else if (card.classList.contains('is-open')) hideCard();
  else closeBlock();
});

// 마우스로 보는 각도 돌리기 (끌기) · 가까이 보기 (휠) · 두 번 누르면 정면으로 — 양옆 면을 보거나 구역을 나누는 동안은 멈춤
const freeView = () => scene.classList.contains('is-ready') && openState && !openState.look && !openState.editing;
scene.addEventListener('pointerdown', (e) => {
  if (!freeView() || e.button !== 0 || e.target.closest('.ui, #card')) return;
  drag = { x: e.clientX, y: e.clientY, tilt: VIEW.tilt, yaw: VIEW.yaw, moved: false };
});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  scene.classList.add('is-dragging');
  VIEW.yaw = clampv(drag.yaw - dx * 0.18, LIM.yaw);
  VIEW.tilt = clampv(drag.tilt - dy * 0.15, LIM.tilt);
  applyView(false);
});
const endDrag = () => {
  if (!drag) return;
  scene.classList.remove('is-dragging');
  const d = drag;
  setTimeout(() => { if (drag === d) drag = null; }, 0); // 바로 다음 끌기를 지우지 않게
};
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
// 끌다가 글자·그림이 '끌어다 놓기'로 잡히면 브라우저가 끌기를 끊어 버려서 각도가 멈춤
scene.addEventListener('dragstart', (e) => e.preventDefault());
scene.addEventListener('wheel', (e) => {
  if (!scene.classList.contains('is-ready')) return;
  e.preventDefault();
  if (!freeView()) return;
  VIEW.zoom = clampv(VIEW.zoom * Math.exp(-e.deltaY * 0.0012), LIM.zoom);
  applyView(false);
  rezoomSoon();
}, { passive: false });
scene.addEventListener('dblclick', (e) => {
  if (!freeView() || e.target.closest('.ui, #card, .piece, .flap')) return;
  VIEW.tilt = 72;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  applyView(true);
});

// ---------- 카드: 이야기 · 상태 ----------
const STATES = ['평온', '활기', '분주', '근심', '위기', '비어 있음'];
function showCard(it, im) {
  document.querySelectorAll('.piece.is-sel').forEach((x) => x.classList.remove('is-sel'));
  im.classList.add('is-sel');
  card.innerHTML = '';
  const x = el('x', card, 'button');
  x.textContent = '×';
  x.title = '닫기';
  x.onclick = hideCard;
  el('kind', card).textContent = it.kind === 'person' ? '사 람' : '건 물 · 장 소';
  const nmEl = el('nm', card);
  nmEl.textContent = it.name || '';
  el('', el('orn', card), 'i');
  const pic = el('pic', card);
  const img = el('', pic, 'img');
  img.src = ASSET(it.asset);
  const field = (label, e) => {
    el('', card, 'label').textContent = label;
    card.appendChild(e);
    return e;
  };
  const name = field('이름', document.createElement('input'));
  name.value = it.name || '';
  name.oninput = () => { it.name = name.value; nmEl.textContent = name.value; saveSoon(); };
  const st = field('상태', document.createElement('select'));
  for (const s of STATES) {
    const o = document.createElement('option');
    o.textContent = s;
    st.appendChild(o);
  }
  st.value = STATES.includes(it.state) ? it.state : '평온';
  st.onchange = () => { it.state = st.value; saveSoon(); };
  if (it.kind === 'person') {
    const doing = field('하는 일', document.createElement('input'));
    doing.value = it.doing || '';
    doing.placeholder = '예: 광장에서 연주 중';
    doing.oninput = () => { it.doing = doing.value; saveSoon(); };
  }
  const story = field('이야기', document.createElement('textarea'));
  story.value = it.story || '';
  story.placeholder = it.kind === 'person' ? '이 사람의 사연, 오늘 있었던 일…' : '이 건물에 얽힌 이야기, 지금 안에서 벌어지는 일…';
  story.oninput = () => { it.story = story.value; saveSoon(); };
  el('saved', card).textContent = '적으면 저절로 저장돼요';
  card.classList.add('is-open');
  shiftBook(true);
}
/** 카드가 열리면 책을 왼쪽으로 비켜 줌 */
function shiftBook(left) {
  const o = openState;
  if (!o || !o.s || o.closing) return;
  book.style.transition = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';
  book.style.transform = bookT(o, left);
}
function hideCard() {
  const was = card.classList.contains('is-open');
  card.classList.remove('is-open');
  if (was) shiftBook(false);
  document.querySelectorAll('.piece.is-sel').forEach((x) => x.classList.remove('is-sel'));
}

(async () => {
  town = await loadTown();
  fitOverview();
  drawBoard();
  const refit = () => {
    fitOverview();
    if (openState && openState.s && !openState.closing) { layoutOpen(openState); applyView(false); rezoomSoon(); }
  };
  addEventListener('resize', refit);
  new ResizeObserver(refit).observe(document.getElementById('app'));
  window.town = town;
  window.openBlockById = (id) => openBlock(town.blocks.find((b) => b.id === id));
  window.closeBlock = closeBlock;
  if (Q.get('yaw')) INIT_VIEW.yaw = Number(Q.get('yaw'));
  if (Q.get('tilt')) INIT_VIEW.tilt = Number(Q.get('tilt'));
  if (Q.get('open')) {
    setTimeout(() => window.openBlockById(Q.get('open')), 300);
    if (Q.get('pick')) setTimeout(() => document.querySelectorAll('.piece')[Number(Q.get('pick'))]?.click(), 6200);
    if (Q.get('close')) setTimeout(closeBlock, 300 + Number(Q.get('close'))); // 시험용: 펼치기 시작 n ms 뒤에 덮기 (중간 장면 찍기)
    if (Q.get('zoom')) setTimeout(() => { VIEW.zoom = Number(Q.get('zoom')); applyView(false); rezoomSoon(); }, 300 + 4600); // 시험용: 펼친 뒤 휠로 가까이 본 상태
  }
})();
</script>
