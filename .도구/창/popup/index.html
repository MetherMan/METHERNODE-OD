<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펼쳐지는 마을 (시험)</title>
<style>
  :root {
    --ink: #4a3020; --ink-soft: #7a5a3c; --accent: #a8482f; --gold: #e2c27e; --gold-dim: rgba(226,194,126,0.45);
    --serif: 'Batang', '바탕', 'Noto Serif KR', serif; --hand: 'Gungsuh', '궁서', 'Batang', serif;
  }
  html, body { margin: 0; height: 100%; background: #140c07; font-family: var(--serif); color: var(--ink); overflow: hidden; }
  html.snap *, html.snap *::before, html.snap *::after { transition: none !important; animation: none !important; }
  /* 책상: 등불 하나가 비추는 어두운 나무 책상 */
  #app { position: absolute; inset: 0; background:
      radial-gradient(ellipse 52% 48% at 47% 50%, rgba(255,200,130,0.30), rgba(255,190,120,0.12) 50%, transparent 78%),
      radial-gradient(ellipse 120% 95% at 50% 52%, #4a321e 0%, #2a1b10 50%, #0e0805 100%); }
  #app::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
      repeating-linear-gradient(92deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 9px, rgba(255,220,170,0.02) 9px 10px, transparent 10px 23px); }

  /* ---------- 마을 전체: 책상 위에 놓인 입체 책 ---------- */
  /* 마을 전체: 책상 위에 펼쳐 놓은 그림 지도 한 장 */
  #ov { position: absolute; inset: 0; z-index: 1; }
  #ovmap { position: absolute; border-radius: 3px; box-shadow: 0 2px 0 rgba(255,235,200,0.08) inset, 0 34px 70px rgba(0,0,0,0.62), 0 8px 18px rgba(0,0,0,0.45); }
  #ovmap img { display: block; width: 100%; height: 100%; border-radius: 3px; -webkit-user-drag: none; user-select: none; }
  #ovhits { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 구역 고르기: 딱딱한 테두리 없이, 그 구역에 등불을 비춘 듯 은은하게 */
  #ovhits polygon { fill: rgba(255,226,160,0); stroke: rgba(255,236,190,0); stroke-width: 26; stroke-linejoin: round; cursor: pointer; transition: fill 0.18s ease, stroke 0.18s ease; filter: url(#ovsoft); }
  #ovhits:has(polygon:hover) polygon:not(:hover) { fill: rgba(28,18,10,0.4); stroke: rgba(28,18,10,0.4); }
  #ovhits polygon:hover { fill: rgba(255,236,180,0.14); stroke: rgba(255,226,150,0.35); }
  #ovhits circle { fill: #a8482f; stroke: #f4ead0; stroke-width: 4; pointer-events: none; }
  .f3 { position: absolute; transform-style: preserve-3d; }
  .ov-shadow, .bk-shadow { position: absolute; pointer-events: none; border-radius: 40px;
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10,5,2,0.7), rgba(10,5,2,0.4) 55%, transparent 100%); }
  .board { position: absolute; background-size: 100% 100%; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,220,160,0.12), inset 0 0 22px rgba(0,0,0,0.45); }
  .board-edge { position: absolute; transform-origin: 50% 0; background: linear-gradient(180deg, #5a3520, #2a160b); border-radius: 0 0 6px 6px; }
  .block-edge { position: absolute; transform-origin: 50% 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(255,246,220,0.35), transparent 30%, rgba(60,35,15,0.35)),
      repeating-linear-gradient(180deg, #f1e4c6 0 1.2px, #d8c39b 1.2px 2px, #ead9b6 2px 3.1px, #cdb48a 3.1px 3.6px);
    box-shadow: inset 0 -3px 6px rgba(60,35,15,0.35); }
  .block-side { position: absolute; transform-origin: 0 50%; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,246,220,0.25), rgba(60,35,15,0.4)),
      repeating-linear-gradient(90deg, #efe1c2 0 1.2px, #d4bd94 1.2px 2px, #e8d6b2 2px 3.1px, #c9b085 3.1px 3.6px); }
  /* 덮인 책일 때는 옆 단면을 숨김: 표지와 같은 모서리를 공유하면 크롬 3D 정렬이 표지 왼쪽을 종이 아래로 그려 버림 */
  #scene:not(.is-unfolded) .block-side { visibility: hidden; }
  .pg { position: absolute; top: 0; transform-origin: 0 50%; background-repeat: no-repeat; backface-visibility: hidden; }
  #ovpaper { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; transform-style: preserve-3d; }
  .ov-hit { position: absolute; inset: 0; cursor: pointer; transition: background-color 0.3s; }
  .ov-hit:hover { background-color: rgba(255,214,140,0.22); }
  .ov-piece { position: absolute; transform-origin: 50% 100%; pointer-events: none; transition: transform 0.7s cubic-bezier(.3,1.45,.6,1);
    filter: sepia(0.18) saturate(0.85) brightness(1.02) drop-shadow(0.8px 1px 0 rgba(140,105,70,0.95)); }
  .ov-cast { position: absolute; transform-origin: 50% 100%; pointer-events: none; filter: brightness(0) blur(1.6px); opacity: 0.22; }
  .ov-contact { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(ellipse, rgba(40,24,10,0.55), transparent 70%); transform: translate(-50%, -50%); }
  .storydot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #f4ead0, 0 1px 3px rgba(0,0,0,0.5); pointer-events: none; }

  .heading { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; white-space: nowrap; pointer-events: none;
    color: #efdcb4; font: 400 30px/1 var(--hand); letter-spacing: 0.42em; text-indent: 0.42em; text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,190,110,0.18); }
  .heading::before, .heading::after { content: ''; width: 90px; height: 7px; background:
      radial-gradient(circle, var(--gold) 0 2.4px, transparent 3px) center / 7px 7px no-repeat,
      linear-gradient(var(--gold-dim), var(--gold-dim)) center / 100% 1px no-repeat; }
  #title { top: 26px; transition: opacity 0.5s; z-index: 2; }
  #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: #c9b08a; font: 13px/1.4 var(--serif); letter-spacing: 0.04em; opacity: 0.72; transition: opacity 0.4s; white-space: nowrap; z-index: 2; pointer-events: none; }
  #veil { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.8s;
    background: radial-gradient(ellipse 70% 62% at 50% 58%, rgba(22,14,8,0.5), rgba(10,6,3,0.92) 100%); }
  #app.is-open #veil { opacity: 1; }
  #ovmap { transition: opacity 0.8s; }
  #app.is-open #ovmap { opacity: 0; }
  #app.is-open #title, #app.is-open #hint { opacity: 0; }

  /* ---------- 펼친 책 (정면 · 눈높이) ---------- */
  #scene { position: absolute; inset: 0; z-index: 4; perspective: 1500px; perspective-origin: 50% 38%; pointer-events: none; }
  #scene.is-open { pointer-events: auto; }
  #book { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 50% 50%; }
  /* 책 속은 화면에 보일 크기 그대로 깔아서 그림 (작게 그려 놓고 3D로 키우면 흐려짐) */
  #bookz { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .bk-page { position: absolute; background-size: 100% 100%; box-shadow: inset 0 0 0 10px #efe3c7, inset 0 0 0 11px rgba(120,88,52,0.6); }
  .book-light { position: absolute; pointer-events: none; background:
      radial-gradient(ellipse 62% 58% at 26% 20%, rgba(255,226,170,0.24), transparent 64%),
      radial-gradient(ellipse 95% 95% at 25% 20%, transparent 40%, rgba(70,35,10,0.28) 100%),
      linear-gradient(162deg, transparent 46%, rgba(34,42,80,0.16) 100%),
      linear-gradient(180deg, rgba(40,25,10,0.10), transparent 25%, transparent 80%, rgba(40,25,10,0.12)); }
  .haze { display: none; opacity: 0; position: absolute; inset: -40px; pointer-events: none;
    background: radial-gradient(ellipse closest-side at 50% 56%, rgba(247,242,232,0.94), rgba(241,234,220,0.82) 50%, rgba(236,228,214,0.4) 80%, rgba(236,228,214,0) 100%); }
  #scene.is-unfolded .haze { opacity: 1; transition: opacity 0.5s; }
  #scene.is-unfolded.is-clear .haze { opacity: 0; transition: opacity 1.8s ease-out; }
  .cover {
    position: absolute; transform-origin: 0 50%; transition: transform 1.05s cubic-bezier(.45,.05,.3,1);
    backface-visibility: hidden; border-radius: 6px 9px 9px 6px; background-size: 100% 100%;
    box-shadow: 0 1px 0 rgba(255,220,160,0.25) inset, 0 -2px 6px rgba(0,0,0,0.45) inset, 0 16px 30px rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .cover span { font: 400 40px/1.1 var(--hand); letter-spacing: 0.3em; text-indent: 0.3em; white-space: nowrap; color: #ecca7c;
    background: linear-gradient(180deg, #fff1c0 0%, #e7c071 45%, #a97a2c 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 -1px 0 rgba(60,30,8,0.9)) drop-shadow(0 1px 0 rgba(255,230,170,0.35)); }
  .cover-back { position: absolute; transform-origin: 0 50%; border-radius: 6px 9px 9px 6px; pointer-events: none;
    background: linear-gradient(90deg, rgba(60,35,15,0.3), transparent 14%, transparent 86%, rgba(60,35,15,0.3)), url('/popup/assets/paper_card.jpg') center / cover;
    box-shadow: inset 0 0 0 12px #5a321b, inset 0 0 0 13px rgba(226,194,126,0.55), inset 0 0 30px 14px rgba(60,35,15,0.35); }
  .stand { position: absolute; transform-origin: 50% 100%; -webkit-user-drag: none; user-select: none; }
  .piece { cursor: pointer; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), filter 0.2s; filter: drop-shadow(-1px -1px 0 rgba(255,215,140,0.55)) var(--glow, drop-shadow(0 0 0 transparent)); }
  .piece:hover { --glow: drop-shadow(0 0 6px rgba(255,214,150,0.9)); }
  .piece.is-sel { --glow: drop-shadow(0 0 1.2px rgba(255,248,225,1)) drop-shadow(0 0 7px rgba(255,186,96,0.95)); }
  .piece.person.is-up { animation: bob 2.8s ease-in-out infinite; }
  .piece.hop { animation: hop 0.45s ease-out; }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -2.5px; } }
  @keyframes hop { 0% { translate: 0 0; } 40% { translate: 0 -16px; } 100% { translate: 0 0; } }
  .cast { display: none; }
  .cast.is-up { opacity: 0.2; }
  .contact { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(35,20,8,0.62), rgba(35,20,8,0.25) 45%, transparent 72%); transform: translate(-50%, -50%) scale(0.3); opacity: 0; transition: transform 0.7s, opacity 0.7s; pointer-events: none; }
  .contact.is-up { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .shade { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.9s 0.25s; transform-origin: 50% 100%;
    transform: skewX(42deg) scaleY(-0.62); filter: brightness(0) blur(3px); }
  .shade.is-up { opacity: 0.52; }
  /* 등불 번짐 (서 있는 판) */
  .glow { pointer-events: none; opacity: 0; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), opacity 0.8s; }
  .glow.is-up { opacity: 1; animation: flick 3.2s ease-in-out infinite; }
  @keyframes flick { 0%, 100% { opacity: 0.85; } 45% { opacity: 1; } 70% { opacity: 0.78; } }
  .bd-foot { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.8s; border-top: 1px solid rgba(120,88,52,0.7);
    background: linear-gradient(180deg, #d6c49c, #efe3c7 40%, rgba(246,238,219,0.6)); }
  .bd-foot.is-up { opacity: 1; }
  .backdrop { pointer-events: none; opacity: 0; transition: transform 1s cubic-bezier(.34,1.3,.64,1), opacity 0.8s; filter: blur(1.2px); }
  /* 종이 구름: 표지가 열리면 툭 일어섰다가, 무대 소품처럼 양옆으로 빠짐 */
  .fog { pointer-events: none; transition: transform 0.55s cubic-bezier(.34,1.5,.64,1), opacity 0.3s; }
  .fog.is-off { transition: transform 1.5s cubic-bezier(.55,0,.25,1), opacity 0.35s 1.15s; }
  /* 종이 받침: 오림 그림을 판에 붙인 접힌 종이 띠 */
  .tab { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.4s;
    background: linear-gradient(180deg, #8a6e48 0 1px, #cfbd98 1px 3px, #e6d6b5 3px, #e9dbbd 60%, #dccaa4 100%);
    clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%); filter: drop-shadow(0 1px 1px rgba(40,25,10,0.3)); }
  .tab.is-up { opacity: 0.92; }
  .ptab { transform-origin: 50% 0; }
  .tab.is-up { opacity: 1; }
  .fog.ambient { animation: drift 10s ease-in-out infinite alternate; }
  @keyframes drift { from { translate: -14px 0; } to { translate: 14px 0; } }
  /* ---------- 빛 (HD-2D 풍): 앞뒤 심도 · 빛줄기 · 먼지 · 색보정 — 3D 바깥의 평면 층이라 입체를 안 깨뜨림 ---------- */
  #fx, #ovfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fx-dof { position: absolute; left: 0; right: 0; backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px); transition: backdrop-filter 1.6s, -webkit-backdrop-filter 1.6s; }
  .fx-dof.top { top: 0; height: 44%; -webkit-mask-image: linear-gradient(#000 0%, #000 28%, transparent 100%); mask-image: linear-gradient(#000 0%, #000 28%, transparent 100%); }
  .fx-dof.bot { bottom: 0; height: 14%; -webkit-mask-image: linear-gradient(transparent 0%, #000 100%); mask-image: linear-gradient(transparent 0%, #000 100%); }
  #scene.is-clear .fx-dof.bot { backdrop-filter: blur(1.4px); -webkit-backdrop-filter: blur(1.4px); }
  /* 블룸: 흐리게 한 화면을 밝게 해서 살짝 겹침 (밝은 곳이 빛으로 번짐) */
  .fx-bloom { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s; mix-blend-mode: screen;
    backdrop-filter: brightness(0.55) contrast(4) saturate(1.3) blur(10px); -webkit-backdrop-filter: brightness(0.55) contrast(4) saturate(1.3) blur(10px); }
  #scene.is-clear .fx-bloom { opacity: 0.2; }
  .fx-tone { position: absolute; inset: 0; backdrop-filter: none; transition: backdrop-filter 1.6s; }
  #scene.is-clear .fx-tone { backdrop-filter: contrast(1.08) brightness(0.96) saturate(1.1); -webkit-backdrop-filter: contrast(1.08) brightness(0.96) saturate(1.1); }
  .fx-rays { position: absolute; inset: -10% -10% 0 -10%; opacity: 0; transition: opacity 2s; mix-blend-mode: screen;
    background: repeating-linear-gradient(116deg, rgba(255,226,170,0) 0px, rgba(255,226,170,0.1) 60px, rgba(255,226,170,0) 120px, rgba(255,226,170,0) 210px, rgba(255,236,190,0.07) 250px, rgba(255,226,170,0) 300px);
    -webkit-mask-image: radial-gradient(ellipse 72% 85% at 18% 0%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%); mask-image: radial-gradient(ellipse 72% 85% at 18% 0%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%); }
  #scene.is-clear .fx-rays, #ovfx .fx-rays { opacity: 1; animation: rays 11s ease-in-out infinite alternate; }
  @keyframes rays { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
  .fx-grade { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s;
    background: radial-gradient(ellipse 48% 42% at 30% 22%, rgba(255,206,140,0.12), transparent 70%),
      radial-gradient(ellipse 74% 70% at 48% 50%, transparent 48%, rgba(16,12,30,0.58) 100%); }
  #scene.is-clear .fx-grade { opacity: 1; }
  .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,244,214,0.95), rgba(255,226,170,0.35) 45%, transparent 70%); opacity: 0;
    animation: mote var(--d) linear var(--dl) infinite; }
  #fx .motes { opacity: 0; transition: opacity 2s; }
  #scene.is-clear #fx .motes { opacity: 1; }
  @keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  #ovfx { z-index: 1; }
  #ovfx .fx-rays { opacity: 0.8; }
  #ovfx .fx-bloom { opacity: 0.16; }
  /* 지도 위 등불: 왼쪽 위가 따뜻하게 밝고, 가장자리는 어둑하게 */
  .ov-light { position: absolute; inset: 0; background:
      radial-gradient(ellipse 46% 44% at 34% 30%, rgba(255,214,150,0.14), transparent 70%),
      radial-gradient(ellipse 72% 70% at 50% 50%, transparent 50%, rgba(16,12,28,0.5) 100%); }
  #app.no-fx #fx, #app.no-fx #ovfx { display: none; }
  #scene.is-ready { cursor: grab; }
  #scene.is-dragging { cursor: grabbing; }
  #scene.is-dragging .stand { transition: opacity 2.2s ease-out, filter 0.2s !important; }
  .ui { position: absolute; z-index: 5; }
  #scene-title { top: 26px; opacity: 0; transition: opacity 0.6s; }
  #close { left: 22px; top: 20px; padding: 9px 18px 9px 14px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.42); background: rgba(28,18,10,0.6);
    color: #ecd9b0; font: 14px/1 var(--serif); letter-spacing: 0.12em; cursor: pointer; opacity: 0; transition: opacity 0.4s, background-color 0.2s, border-color 0.2s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  #close::before { content: '‹'; margin-right: 8px; font-size: 18px; vertical-align: -1px; color: var(--gold); }
  #close:hover { background: rgba(60,38,20,0.85); border-color: rgba(226,194,126,0.8); }
  #view-hint { left: 50%; bottom: 18px; transform: translateX(-50%); color: #c9b08a; font: 13px/1.4 var(--serif); letter-spacing: 0.04em; opacity: 0; transition: opacity 0.6s; white-space: nowrap; }
  #scene.is-clear #scene-title, #scene.is-clear #close { opacity: 1; }
  #scene.is-ready #view-hint { opacity: 0.7; }

  /* ---------- 카드: 책갈피에 끼운 장서표 ---------- */
  #card { position: absolute; right: 20px; top: 20px; bottom: 20px; width: 340px; z-index: 6; box-sizing: border-box; padding: 26px 26px 22px;
    background: url('/popup/assets/paper_card.jpg') center / cover, #f2e7cf; border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.4) inset, inset 0 0 0 1px rgba(120,80,45,0.45), inset 0 0 0 7px rgba(255,248,230,0.0), inset 0 0 0 8px rgba(120,80,45,0.35), inset 0 0 40px rgba(120,80,45,0.18);
    transform: translateX(380px) rotate(1.5deg); transition: transform 0.45s cubic-bezier(.2,.8,.2,1); overflow: auto; }
  #card.is-open { transform: translateX(0) rotate(0deg); }
  #card .kind { font: 12px/1 var(--serif); letter-spacing: 0.5em; color: var(--accent); text-align: center; margin-top: 4px; }
  #card .nm { font: 400 28px/1.25 var(--hand); color: #3c2616; margin-top: 10px; text-align: center; letter-spacing: 0.06em; min-height: 35px; }
  #card .orn { display: flex; align-items: center; gap: 12px; margin: 12px 0 2px; }
  #card .orn i { width: 6px; height: 6px; transform: rotate(45deg); background: #b08650; box-shadow: 0 0 0 2px #f2e7cf, 0 0 0 3px rgba(176,134,80,0.6); }
  #card .orn::before, #card .orn::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(140,100,60,0.6), transparent); }
  #card .pic { position: relative; height: 190px; margin: 6px 0 4px; display: flex; align-items: flex-end; justify-content: center;
    background: radial-gradient(ellipse 60% 55% at 50% 62%, rgba(255,250,236,0.9), rgba(255,250,236,0) 72%); }
  #card .pic::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 2px; height: 14px; border-radius: 50%; background: radial-gradient(ellipse, rgba(60,35,15,0.35), transparent 70%); }
  #card img { position: relative; z-index: 1; display: block; max-width: 84%; max-height: 176px; filter: drop-shadow(1px 1.5px 0 rgba(150,115,80,0.9)) drop-shadow(0 6px 8px rgba(60,40,20,0.3)); }
  #card label { display: block; font: 12px/1 var(--serif); letter-spacing: 0.32em; color: #8a6440; margin: 18px 0 6px; }
  #card input, #card select, #card textarea { width: 100%; box-sizing: border-box; font: 15px/1.5 var(--serif); color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid rgba(120,85,50,0.45); border-radius: 0; padding: 4px 2px 6px; outline: none; }
  #card input:focus, #card select:focus, #card textarea:focus { border-bottom-color: var(--accent); }
  #card select { -webkit-appearance: none; appearance: none; cursor: pointer; padding-right: 22px;
    background: linear-gradient(45deg, transparent 50%, #8a6440 50%) calc(100% - 9px) 52% / 5px 5px no-repeat, linear-gradient(-45deg, transparent 50%, #8a6440 50%) calc(100% - 4px) 52% / 5px 5px no-repeat; }
  #card textarea { min-height: 168px; resize: vertical; line-height: 28px; padding: 0 2px; border: 0;
    background: repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,85,50,0.28) 27px 28px); background-attachment: local; }
  #card .saved { font: italic 12px/1.4 var(--serif); color: #9a8266; margin-top: 12px; text-align: right; }
  #card .x { position: absolute; right: 14px; top: 12px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(120,85,50,0.4); background: rgba(255,250,236,0.5);
    font: 16px/1 var(--serif); color: #7a5a3c; cursor: pointer; }
  #card .x:hover { background: rgba(255,250,236,0.95); }
</style>
</head>
<body>
<div id="app">
  <div id="ov"><div id="ovmap"><img id="ovimg" src="/popup/assets/map_town.jpg" alt=""><svg id="ovhits" viewBox="0 0 2400 1500" preserveAspectRatio="none"></svg></div><div id="ovfx"><div class="fx-bloom"></div><div class="fx-rays"></div><div class="motes"></div><div class="ov-light"></div></div></div>
  <div id="title" class="heading">펼쳐지는 마을</div>
  <div id="hint">지도에서 구역을 누르면 그 안이 그림책으로 펼쳐져요 · 펼친 뒤 건물이나 사람을 누르면 이야기와 상태를 적을 수 있어요</div>
  <div id="veil"></div>
  <div id="scene">
    <div id="book"><div id="bookz"></div></div>
    <div id="fx"><div class="fx-tone"></div><div class="fx-bloom"></div><div class="fx-dof bot"></div><div class="fx-rays"></div><div class="motes"></div><div class="fx-grade"></div></div>
    <div id="scene-title" class="ui heading"></div>
    <button id="close" class="ui">책 덮기</button>
    <div id="view-hint" class="ui">끌면 보는 각도가 돌아가요 · 휠로 가까이 · 빈 곳을 두 번 누르면 정면으로 · L 빛 효과 · Esc 덮기</div>
  </div>
  <div id="card"></div>
</div>
<script>
const VERSION = 3;
const SAVE = 'The Archive - 자료/마을 (시험).마을.json';
const ASSET = (p) => '/vault/' + ['The Archive - 자료', '기호', ...p.split('/')].map(encodeURIComponent).join('/');
const LOCAL = (n) => '/popup/assets/' + n;
const FOGS = [1, 2, 3, 4, 5, 6].map((i) => LOCAL(`cloud_${i}.png`)); // 종이 오림 구름
const M = 40; // 블럭 둘레 여백 (쪽 = bbox + 여백)
const PAD = 40; // 인쇄된 판 둘레의 종이 여백 (구운 쪽 그림과 같은 값)
const T_PAGE = 22; // 펼친 책의 책장 묶음 두께
const CART = { plaza: [0.66, 0.371], north: [0.472, 0.555], west: [0.66, 0.332], east: [0.66, 0.276], south: [0.434, 0.554] };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clampv = (v, [a, b]) => Math.max(a, Math.min(b, v));
const Q = new URLSearchParams(location.search);
if (Q.get('snap')) document.documentElement.classList.add('snap');

let town = null;
let saveTimer = null;
function bbox(pts) {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
async function loadTown() {
  try {
    const r = await fetch('/vault/' + SAVE.split('/').map(encodeURIComponent).join('/') + '?t=' + Date.now());
    if (r.ok) {
      const t = await r.json();
      if (t.version === VERSION) return t;
    }
  } catch (e) {}
  const L = await (await fetch('/popup/layout.json?t=' + Date.now())).json();
  let n = 0;
  return {
    version: VERSION,
    blocks: Object.entries(L).map(([id, b]) => {
      const [x0, y0] = bbox(b.poly);
      return { id, name: b.name, poly: b.poly, items: b.items.map((it) => ({ id: 'i' + ++n, ...it, x: it.x + x0 - M, y: it.y + y0 - M, story: '' })) };
    }),
  };
}
function saveSoon() {
  clearTimeout(saveTimer);
  const el = document.querySelector('#card .saved');
  if (el) el.textContent = '저장 중…';
  saveTimer = setTimeout(async () => {
    await fetch('/save?name=' + encodeURIComponent(SAVE), { method: 'POST', body: JSON.stringify(town, null, 1) });
    const e2 = document.querySelector('#card .saved');
    if (e2) e2.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
    drawBoard(false);
  }, 600);
}
function el(cls, parent, tag = 'div') {
  const e = document.createElement(tag);
  e.className = cls;
  parent.appendChild(e);
  return e;
}
function placeBottom(im, it, ox = 0, oy = 0) {
  const set = () => { im.style.top = it.y - oy - im.naturalHeight * (it.w / im.naturalWidth) + 'px'; };
  if (im.complete && im.naturalWidth) set(); else im.addEventListener('load', set, { once: true });
  im.style.width = it.w + 'px';
  im.style.left = it.x - ox - it.w / 2 + 'px';
}
/** 책 한 권의 몸통: 바닥 그림자 · 표지 판 · 책장 묶음의 앞/옆 단면 (x0,y0,w,h = 종이 면) */
function buildSlab(parent, x0, y0, w, h, cover, edgeTop, dims = {}) {
  const T_BLOCK = dims.t || 22, T_BOARD = dims.b || 7, OVERHANG = dims.o || 12;
  const zb = -T_BLOCK;
  const sh = el('ov-shadow', parent);
  Object.assign(sh.style, { left: x0 - 50 + 'px', top: y0 - 20 + 'px', width: w + 130 + 'px', height: h + 110 + 'px', transform: `translateZ(${zb - T_BOARD - 3}px) translate(26px, 34px)` });
  const bd = el('board', parent);
  Object.assign(bd.style, { left: x0 - OVERHANG + 'px', top: y0 - OVERHANG + 'px', width: w + 2 * OVERHANG + 'px', height: h + 2 * OVERHANG + 'px',
    backgroundImage: `url("${cover}")`, transform: `translateZ(${zb}px)` });
  const be = el('board-edge', parent);
  Object.assign(be.style, { left: x0 - OVERHANG + 'px', top: y0 + h + OVERHANG + 'px', width: w + 2 * OVERHANG + 'px', height: T_BOARD + 'px', transform: `translateZ(${zb}px) rotateX(-90deg)` });
  // 앞쪽 책장 단면 (책등 쪽으로 살짝 꺼지는 모양은 clip 으로)
  const fr = el('block-edge', parent);
  Object.assign(fr.style, { left: x0 + 'px', top: y0 + h + 0.8 + 'px', width: w + 'px', height: T_BLOCK + 'px', transform: 'rotateX(-90deg)' });
  if (edgeTop) fr.style.clipPath = edgeTop;
  for (const side of [0, 1]) {
    const s = el('block-side', parent);
    // 종이·표지 면과 딱 겹치면 크롬 3D 정렬이 꼬여서 살짝 밖으로
    Object.assign(s.style, { left: x0 + side * w + (side ? 0.8 : -0.8) + 'px', top: y0 + 'px', width: T_BLOCK + 'px', height: h + 'px', transform: 'rotateY(90deg)' });
  }
}

// ---------- 마을 전체: 책상 위에 펼친 그림 지도 ----------
const ovmap = document.getElementById('ovmap');
const ovhits = document.getElementById('ovhits');
const MAPW = 2400, MAPH = 1500, MS = 1.5; // 지도 그림 = 마을 좌표 x 1.5
const OV = { s: 1 }; // 화면 px / 지도 그림 px
function fitOverview() {
  if (innerWidth < 100 || innerHeight < 100) return; // 창이 가려진 채로 열렸을 때: 보일 때 다시 맞춤
  OV.s = Math.min((innerWidth - 60) / MAPW, (innerHeight - 140) / MAPH);
  const w = MAPW * OV.s, h = MAPH * OV.s;
  Object.assign(ovmap.style, { width: w + 'px', height: h + 'px', left: (innerWidth - w) / 2 + 'px', top: Math.max(70, (innerHeight - h) / 2 + 10) + 'px' });
  document.getElementById('title').style.top = Math.max(14, parseFloat(ovmap.style.top) - 50) + 'px';
}
const poly = (pts) => 'polygon(' + pts.map(([x, y]) => `${x}px ${y}px`).join(',') + ')';
const NS = 'http://www.w3.org/2000/svg';
function drawBoard() {
  ovhits.innerHTML = '<defs><filter id="ovsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter></defs>';
  for (const b of town.blocks) {
    const pg = document.createElementNS(NS, 'polygon');
    pg.setAttribute('points', b.poly.map(([x, y]) => `${x * MS},${y * MS}`).join(' '));
    pg.dataset.id = b.id;
    pg.addEventListener('click', () => openBlock(b));
    const t = document.createElementNS(NS, 'title');
    t.textContent = b.name + ' · 눌러서 펼치기';
    pg.appendChild(t);
    ovhits.appendChild(pg);
    for (const it of b.items) {
      if (!(it.story && it.story.trim())) continue;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', it.x * MS);
      c.setAttribute('cy', it.y * MS + 8);
      c.setAttribute('r', 9);
      ovhits.appendChild(c);
    }
  }
}

// ---------- 빛 (HD-2D 풍) ----------
function makeMotes(box, n) {
  for (let i = 0; i < n; i++) {
    const m = el('mote', box);
    const sz = 2 + Math.random() * 4;
    Object.assign(m.style, { width: sz + 'px', height: sz + 'px', left: Math.random() * 75 + '%', top: 8 + Math.random() * 80 + '%' });
    m.style.setProperty('--d', 7 + Math.random() * 9 + 's');
    m.style.setProperty('--dl', -Math.random() * 14 + 's');
    m.style.setProperty('--o', (0.25 + Math.random() * 0.55).toFixed(2));
    m.style.setProperty('--dx', (Math.random() - 0.3) * 90 + 'px');
    m.style.setProperty('--dy', -(40 + Math.random() * 110) + 'px');
  }
}
makeMotes(document.querySelector('#fx .motes'), 34);
makeMotes(document.querySelector('#ovfx .motes'), 22);
if (Q.get('fx') === '0') document.getElementById('app').classList.add('no-fx');
const LAMPS = ['자연/11', '공공/11']; // 빛나는 것: 가로등 · 빛 구슬 탑

// ---------- 책 펼치기 (정면 시점 · 마우스로 각도 돌리기) ----------
const app = document.getElementById('app');
const scene = document.getElementById('scene');
const book = document.getElementById('book');
const bookz = document.getElementById('bookz');
let BZ = 1; // 책 속 배율 (zoom) — 화면 배율과 같게 맞춰 선명하게
const card = document.getElementById('card');
const VIEW = { tilt: 72, yaw: 0, zoom: 1 };
const INIT_VIEW = { tilt: 72, yaw: 0 };
const LIM = { tilt: [64, 84], yaw: [-32, 32], zoom: [0.6, 2.2] }; // 위에서 내려다보는 각도로는 안 넘어가게
let openState = null;
let drag = null;
const BT = (cx, cy, w, h, s, tilt, yaw, lift = 0) => `translate(${cx - (w * BZ) / 2}px, ${cy - (h * BZ) / 2}px) scale(${s / BZ}) rotateX(${tilt}deg) rotateZ(${yaw}deg) translateZ(${lift * BZ}px)`;
/** 책 속 배율 바꾸기: 화면 모습은 그대로, 그리는 해상도만 바뀜 */
function setBZ(n) {
  n = Math.round(n * 100) / 100;
  if (Math.abs(n - BZ) < 0.01) return;
  BZ = n;
  bookz.style.zoom = n;
  scene.style.perspective = 1500 * n + 'px'; // 크롬은 zoom 안쪽 3D의 원근을 zoom배만큼 세게 그림 → 원근 거리도 같은 배로
  if (!openState) return;
  book.style.width = openState.w * n + 'px';
  book.style.height = openState.h * n + 'px';
}
let rezoomTimer = null;
/** 휠로 가까이 본 뒤 멈추면 그만큼 더 촘촘하게 다시 그림 */
function rezoomSoon() {
  clearTimeout(rezoomTimer);
  rezoomTimer = setTimeout(() => {
    const o = openState;
    if (!o || !o.s || o.closing || drag) return;
    const want = Math.min(5, Math.max(1, o.s * VIEW.zoom));
    if (Math.abs(want / BZ - 1) < 0.15) return;
    const t = book.style.transition;
    book.style.transition = 'none';
    setBZ(want);
    book.style.transform = bookT(o, card.classList.contains('is-open'));
    void book.offsetWidth;
    book.style.transition = t;
  }, 350);
}
/** 서 있는 것: 판의 기울기 · 돌림을 거꾸로 돌려서 늘 우리를 향함. 누워 있으면 판에 붙음 */
function standT(e) {
  const up = e.dataset.up === '1';
  const dx = Number(e.dataset.dx || 0);
  const sc = Number(e.dataset.sc || 1);
  return up
    ? `translateX(${dx}px) rotateZ(${-VIEW.yaw}deg) rotateX(${-VIEW.tilt}deg) scale(${sc})`
    : `translateX(${dx}px) rotateZ(0deg) rotateX(0deg) scale(${sc})`;
}
function bookT(o, left) {
  const k = left ? Math.min(1, (innerWidth - 430) / (innerWidth - 40)) : 1; // 카드 자리만큼 작게
  return BT(left ? (innerWidth - 370) / 2 + 40 : o.cx, left ? o.cy - (1 - k) * 60 : o.cy, o.w, o.h, o.s * VIEW.zoom * k, VIEW.tilt, VIEW.yaw);
}
function applyView(animated) {
  const o = openState;
  if (!o) return;
  book.style.transition = animated ? 'transform 0.45s cubic-bezier(.2,.8,.2,1)' : 'none';
  book.style.transform = bookT(o, card.classList.contains('is-open'));
  for (const e of book.querySelectorAll('.stand')) if (e.dataset.up === '1') e.style.transform = standT(e);
  for (const t of book.querySelectorAll('.ptab')) t.style.transform = `rotateZ(${-VIEW.yaw}deg)`;
}
/** 펼친 책의 크기 · 자리: 책 앞단이 아래 안내문 바로 위에 오도록 (끝 자세를 잠깐 재 봄) */
function layoutOpen(o) {
  const { w, h } = o;
  o.s = 1.08 * Math.min((innerWidth - 300) / (w + 2 * PAD), (innerHeight * 0.64) / ((h + 2 * PAD) * Math.cos((72 * Math.PI) / 180) + o.tall), 3.2);
  o.cx = innerWidth / 2;
  o.cy = innerHeight * 0.64;
  const prev = book.style.transform, prevT = book.style.transition;
  book.style.transition = 'none';
  book.style.transform = BT(o.cx, o.cy, w, h, o.s, 72, 0);
  const pr = o.page.getBoundingClientRect();
  const want = innerHeight - 78 - T_PAGE * o.s - innerHeight * 0.04;
  o.cy = clampv(o.cy + (want - pr.bottom), [innerHeight * 0.5, innerHeight * 0.72]);
  book.style.transform = prev;
  void book.offsetWidth;
  book.style.transition = prevT;
}
/** 멀리(뒤쪽) 있을수록 옅고 푸르스름하게 (공기 원근) · 종이 두께 · 같은 등불 빛 */
function pieceFilter(depth) {
  const sat = 1 - 0.3 * depth, br = 1 + 0.06 * depth, con = 1 - 0.14 * depth;
  return `sepia(${0.08 - 0.05 * depth}) saturate(${sat}) brightness(${br}) contrast(${con}) drop-shadow(1.2px 1.6px 0 rgba(150,118,82,0.95)) drop-shadow(0 3px 3px rgba(50,30,15,0.22)) var(--glow, drop-shadow(0 0 0 transparent))`;
}

async function openBlock(b) {
  if (openState) return;
  const [x0, y0, x1, y1] = bbox(b.poly);
  const ox = x0 - M, oy = y0 - M;
  const w = x1 - x0 + M * 2, h = y1 - y0 + M * 2;
  VIEW.tilt = INIT_VIEW.tilt;
  VIEW.yaw = INIT_VIEW.yaw;
  VIEW.zoom = 1;
  bookz.innerHTML = '';
  // 펼쳤을 때 화면 배율을 미리 어림해서 그만큼 크게 깔아 둠
  BZ = 0;
  setBZ(Math.max(1, 1.08 * Math.min((innerWidth - 300) / (w + 2 * PAD), (innerHeight * 0.64) / ((h + 2 * PAD) * Math.cos((72 * Math.PI) / 180) + 130), 3.2)));
  book.style.width = w * BZ + 'px';
  book.style.height = h * BZ + 'px';
  const add = (cls, tag = 'div') => el(cls, bookz, tag);
  const box = (e, ins) => Object.assign(e.style, { left: -ins + 'px', top: -ins + 'px', width: w + 2 * ins + 'px', height: h + 2 * ins + 'px' });
  // 책 몸통 · 종이
  buildSlab(bookz, -PAD, -PAD, w + 2 * PAD, h + 2 * PAD, LOCAL(`cover_${b.id}.jpg`));
  const page = add('bk-page');
  box(page, PAD);
  page.style.backgroundImage = `url("${LOCAL(`page_${b.id}.jpg`)}")`;
  box(add('book-light'), PAD);
  add('haze');
  // 뒤쪽 배경 막: 먼 풍경 + 가까운 언덕 한 겹 (각도를 돌리면 서로 어긋나며 깊이가 보임)
  const backs = [];
  const wide = w / h > 1.6 ? '_wide' : ''; // 넓은 쪽은 좌우로 늘린 풍경 (배경 막이 너무 높아지지 않게)
  for (const [src, wf, yb, op] of [[`backdrop_far${wide}.png`, 1.0, 6, 1], [`backdrop_mid${wide}.png`, 0.97, 26, 1]]) {
    const foot = add('bd-foot');
    Object.assign(foot.style, { left: (w * (1 - wf)) / 2 + 'px', width: w * wf + 'px', top: yb + 'px', height: '14px' });
    const bd = add('stand backdrop', 'img');
    bd.src = LOCAL(src);
    bd.style.width = w * wf + 'px';
    bd.style.left = (w * (1 - wf)) / 2 + 'px';
    const setTop = () => { bd.style.top = yb - (bd.naturalHeight * (w * wf)) / bd.naturalWidth + 'px'; };
    if (bd.complete && bd.naturalWidth) setTop(); else bd.onload = setTop;
    bd.dataset.up = '0';
    bd.dataset.op = op;
    bd.style.transform = standT(bd);
    backs.push({ bd, foot });
  }
  // 오림 그림 + 바닥 그림자 (누운 채로)
  const pieces = [];
  let tallest = 0;
  for (const it of [...b.items].sort((a, c) => a.y - c.y)) {
    const depth = clampv(1 - (it.y - oy) / h, [0, 1]);
    const cast = add('tab ptab'); // 종이 받침 (판에 붙인 접힌 띠) — 그림이 우리 쪽으로 돌면 받침도 같이 돔
    const tw = Math.max(12, it.w * 0.6);
    Object.assign(cast.style, { left: it.x - ox - tw / 2 + 'px', top: it.y - oy - 0.5 + 'px', width: tw + 'px', height: Math.max(8, Math.min(20, it.w * 0.15)) + 'px' });
    cast.style.transform = `rotateZ(${-VIEW.yaw}deg)`;
    const shd = add('shade', 'img');
    shd.src = ASSET(it.asset);
    shd.draggable = false;
    placeBottom(shd, it, ox, oy);
    const ct = add('contact');
    ct.style.left = it.x - ox + 'px';
    ct.style.top = it.y - oy + 'px';
    ct.style.width = it.w * 0.8 + 'px';
    ct.style.height = it.w * 0.12 + 'px';
    const im = add('stand piece' + (it.kind === 'person' ? ' person' : ''), 'img');
    im.src = ASSET(it.asset);
    im.draggable = false;
    placeBottom(im, it, ox, oy);
    im.dataset.up = '0';
    im.style.transform = standT(im);
    im.addEventListener('load', () => { tallest = Math.max(tallest, (im.naturalHeight * it.w) / im.naturalWidth); }, { once: true });
    im.onclick = (e) => {
      e.stopPropagation();
      if (!scene.classList.contains('is-clear') || drag?.moved) return;
      im.classList.remove('hop');
      void im.offsetWidth;
      im.classList.add('hop');
      showCard(it, im);
    };
    let glow = null;
    if (LAMPS.some((k) => it.asset.includes(k))) {
      // 등불 번짐: 바닥에 발을 둔 판에 빛 동그라미를 그려서, 기둥과 같이 일어서고 같이 돌아감
      glow = add('stand glow');
      const G = Math.max(it.w * 1.7, 64);
      glow.style.width = G + 'px';
      glow.style.left = it.x - ox - G / 2 + 'px';
      const setG = () => {
        const ph = (im.naturalHeight * it.w) / im.naturalWidth;
        const head = ph * (it.asset.includes('자연/11') ? 0.9 : 0.86);
        glow.style.height = head + G / 2 + 'px';
        glow.style.top = it.y - oy + 0.6 - head - G / 2 + 'px';
        glow.style.background = `radial-gradient(circle ${G / 2}px at 50% ${G / 2}px, rgba(255,236,190,0.75), rgba(255,206,130,0.32) 30%, rgba(255,190,110,0.1) 60%, transparent 100%)`;
      };
      if (im.complete && im.naturalWidth) setG(); else im.addEventListener('load', setG, { once: true });
      glow.dataset.up = '0';
      glow.style.transform = standT(glow);
    }
    pieces.push({ im, cast, ct, shd, glow, y: it.y - oy });
  }
  // 구름: 종이로 오린 구름 여러 줄 (처음엔 누워 있다가, 표지가 열리면 툭 일어섬)
  const fogs = [];
  const rows = 3;
  const XS = [[0.27, 0.73], [0.4, 0.84], [0.2, 0.66]];
  for (let r = 0; r < rows; r++) {
    const fy = ((r + 0.85) / rows) * h;
    const n = 2;
    for (let c = 0; c < n; c++) {
      const f = add('stand fog', 'img');
      f.src = FOGS[(r * 2 + c) % FOGS.length];
      const fw = w * (0.5 + 0.08 * Math.random());
      const fx = XS[r][c] * w;
      f.style.width = fw + 'px';
      const left = fx - fw / 2 + (Math.random() - 0.5) * w * 0.05;
      f.style.left = left + 'px';
      f.style.top = fy - fw * 0.37 + 'px';
      const setF = () => { f.style.top = fy - (fw * f.naturalHeight) / f.naturalWidth + 'px'; };
      if (f.complete && f.naturalWidth) setF(); else f.addEventListener('load', setF, { once: true });
      f.style.opacity = 0;
      if (r < rows - 1) f.style.filter = `brightness(${r === 0 ? 0.95 : 0.98})`;
      f.dataset.up = '0';
      f.dataset.sc = (0.7 + 0.45 * Math.random()).toFixed(2);
      f.dataset.dir = c === 0 ? -1 : 1;
      f.dataset.y = fy;
      f.dataset.op = 1;
      f.style.transform = standT(f);
      // 구름 받침: 판에 붙어 있다가 구름과 함께 옆으로 빠짐
      const tb = add('tab');
      const tw = fw * 0.5 * Number(f.dataset.sc || 1);
      Object.assign(tb.style, { left: left + fw / 2 - tw / 2 + 'px', top: fy - 0.5 + 'px', width: tw + 'px', height: Math.max(8, Math.min(20, fw * 0.05)) + 'px' });
      f._tab = tb;
      fogs.push(f);
    }
  }
  // 표지 (안쪽 면 + 바깥 가죽)
  const cb = add('cover-back');
  box(cb, PAD);
  cb.style.transform = 'translateZ(1px) rotateY(0deg)';
  cb.style.opacity = 0; // 덮인 동안은 숨김 (표지와 겹쳐 깜빡이지 않게)
  const cover = add('cover');
  box(cover, PAD);
  cover.style.backgroundImage = `url("${LOCAL(`cover_${b.id}.jpg`)}")`;
  cover.style.transform = 'translateZ(4px) rotateY(0deg)';
  cover.innerHTML = `<span>${b.name}</span>`;
  const [cw, ch] = CART[b.id] || [0.5, 0.4]; // 표지 가운데 틀이 차지하는 비율 (covers.json)
  const fs = Math.min(((w + 2 * PAD) * cw * 0.66) / (b.name.length * 1.3), (h + 2 * PAD) * ch * 0.34);
  cover.firstChild.style.fontSize = fs + 'px';

  // 시작: 지도 위 그 구역 자리에 덮인 책으로 (지도 책과 같은 기울기)
  const mr = ovmap.getBoundingClientRect();
  const startX = mr.left + ((x0 + x1) / 2) * MS * OV.s, startY = mr.top + ((y0 + y1) / 2) * MS * OV.s;
  const bs = MS * OV.s * 0.92;
  const startArgs = [startX, startY, w, h, bs, 0, 0, 2];
  const startT = BT(...startArgs);
  book.style.transition = 'none';
  book.style.transform = startT;
  scene.classList.add('is-open');
  app.classList.add('is-open');
  document.getElementById('scene-title').textContent = b.name;
  openState = { b, pieces, fogs, backs, w, h, startT, startArgs, cover, cb };
  void book.offsetWidth;
  await wait(60);
  // 1) 책이 들려서 화면 한가운데로 나오며 눈높이로 기울어짐
  openState.tall = Math.max(tallest, 130);
  openState.page = page;
  layoutOpen(openState);
  book.style.transform = startT;
  void book.offsetWidth;
  book.style.transition = 'transform 1s cubic-bezier(.2,.8,.2,1)';
  book.style.transform = bookT(openState);
  // 2) 표지가 넘어감 → 안개 낀 장면, 뒤 배경 막이 먼저 섬
  await wait(800);
  scene.classList.add('is-unfolded');
  cover.style.transform = 'translateZ(4px) rotateY(-179deg)';
  cb.style.opacity = 1;
  cb.style.transition = 'transform 1.05s cubic-bezier(.45,.05,.3,1)';
  cb.style.transform = 'translateZ(1px) rotateY(-179deg)';
  setTimeout(() => { cb.style.transition = 'transform 1.05s cubic-bezier(.45,.05,.3,1), opacity 0.45s'; cb.style.opacity = 0; }, 620);
  [...fogs].sort((a, c) => a.dataset.y - c.dataset.y).forEach((f, i) => setTimeout(() => {
    f.dataset.up = '1';
    f.style.opacity = 1;
    f.style.transform = standT(f);
    f._tab.classList.add('is-up');
  }, 560 + i * 40)); // 표지가 반 넘게 넘어간 뒤에 (표지를 뚫고 보이지 않게)
  // 3) 구름이 앞에서부터 양옆으로 빠지고, 빠진 자리부터 일어섬 (맨 뒤 풍경 막은 구름이 빠지기 시작할 때 섬)
  await wait(1500);
  scene.classList.add('is-clear');
  backs.forEach(({ bd, foot }, i) => setTimeout(() => {
    bd.dataset.up = '1';
    bd.style.transform = standT(bd);
    bd.style.opacity = 1;
    foot.classList.add('is-up');
  }, 120 + i * 180));
  const order = [...fogs].sort((a, c) => c.dataset.y - a.dataset.y);
  order.forEach((f, i) => setTimeout(() => {
    f.classList.add('is-off');
    f.dataset.dx = Math.round(f.dataset.dir * w * (1.0 + 0.25 * Math.random()));
    f.style.transform = standT(f);
    f.style.opacity = 0;
    f._tab.style.transition = 'transform 1.5s cubic-bezier(.55,0,.25,1), opacity 0.35s 1.15s';
    f._tab.style.transform = `translateX(${f.dataset.dx}px)`;
    f._tab.classList.remove('is-up');
  }, Math.floor(i / 3) * 200 + Math.random() * 90));
  [...pieces].sort((a, c) => c.y - a.y).forEach((p, i) => setTimeout(() => {
    p.im.dataset.up = '1';
    p.im.style.transform = standT(p.im);
    p.ct.classList.add('is-up');
    p.cast.classList.add('is-up');
    p.shd.classList.add('is-up');
    if (p.glow) { p.glow.dataset.up = '1'; p.glow.style.transform = standT(p.glow); setTimeout(() => p.glow.classList.add('is-up'), 500); }
    setTimeout(() => p.im.classList.add('is-up'), 750);
  }, 250 + (1 - p.y / h) * 1100 + i * 25));
  await wait(2200);
  if (!openState) return;
  scene.classList.add('is-ready');
}

async function closeBlock() {
  if (!openState || openState.closing) return;
  hideCard();
  openState.closing = true;
  scene.classList.remove('is-ready');
  const { pieces, fogs, backs, w, h, startT, cover, cb } = openState;
  VIEW.yaw = 0;
  VIEW.tilt = 72;
  VIEW.zoom = 1;
  book.style.transition = 'transform 0.5s ease';
  book.style.transform = BT(openState.cx, openState.cy, w, h, openState.s, VIEW.tilt, 0);
  fogs.forEach((f, i) => setTimeout(() => {
    f.classList.remove('is-off');
    f.style.transition = 'transform 0.9s cubic-bezier(.3,.1,.3,1), opacity 0.25s';
    f.dataset.dx = 0;
    f.style.transform = standT(f);
    f.style.opacity = 1;
    f._tab.style.transition = 'transform 0.9s cubic-bezier(.3,.1,.3,1), opacity 0.25s';
    f._tab.style.transform = 'translateX(0px)';
    f._tab.classList.add('is-up');
  }, (i % 6) * 60));
  scene.classList.remove('is-clear');
  await wait(550);
  [...pieces].sort((a, c) => a.y - c.y).forEach((p, i) => setTimeout(() => {
    p.im.classList.remove('is-up');
    p.im.style.transition = 'transform 0.35s ease-in';
    p.im.dataset.up = '0';
    p.im.style.transform = standT(p.im);
    p.ct.classList.remove('is-up');
    p.cast.classList.remove('is-up');
    p.shd.classList.remove('is-up');
    if (p.glow) { p.glow.classList.remove('is-up'); p.glow.dataset.up = '0'; p.glow.style.transform = standT(p.glow); }
  }, i * 25));
  for (const { bd, foot } of backs) {
    bd.dataset.up = '0';
    bd.style.transform = standT(bd);
    bd.style.opacity = 0;
    foot.classList.remove('is-up');
  }
  await wait(pieces.length * 25 + 500);
  fogs.forEach((f) => { f.style.transition = 'transform 0.35s ease-in, opacity 0.3s 0.1s'; f.dataset.up = '0'; f.style.transform = standT(f); f.style.opacity = 0; f._tab.classList.remove('is-up'); });
  await wait(300);
  scene.classList.remove('is-unfolded');
  cover.style.transform = 'translateZ(4px) rotateY(0deg)';
  cb.style.opacity = 1;
  cb.style.transform = 'translateZ(1px) rotateY(0deg)';
  await wait(1000);
  cb.style.opacity = 0;
  book.style.transition = 'transform 0.9s cubic-bezier(.2,.8,.2,1)';
  book.style.transform = BT(...openState.startArgs);
  app.classList.remove('is-open');
  await wait(950);
  scene.classList.remove('is-open');
  bookz.innerHTML = '';
  openState = null;
}
document.getElementById('close').onclick = closeBlock;
addEventListener('keydown', (e) => {
  if ((e.key === 'l' || e.key === 'L') && !e.target.closest?.('input, textarea, select')) { app.classList.toggle('no-fx'); return; }
  if (e.key !== 'Escape') return;
  if (card.classList.contains('is-open')) hideCard();
  else closeBlock();
});

// 마우스로 보는 각도 돌리기 (끌기) · 가까이 보기 (휠) · 두 번 누르면 정면으로
scene.addEventListener('pointerdown', (e) => {
  if (!scene.classList.contains('is-ready') || e.button !== 0 || e.target.closest('.ui, #card')) return;
  drag = { x: e.clientX, y: e.clientY, tilt: VIEW.tilt, yaw: VIEW.yaw, moved: false };
});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  scene.classList.add('is-dragging');
  VIEW.yaw = clampv(drag.yaw - dx * 0.18, LIM.yaw);
  VIEW.tilt = clampv(drag.tilt - dy * 0.15, LIM.tilt);
  applyView(false);
});
addEventListener('pointerup', () => {
  if (!drag) return;
  scene.classList.remove('is-dragging');
  setTimeout(() => (drag = null), 0);
});
scene.addEventListener('wheel', (e) => {
  if (!scene.classList.contains('is-ready')) return;
  e.preventDefault();
  VIEW.zoom = clampv(VIEW.zoom * Math.exp(-e.deltaY * 0.0012), LIM.zoom);
  applyView(false);
  rezoomSoon();
}, { passive: false });
scene.addEventListener('dblclick', (e) => {
  if (!scene.classList.contains('is-ready') || e.target.closest('.ui, #card, .piece')) return;
  VIEW.tilt = 72;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  applyView(true);
});

// ---------- 카드: 이야기 · 상태 ----------
const STATES = ['평온', '활기', '분주', '근심', '위기', '비어 있음'];
function showCard(it, im) {
  document.querySelectorAll('.piece.is-sel').forEach((x) => x.classList.remove('is-sel'));
  im.classList.add('is-sel');
  card.innerHTML = '';
  const x = el('x', card, 'button');
  x.textContent = '×';
  x.title = '닫기';
  x.onclick = hideCard;
  el('kind', card).textContent = it.kind === 'person' ? '사 람' : '건 물 · 장 소';
  const nmEl = el('nm', card);
  nmEl.textContent = it.name || '';
  el('', el('orn', card), 'i');
  const pic = el('pic', card);
  const img = el('', pic, 'img');
  img.src = ASSET(it.asset);
  const field = (label, e) => {
    el('', card, 'label').textContent = label;
    card.appendChild(e);
    return e;
  };
  const name = field('이름', document.createElement('input'));
  name.value = it.name || '';
  name.oninput = () => { it.name = name.value; nmEl.textContent = name.value; saveSoon(); };
  const st = field('상태', document.createElement('select'));
  for (const s of STATES) {
    const o = document.createElement('option');
    o.textContent = s;
    st.appendChild(o);
  }
  st.value = STATES.includes(it.state) ? it.state : '평온';
  st.onchange = () => { it.state = st.value; saveSoon(); };
  if (it.kind === 'person') {
    const doing = field('하는 일', document.createElement('input'));
    doing.value = it.doing || '';
    doing.placeholder = '예: 광장에서 연주 중';
    doing.oninput = () => { it.doing = doing.value; saveSoon(); };
  }
  const story = field('이야기', document.createElement('textarea'));
  story.value = it.story || '';
  story.placeholder = it.kind === 'person' ? '이 사람의 사연, 오늘 있었던 일…' : '이 건물에 얽힌 이야기, 지금 안에서 벌어지는 일…';
  story.oninput = () => { it.story = story.value; saveSoon(); };
  el('saved', card).textContent = '적으면 저절로 저장돼요';
  card.classList.add('is-open');
  shiftBook(true);
}
/** 카드가 열리면 책을 왼쪽으로 비켜 줌 */
function shiftBook(left) {
  const o = openState;
  if (!o || !o.s || o.closing) return;
  book.style.transition = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';
  book.style.transform = bookT(o, left);
}
function hideCard() {
  const was = card.classList.contains('is-open');
  card.classList.remove('is-open');
  if (was) shiftBook(false);
  document.querySelectorAll('.piece.is-sel').forEach((x) => x.classList.remove('is-sel'));
}

(async () => {
  town = await loadTown();
  fitOverview();
  drawBoard();
  const refit = () => {
    fitOverview();
    if (openState && openState.s && !openState.closing) { layoutOpen(openState); applyView(false); }
  };
  addEventListener('resize', refit);
  new ResizeObserver(refit).observe(document.getElementById('app'));
  window.town = town;
  window.openBlockById = (id) => openBlock(town.blocks.find((b) => b.id === id));
  window.closeBlock = closeBlock;
  if (Q.get('yaw')) INIT_VIEW.yaw = Number(Q.get('yaw'));
  if (Q.get('tilt')) INIT_VIEW.tilt = Number(Q.get('tilt'));
  if (Q.get('open')) {
    setTimeout(() => window.openBlockById(Q.get('open')), 300);
    if (Q.get('pick')) setTimeout(() => document.querySelectorAll('.piece')[Number(Q.get('pick'))]?.click(), 6200);
  }
})();
</script>
