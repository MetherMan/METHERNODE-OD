// ---------- 보관소 노트 읽기·쓰기 (창: serve3.py · 옵시디언: 플러그인에 부탁) ----------
const NOTE_ROOTS = ['The Main - 지리/', 'The Main - 인물/', 'The Rule - TRPG/기록/'];
const TOWN_NOTES = 'The Main - 지리/펼쳐지는 마을/';
const REC_KINDS = ['세션', '사건', '메모'];
const REC_DIR = { 세션: 'The Rule - TRPG/기록/세션/', 사건: TOWN_NOTES + '사건/', 메모: TOWN_NOTES + '메모/' };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const safeName = (s) => String(s).replace(/[\\/:*?"<>|#^[\]]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || '이름 없음';
function askVault(msg) {
  return new Promise((res) => {
    const id = ++askN;
    asks.set(id, res);
    parent.postMessage({ ...msg, id }, '*');
    setTimeout(() => { if (asks.has(id)) { asks.delete(id); res(null); } }, 6000);
  });
}
addEventListener('message', (e) => {
  const m = e.data || {};
  if ((m.mn === 'list' || m.mn === 'note') && asks.has(m.id)) { asks.get(m.id)(m.mn === 'list' ? m.items : m.ok); asks.delete(m.id); }
});
/** 노트 글 → { fm: 속성, body: 본문 } (간단한 「키: 값」 속성만) */
function fmParse(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text || '');
  const fm = {};
  if (m) for (const line of m[1].split(/\r?\n/)) {
    const k = /^([^:#\s][^:]*):\s*(.*)$/.exec(line);
    if (!k) continue;
    let v = k[2].trim();
    if (/^".*"$/.test(v)) { try { v = JSON.parse(v); } catch (e) {} } else if (/^'.*'$/.test(v)) v = v.slice(1, -1); else if (/^-?\d+(\.\d+)?$/.test(v)) v = Number(v);
    fm[k[1].trim()] = v;
  }
  return { fm, body: m ? text.slice(m[0].length) : text || '' };
}
function fmText(fm) {
  const lines = Object.entries(fm).filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => {
    if (typeof v === 'number') return `${k}: ${v}`;
    const s = String(v);
    return `${k}: ${/^[\w가-힣][\w가-힣 .·()\-]*$/.test(s) && !/^\d/.test(s) ? s : JSON.stringify(s)}`;
  });
  return `---\n${lines.join('\n')}\n---\n`;
}
async function listNotes(prefixes) {
  if (OBS) return (await askVault({ mn: 'list', prefixes })) || [];
  try {
    const files = (await (await fetch('/list?t=' + Date.now())).json()).filter((p) => p.endsWith('.md') && prefixes.some((r) => p.startsWith(r)));
    return Promise.all(files.map(async (path) => ({ path, fm: fmParse(await readVault(path)).fm })));
  } catch (e) {
    return [];
  }
}
async function writeNote(path, text) {
  if (OBS) return !!(await askVault({ mn: 'note', path, text }));
  try {
    const r = await fetch('/save?name=' + encodeURIComponent(path), { method: 'POST', body: text });
    return r.ok;
  } catch (e) {
    return false;
  }
}
/** 노트 속성 일부만 바꿈 (본문과 다른 속성은 그대로) */
async function patchNote(path, patch) {
  const { fm, body } = fmParse((await readVault(path)) || '');
  await writeNote(path, fmText({ ...fm, ...patch }) + body);
}
const openInObsidian = (path) => OBS && parent.postMessage({ mn: 'open', path }, '*');
async function uniquePath(dir, base) {
  const have = new Set((await listNotes([dir])).map((n) => n.path));
  for (let i = 1; ; i++) { const p = `${dir}${base}${i > 1 ? ` (${i})` : ''}.md`; if (!have.has(p)) return p; }
}

// ---------- 기록: 판(지역 · 스테이지)마다 종류별 노트 (세션 · 사건 · 메모) ----------
async function listRecords(o) {
  const all = await listNotes(Object.values(REC_DIR));
  return all.filter((n) => n.fm['분류'] === '기록' && n.fm['자리'] === o.key).sort((a, b) => String(b.fm['날짜'] || '').localeCompare(String(a.fm['날짜'] || '')));
}
async function newRecord(o, kind, title) {
  const d = today();
  const path = await uniquePath(REC_DIR[kind], safeName(kind === '세션' ? `${d} ${title}` : title));
  const fm = { 분류: '기록', 종류: kind, 제목: title, 날짜: d, 마을: '펼쳐지는 마을 (시험)', 장소: o.name, 자리: o.key };
  return (await writeNote(path, fmText(fm) + `# ${title}\n\n`)) ? path : null;
}
const recpanel = document.getElementById('recpanel');
let rec = null; // 지금 크게 펼친 노트 { path, fm, timer }
async function openRecord(path, opts = {}) {
  const text = await readVault(path);

  const { fm, body } = fmParse(text);

  const t = recpanel.querySelector('.rp-title');

  t.readOnly = !!opts.lockTitle;

  recpanel.classList.add('on');

}
function saveRecordSoon() {

  const r = rec;

    if (rec === r) recpanel.querySelector('.rp-saved').textContent = ok ? '저장됨 · ' + new Date().toLocaleTimeString('ko-KR') : '저장하지 못했어요';
    if (openState?.flapR) fillFlap(openState.flapR, 'r', openState, false);
  }, 700);
}
recpanel.querySelector('.rp-body').oninput = saveRecordSoon;
recpanel.querySelector('.rp-title').oninput = saveRecordSoon;
recpanel.querySelector('.rp-open').onclick = () => rec && openInObsidian(rec.path);
recpanel.querySelector('.rp-close').onclick = () => closeRecord();
function closeRecord() {
  recpanel.classList.remove('on');
  rec = null;
}

document.getElementById('close').onclick = closeBlock;
addEventListener('keydown', (e) => {
  const typing = e.target.closest?.('input, textarea, select');
  const o = openState;
  if (e.key === 'Escape' && typing) { e.target.blur(); return; } // 쓰던 칸에서 Esc 는 칸만 빠져나옴 (책을 덮지 않게)
  if (typing) return;
  if (e.key === 'l' || e.key === 'L') { app.classList.toggle('no-fx'); return; }
  if (e.key === 'Backspace' && o?.stage && !o.look && !o.editing && !o.placing) { leaveStage(); return; }
  // ← → 이 마을의 앞 · 다음 장면으로
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && o && !o.look && !o.editing && !o.placing) {
    const bs = town.blocks, i = bs.indexOf(o.root);
    travelTo(bs[(i + (e.key === 'ArrowLeft' ? -1 : 1) + bs.length) % bs.length]);
    return;
  }
  if (e.key !== 'Escape') return;
  if (recpanel.classList.contains('on')) closeRecord();
  else if (o?.editing) endStageEdit(false);
  else if (o?.placing) endPlace();
  else if (o?.look) leaveFlap();
  else if (card.classList.contains('is-open')) hideCard();
  else if (o?.stage) leaveStage();
  else closeBlock();
});

// 마우스로 보는 각도 돌리기 (끌기) · 가까이 보기 (휠) · 두 번 누르면 정면으로 — 양옆 면 · 나누기 · 배치 · 판을 바꾸는 동안은 멈춤
const freeView = () => scene.classList.contains('is-ready') && openState && !openState.look && !openState.editing && !openState.placing && !openState.busy;
scene.addEventListener('pointerdown', (e) => {
  const o = openState;
  // 양옆 면을 내려다보는 중에 판(쓰기용 판 바깥)을 누르면 바로 돌아감
  if (o?.look && e.button === 0 && !e.target.closest('#flappanel, .ui, #card')) { leaveFlap(); return; }
  if (o?.placing && e.button === 0 && !e.target.closest('.ui, #card')) { placeDown(e); return; }
  if (!freeView() || e.button !== 0 || e.target.closest('.ui, #card')) return;

});
addEventListener('pointermove', (e) => {
  if (!drag) return;
  // 단추가 이미 떼어져 있으면 끌기 끝 (옵시디언 액자 밖에서 마우스를 떼면 놓았다는 신호가 안 와서 끌기가 계속 걸려 있었음)
  if (e.buttons === 0) { endDrag(); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  scene.classList.add('is-dragging');
  VIEW.yaw = clampv(drag.yaw - dx * 0.18, LIM.yaw);

});
const endDrag = () => {

addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
// 끌다가 글자·그림이 '끌어다 놓기'로 잡히면 브라우저가 끌기를 끊어 버려서 각도가 멈춤
scene.addEventListener('dragstart', (e) => e.preventDefault());
scene.addEventListener('wheel', (e) => {
  if (!scene.classList.contains('is-ready')) return;
  e.preventDefault();
  if (!freeView()) return;
  VIEW.zoom = clampv(VIEW.zoom * Math.exp(-e.deltaY * 0.0012), LIM.zoom);
  applyView(false);
  rezoomSoon();
}, { passive: false });
scene.addEventListener('dblclick', (e) => {
  if (!freeView() || e.target.closest('.ui, #card, .piece, .flap, .flag')) return;
  VIEW.tilt = 72;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  applyView(true);
});

// ---------- 카드: 사람 · 장소 · 기관의 모습 (하는 일 · 상황 · 현재 · 좋아하는 것 · 싫어하는 것 · 우호도 · 이야기 · 덧붙인 항목) ----------
const STATES = ['평온', '활기', '분주', '근심', '위기', '비어 있음'];
const CATS = ['인물', '장소', '기관'];
const FAVOR = ['원수', '적대', '적대', '경계', '냉담', '중립', '호감', '호의', '우호', '신뢰', '맹우'];
const catOf = (it) => it.cat || (it.kind === 'person' ? '인물' : '장소');
const favorText = (v) => `${v > 0 ? '+' : ''}${v} ${FAVOR[v + 5]}`;
/** 그림 하나의 노트 속성 (카드와 같은 내용) */
function itemFm(it, o) {
  const fm = { 분류: '그림책', 종류: catOf(it), 이름: it.name || '', 상태: it.state || '', '하는 일': it.doing || '', 상황: it.situation || '', 현재: it.now || '',
    '좋아하는 것': it.likes || '', '싫어하는 것': it.dislikes || '', 우호도: Number(it.favor || 0), 마을: '펼쳐지는 마을 (시험)', 장소: o ? o.name : '' };
  for (const x of it.extra || []) if (x.k && x.k.trim()) fm[x.k.trim()] = x.v || '';
  return fm;
}
let cardTimer = null;
function showCard(it, im) {
  document.querySelectorAll('.piece.is-sel').forEach((x) => x.classList.remove('is-sel'));
  im.classList.add('is-sel');
  card.innerHTML = '';
  const o = openState;
  const x = el('x', card, 'button');
  x.textContent = '×';
  x.title = '닫기';
  x.onclick = hideCard;
  const kindEl = el('kind', card);
  const nmEl = el('nm', card);
  nmEl.textContent = it.name || '';
  el('', el('orn', card), 'i');
  const pic = el('pic', card);
  const img = el('', pic, 'img');
  img.src = ASSET(it.asset);
  const saved = () => { saveSoon(); if (it.note) { clearTimeout(cardTimer); cardTimer = setTimeout(() => patchNote(it.note, itemFm(it, o)), 900); } };
  const label = (t, parent = card) => { el('', parent, 'label').textContent = t; };
  const input = (t, key, ph, parent = card, tag = 'input') => {
    label(t, parent);
    const e = el('', parent, tag);
    e.value = it[key] || '';
    if (ph) e.placeholder = ph;
    e.oninput = () => { it[key] = e.value; if (key === 'name') nmEl.textContent = e.value; saved(); };
    return e;
  };
  // 무엇인가: 인물 · 장소 · 기관
  label('무엇');
  const seg = el('seg', card);
  const setCat = (c) => { it.cat = c; kindEl.textContent = [...c].join(' '); seg.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.textContent === c)); };
  for (const c of CATS) { const b = el('', seg, 'button'); b.textContent = c; b.onclick = () => { setCat(c); saved(); }; }
  setCat(catOf(it));
  input('이름', 'name');
  label('상태');
  const st = el('', card, 'select');
  for (const s of STATES) el('', st, 'option').textContent = s;
  st.value = STATES.includes(it.state) ? it.state : '평온';
  st.onchange = () => { it.state = st.value; saved(); };
  input('하는 일', 'doing', '무엇을 하는 곳 · 사람인가');
  input('상황', 'situation', '지금 처한 형편');
  input('현재', 'now', '지금 이 순간 벌어지는 일');
  const two = el('two', card);
  input('좋아하는 것', 'likes', '', el('', two));
  input('싫어하는 것', 'dislikes', '', el('', two));
  label('우호도 (일행에게)');
  const fv = el('favor', card);
  const range = el('', fv, 'input');
  Object.assign(range, { type: 'range', min: -5, max: 5, step: 1, value: Number(it.favor || 0) });
  const ft = el('', fv, 'span');
  ft.textContent = favorText(Number(range.value));
  range.oninput = () => { it.favor = Number(range.value); ft.textContent = favorText(it.favor); saved(); };
  input('이야기', 'story', '얽힌 이야기 · 내력 (길게는 아래 노트에)', card, 'textarea').style.minHeight = '110px';
  // 덧붙인 항목: 작가가 필요한 칸을 더 만들어 씀 (예: 소속 · 비밀 · 거래 품목)
  label('덧붙인 항목');
  const xs = el('', card);
  const drawExtra = () => {
    xs.innerHTML = '';
    (it.extra || []).forEach((row, i) => {
      const r = el('extra', xs);
      const k = el('', r, 'input'), v = el('', r, 'input'), del = el('', r, 'button');
      k.value = row.k || ''; k.placeholder = '항목';
      v.value = row.v || ''; v.placeholder = '내용';
      del.textContent = '×';
      k.oninput = () => { row.k = k.value; saved(); };
      v.oninput = () => { row.v = v.value; saved(); };
      del.onclick = () => { it.extra.splice(i, 1); drawExtra(); saved(); };
    });
  };
  drawExtra();
  const addx = el('addx', card, 'button');
  addx.textContent = '＋ 항목';
  addx.onclick = () => { (it.extra ||= []).push({ k: '', v: '' }); drawExtra(); xs.lastChild?.querySelector('input')?.focus(); };
  // 노트: 길게 적을 곳 (옵시디언 노트 한 장, 속성은 위 카드와 같이 맞춰 둠)
  const nb = el('notebox', card);
  const np = el('np', nb);
  const mk = el('go', nb, 'button'), big = el('', nb, 'button'), obs = el('', nb, 'button');
  mk.textContent = '노트 만들기';
  big.textContent = '크게 쓰기';
  obs.textContent = '옵시디언에서 열기';
  const drawNote = () => {
    np.textContent = it.note ? '노트: ' + it.note : '길게 적을 곳이 필요하면 노트를 만들어요 (속성은 이 카드와 같이 맞춰져요).';
    mk.hidden = !!it.note;
    big.hidden = !it.note;
    obs.hidden = !it.note || !OBS;
  };
  mk.onclick = async () => {
    const dir = catOf(it) === '인물' ? 'The Main - 인물/펼쳐지는 마을/' : `${TOWN_NOTES}${safeName(o.root.name)}/`;
    const path = await uniquePath(dir, safeName(it.name || it.asset.split('/').pop().replace(/^\d+\s*|\.png$/g, '')));
    if (await writeNote(path, fmText(itemFm(it, o)) + `# ${it.name || ''}\n\n${it.story || ''}\n`)) { it.note = path; saveSoon(); drawNote(); }
    else np.textContent = '노트를 만들지 못했어요.';
  };
  big.onclick = () => openRecord(it.note, { lockTitle: true });
  obs.onclick = () => openInObsidian(it.note);
  drawNote();
  el('saved', card).textContent = '적으면 저절로 저장돼요';
  card.classList.add('is-open');
  shiftBook(true);
}
/** 카드가 열리면 책을 왼쪽으로 비켜 줌 */
function shiftBook(left) {
  const o = openState;
  if (!o || !o.s || o.closing) return;
  book.style.transition = 'transform 0.45s cubic-bezier(.2,.8,.2,1)';
  book.style.transform = bookT(o, left);
}
function hideCard() {
  const was = card.classList.contains('is-open');
  card.classList.remove('is-open');
  if (was) shiftBook(false);
  document.querySelectorAll('.piece.is-sel').forEach((x) => x.classList.remove('is-sel'));
}

(async () => {
  town = await loadTown();
  fitOverview();
  drawBoard();
  const refit = () => {
    fitOverview();
    if (openState && openState.s && !openState.closing) { layoutOpen(openState); applyView(false); rezoomSoon(); }
  };
  addEventListener('resize', refit);
  new ResizeObserver(refit).observe(document.getElementById('app'));
  window.town = town;
  window.openBlockById = (id) => openBlock(town.blocks.find((b) => b.id === id));
  window.closeBlock = closeBlock;
  if (Q.get('yaw')) INIT_VIEW.yaw = Number(Q.get('yaw'));
  if (Q.get('tilt')) INIT_VIEW.tilt = Number(Q.get('tilt'));
  if (Q.get('open')) {
    setTimeout(() => window.openBlockById(Q.get('open')), 300);
    if (Q.get('pick')) setTimeout(() => document.querySelectorAll('.piece')[Number(Q.get('pick'))]?.click(), 6200);
    if (Q.get('close')) setTimeout(closeBlock, 300 + Number(Q.get('close'))); // 시험용: 펼치기 시작 n ms 뒤에 덮기 (중간 장면 찍기)
    if (Q.get('zoom')) setTimeout(() => { VIEW.zoom = Number(Q.get('zoom')); applyView(false); rezoomSoon(); }, 300 + 4600); // 시험용: 펼친 뒤 휠로 가까이 본 상태
  }
})();
</script>
</body>
</html>
