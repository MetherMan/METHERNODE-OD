<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펼쳐지는 마을 (시험)</title>
<style>
  :root {
    --ink: #4a3020; --ink-soft: #7a5a3c; --accent: #a8482f; --gold: #e2c27e; --gold-dim: rgba(226,194,126,0.45);
    --serif: 'Batang', '바탕', 'Noto Serif KR', serif; --hand: 'Gungsuh', '궁서', 'Batang', serif;
  }
  html, body { margin: 0; height: 100%; background: #140c07; font-family: var(--serif); color: var(--ink); overflow: hidden; }
  html.snap *, html.snap *::before, html.snap *::after { transition: none !important; animation: none !important; }
  /* 책상: 등불 하나가 비추는 어두운 나무 책상 */
  #app { position: absolute; inset: 0; overflow: hidden; background:
      radial-gradient(ellipse 52% 48% at 47% 50%, rgba(255,200,130,0.30), rgba(255,190,120,0.12) 50%, transparent 78%),
      radial-gradient(ellipse 120% 95% at 50% 52%, #4a321e 0%, #2a1b10 50%, #0e0805 100%); }
  #app::after { content: ''; position: absolute; inset: 0; pointer-events: none; background:
      repeating-linear-gradient(92deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 9px, rgba(255,220,170,0.02) 9px 10px, transparent 10px 23px); }

  /* ---------- 마을 전체: 책상 위에 놓인 입체 책 ---------- */
  /* 마을 전체: 책상 위에 펼쳐 놓은 그림 지도 한 장 */
  #ov { position: absolute; inset: 0; z-index: 1; }
  #ovmap { position: absolute; border-radius: 3px; box-shadow: 0 2px 0 rgba(255,235,200,0.08) inset, 0 34px 70px rgba(0,0,0,0.62), 0 8px 18px rgba(0,0,0,0.45); }
  #ovmap img { display: block; width: 100%; height: 100%; border-radius: 3px; -webkit-user-drag: none; user-select: none; }
  #ovhits { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 구역 고르기: 딱딱한 테두리 없이, 그 구역에 등불을 비춘 듯 은은하게 */
  #ovhits polygon { fill: rgba(255,226,160,0); stroke: rgba(255,236,190,0); stroke-width: 26; stroke-linejoin: round; cursor: pointer; transition: fill 0.18s ease, stroke 0.18s ease; filter: url(#ovsoft); }
  #ovhits:has(polygon:hover) polygon:not(:hover) { fill: rgba(28,18,10,0.4); stroke: rgba(28,18,10,0.4); }
  #ovhits polygon:hover { fill: rgba(255,236,180,0.14); stroke: rgba(255,226,150,0.35); }
  #ovhits circle { fill: #a8482f; stroke: #f4ead0; stroke-width: 4; pointer-events: none; }
  .f3 { position: absolute; transform-style: preserve-3d; }
  /* 판 둘레의 지도: 화면의 지도와 똑같이 깔려 있다가 카메라가 다가가면 함께 기울고, 가장자리는 어둠에 녹음.
     흐려도 되는 배경이라 작게 그려 늘림 (SUR_Q) */
  .surround { position: absolute; transform-origin: 0 0; background-repeat: no-repeat; pointer-events: none; transition: filter 1.4s; }
  #scene.is-unfolded .surround { filter: brightness(0.62) saturate(0.85); }
  /* 스테이지 둘레의 지역 판 종이: 바뀐 직후엔 지역 판과 똑같이, 그 뒤 살짝 가라앉아 스테이지가 돋보이게 (나올 땐 먼저 밝아짐) */
  .parent-page { position: absolute; transform-origin: 0 0; background-size: 100% 100%; background-repeat: no-repeat; pointer-events: none; transition: filter 1.2s;
    box-shadow: inset 0 0 0 0.75px rgba(50,28,10,0.6), inset 0 0 0 5px #efe3c7, inset 0 0 9px 5px rgba(60,35,15,0.28); }
  .parent-page.dim { filter: brightness(0.62) saturate(0.8); }
  .pg { position: absolute; top: 0; transform-origin: 0 50%; background-repeat: no-repeat; backface-visibility: hidden; }
  #ovpaper { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; transform-style: preserve-3d; }
  .ov-hit { position: absolute; inset: 0; cursor: pointer; transition: background-color 0.3s; }
  .ov-hit:hover { background-color: rgba(255,214,140,0.22); }
  .ov-piece { position: absolute; transform-origin: 50% 100%; pointer-events: none; transition: transform 0.7s cubic-bezier(.3,1.45,.6,1);
    filter: sepia(0.18) saturate(0.85) brightness(1.02) drop-shadow(0.8px 1px 0 rgba(140,105,70,0.95)); }
  .ov-cast { position: absolute; transform-origin: 50% 100%; pointer-events: none; filter: brightness(0) blur(1.6px); opacity: 0.22; }
  .ov-contact { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(ellipse, rgba(40,24,10,0.55), transparent 70%); transform: translate(-50%, -50%); }
  .storydot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #f4ead0, 0 1px 3px rgba(0,0,0,0.5); pointer-events: none; }

  .heading { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; white-space: nowrap; pointer-events: none;
    color: #efdcb4; font: 400 30px/1 var(--hand); letter-spacing: 0.42em; text-indent: 0.42em; text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 18px rgba(255,190,110,0.18); }
  .heading::before, .heading::after { content: ''; width: 90px; height: 7px; background:
      radial-gradient(circle, var(--gold) 0 2.4px, transparent 3px) center / 7px 7px no-repeat,
      linear-gradient(var(--gold-dim), var(--gold-dim)) center / 100% 1px no-repeat; }
  #title { top: 26px; transition: opacity 0.5s; z-index: 2; }
  #hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: #c9b08a; font: 13px/1.4 var(--serif); letter-spacing: 0.04em; opacity: 0.72; transition: opacity 0.4s; white-space: nowrap; z-index: 2; pointer-events: none; }
  #veil { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.8s;
    background: radial-gradient(ellipse 70% 62% at 50% 58%, rgba(22,14,8,0.5), rgba(10,6,3,0.92) 100%); }
  #app.is-open #veil { opacity: 1; }
  #ovmap, #ovfx { transition: opacity 0.8s; }
  #app.is-open #ovmap, #app.is-open #ovfx { opacity: 0; }
  #app.is-open #title, #app.is-open #hint { opacity: 0; }

  /* ---------- 펼친 책 (정면 · 눈높이) ---------- */
  #scene { position: absolute; inset: 0; z-index: 4; perspective: 1500px; perspective-origin: 50% 38%; pointer-events: none; user-select: none; -webkit-user-select: none; }
  #scene.is-open { pointer-events: auto; }
  /* 책은 지도 자리에서 스르르 나타나고, 덮은 뒤엔 제자리에 내려앉는 끝자락에 지도로 녹아듦 (툭 튀거나 사라지지 않게)
     — 흐림은 #book 이 아니라 #scene 에: 입체 묶음(preserve-3d)에 opacity 를 주면 크롬이 입체를 납작하게 눌러 버림 */
  #scene { opacity: 0; transition: opacity 0.35s 0.5s; }
  #scene.is-open { opacity: 1; transition: opacity 0.3s; }
  #book { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 50% 50%; }
  /* 책 속은 화면에 보일 크기 그대로 깔아서 그림 (작게 그려 놓고 3D로 키우면 흐려짐) */
  #bookz { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .bk-page { position: absolute; background-size: 100% 100%; box-shadow: inset 0 0 0 1.5px rgba(50,28,10,0.6), inset 0 0 0 10px #efe3c7, inset 0 0 0 11px rgba(120,88,52,0.6), inset 0 0 18px 10px rgba(60,35,15,0.28); }
  /* 판에 붙어 누운 것들(받침·그림자·등불빛·배경 막 발치)은 종이 면 안에 같이 그림: 따로 띄우면 하나하나가 입체 층이 되어
     메모리를 먹고, 종이와 같은 높이라 크롬 3D 정렬이 꼬임 */
  .deco { position: absolute; }
  .book-light { position: absolute; pointer-events: none; background:
      radial-gradient(ellipse 62% 58% at 26% 20%, rgba(255,226,170,0.24), transparent 64%),
      radial-gradient(ellipse 95% 95% at 25% 20%, transparent 40%, rgba(70,35,10,0.28) 100%),
      linear-gradient(162deg, transparent 46%, rgba(34,42,80,0.16) 100%),
      linear-gradient(180deg, rgba(40,25,10,0.10), transparent 25%, transparent 80%, rgba(40,25,10,0.12)); }
  .haze { display: none; opacity: 0; position: absolute; inset: -40px; pointer-events: none;
    background: radial-gradient(ellipse closest-side at 50% 56%, rgba(247,242,232,0.94), rgba(241,234,220,0.82) 50%, rgba(236,228,214,0.4) 80%, rgba(236,228,214,0) 100%); }
  #scene.is-unfolded .haze { opacity: 1; transition: opacity 0.5s; }
  #scene.is-unfolded.is-clear .haze { opacity: 0; transition: opacity 1.8s ease-out; }
  /* 덮개: 판 자리의 지도 그림 그대로인 두 짝. 가운데가 갈라져 바깥 모서리를 축으로 양옆으로 열리고, 열린 채 지도 위에 누움 */
  .cover { position: absolute; transition: transform 1.05s cubic-bezier(.45,.05,.3,1), filter 1.4s; backface-visibility: hidden; background-repeat: no-repeat; }
  /* 둘레 지도와 같은 밝기로 (장면을 옮겨 갈 때 닫힌 덮개가 둘레 지도에 그대로 섞이게) */
  #scene.is-unfolded .cover { filter: brightness(0.62) saturate(0.85); }
  .cover.l { transform-origin: 0 50%; box-shadow: -1px 0 0 rgba(40,22,8,0.55) inset; }
  .cover.r { transform-origin: 100% 50%; box-shadow: 1px 0 0 rgba(40,22,8,0.55) inset; }
  .cover-back { position: absolute; pointer-events: none; transition: transform 1.05s cubic-bezier(.45,.05,.3,1), filter 1.4s;
    background: linear-gradient(90deg, rgba(60,35,15,0.3), transparent 14%, transparent 86%, rgba(60,35,15,0.3)), url('assets/paper_card.jpg') center / cover;
    box-shadow: inset 0 0 0 12px #5a321b, inset 0 0 0 13px rgba(226,194,126,0.55), inset 0 0 30px 14px rgba(60,35,15,0.35); }
  .cover-back.l { transform-origin: 0 50%; border-radius: 6px 0 0 6px; }
  .cover-back.r { transform-origin: 100% 50%; border-radius: 0 6px 6px 0; }
  /* 양옆에 펼쳐져 누운 안쪽 면은 판보다 튀지 않게 둘레 지도처럼 살짝 가라앉힘 */
  #scene.is-unfolded .cover-back { filter: brightness(0.7) saturate(0.85); }
  .stand { position: absolute; transform-origin: 50% 100%; -webkit-user-drag: none; user-select: none; }
  /* 평소엔 거름(filter)을 걸지 않음: 입체 속 그림에 거름을 걸면 크롬이 그 그림을 낮은 해상도로 따로 그려서 인물 둘레가 뿌옇게 번졌음.
     고를 때만 빛남 (--k: 그림을 k배 크게 깔고 줄여 보이므로 빛 번짐도 k배) */
  .piece { cursor: pointer; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), filter 0.2s; }
  .piece:hover { filter: drop-shadow(0 0 calc(5px * var(--k, 1)) rgba(255,214,150,0.9)); }
  .piece.is-sel { filter: drop-shadow(0 0 calc(1.2px * var(--k, 1)) rgba(255,248,225,1)) drop-shadow(0 0 calc(7px * var(--k, 1)) rgba(255,186,96,0.95)); }
  /* 서 있는 그림은 판에 수직으로 서 있으므로, 들썩임은 판의 법선(z) 방향으로 */
  .piece.person.is-up { animation: bob 2.8s ease-in-out infinite; }
  .piece.hop { animation: hop 0.45s ease-out; }
  @keyframes bob { 0%, 100% { translate: 0 0 0; } 50% { translate: 0 0 2.5px; } }
  @keyframes hop { 0% { translate: 0 0 0; } 40% { translate: 0 0 16px; } 100% { translate: 0 0 0; } }
  .cast { display: none; }
  .cast.is-up { opacity: 0.2; }
  /* 바닥 그림자·받침·번짐: 일어설 때는 천천히 배어나고, 누울 때는 그림과 같이 바로 걷힘 */
  .contact { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(35,20,8,0.62), rgba(35,20,8,0.25) 45%, transparent 72%); transform: translate(-50%, -50%) scale(0.3); opacity: 0; transition: transform 0.35s, opacity 0.3s; pointer-events: none; }
  .contact.is-up { transform: translate(-50%, -50%) scale(1); opacity: 1; transition: transform 0.7s, opacity 0.7s; }
  .shade { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.3s; transform-origin: 50% 100%;
    transform: skewX(30deg) scaleY(-0.55); filter: brightness(0) blur(2.5px); }
  .shade.is-up { opacity: 0.5; transition: opacity 0.9s 0.25s; }
  /* 등불 번짐 (서 있는 판) */
  .glow { pointer-events: none; opacity: 0; transition: transform 0.4s ease-in, opacity 0.3s; }
  .glow.is-up { opacity: 1; animation: flick 3.2s ease-in-out infinite; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), opacity 0.8s; }
  @keyframes flick { 0%, 100% { opacity: 0.85; } 45% { opacity: 1; } 70% { opacity: 0.78; } }
  .bd-foot { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.3s; border-top: 1px solid rgba(120,88,52,0.7);
    background: linear-gradient(180deg, #d6c49c, #efe3c7 40%, rgba(246,238,219,0.6)); }
  .bd-foot.is-up { opacity: 1; transition: opacity 0.8s; }
  /* 배경 막: 종이에 그린 무대 막이므로 또렷하게 두고, 맨 뒤 풍경만 아주 살짝 멀어 보이게 */
  .backdrop { pointer-events: none; opacity: 0; transition: transform 1s cubic-bezier(.34,1.3,.64,1), opacity 0.8s; }
  .backdrop.far { filter: blur(0.4px); }
  /* 종이 구름: 표지가 열리면 툭 일어섰다가, 무대 소품처럼 양옆으로 빠짐 */
  .fog { pointer-events: none; transition: transform 0.55s cubic-bezier(.34,1.5,.64,1), opacity 0.3s; }
  .fog.is-off { transition: transform 1.5s cubic-bezier(.55,0,.25,1), opacity 1s 0.2s; }
  /* 종이 받침: 오림 그림을 판에 붙인 접힌 종이 띠 */
  .tab { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.4s;
    background: linear-gradient(180deg, #8a6e48 0 1px, #cfbd98 1px 3px, #e6d6b5 3px, #e9dbbd 60%, #dccaa4 100%);
    clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%); filter: drop-shadow(0 1px 1px rgba(40,25,10,0.3)); }
  .tab.is-up { opacity: 0.92; }
  .ptab { transform-origin: 50% 0; }
  .tab.is-up { opacity: 1; }
  .fog.ambient { animation: drift 10s ease-in-out infinite alternate; }
  @keyframes drift { from { translate: -14px 0; } to { translate: 14px 0; } }
  /* ---------- 하늘: 눈높이로 내려오면 판 너머(지도가 어둠에 녹는 곳) 위로 저녁 하늘이 밝아 오고 종이 구름이 흘러감.
     3D 바깥의 평면이라 메모리를 거의 안 먹음. 보는 각도에 따라 살짝 따라 움직임 (applyView) ---------- */
  /* 아래쪽은 색 자체를 투명하게 녹임 (가리개 mask 를 쓰면 그래픽 메모리를 두 배로 먹어 큰 판에서 종이가 빠졌음) */
  /* 보는 각도를 돌리면 하늘이 따라 움직이므로 화면보다 훨씬 넓고 위로 길게 깖 (가장자리가 화면 안에 들어와 어두운 띠가 보였음).
     화면 기준 지평선 자리는 그대로: 이 판의 아래쪽 34% 만 실제로 보이는 노을 */
  #sky { position: absolute; left: -30%; right: -30%; top: -60%; height: 126%; pointer-events: none; opacity: 0; transition: opacity 1.8s; }
  #scene.is-unfolded #sky { opacity: 1; }
  #app.no-fx #sky { display: none; }
  .sky-grad { position: absolute; inset: 0; opacity: 0.92;
    background: linear-gradient(180deg, #13152b 0%, #171a33 41%, #2c2c4d 53%, #5e4c62 63%, #a7735f 72%, rgba(217,160,108,0.75) 79%, rgba(233,182,126,0.3) 86%, rgba(233,182,126,0) 94%); }
  .sky-sun { position: absolute; left: 25%; bottom: 0; width: 32%; height: 37%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,226,160,0.55), rgba(255,196,120,0.22) 45%, transparent 100%); }
  .sky-stars { position: absolute; inset: 30% 0 38% 0; opacity: 0.55;
    background-image: radial-gradient(1px 1px at 12% 18%, #fff6dc, transparent), radial-gradient(1px 1px at 27% 8%, #fff6dc, transparent), radial-gradient(1.4px 1.4px at 44% 22%, #fff3d0, transparent),
      radial-gradient(1px 1px at 61% 11%, #fff6dc, transparent), radial-gradient(1.2px 1.2px at 78% 26%, #fff3d0, transparent), radial-gradient(1px 1px at 90% 9%, #fff6dc, transparent),
      radial-gradient(1px 1px at 6% 34%, #fff6dc, transparent), radial-gradient(1px 1px at 53% 36%, #fff6dc, transparent), radial-gradient(1px 1px at 70% 40%, #fff3d0, transparent);
    animation: twinkle 5s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.35; } to { opacity: 0.7; } }
  /* 종이 구름: 판 위의 오림 구름과 같은 종이를 하늘에 띄움. 저녁빛에 물들고, 먼 것일수록 작고 옅고 느림 */
  .sky-cloud { position: absolute; left: 0; opacity: var(--o); filter: sepia(0.35) saturate(1.2) brightness(var(--b)) hue-rotate(-8deg);
    animation: skydrift var(--d) linear var(--dl) infinite; }
  @keyframes skydrift { from { transform: translateX(-30vw); } to { transform: translateX(115vw); } }
  /* ---------- 빛 (HD-2D 풍): 빛줄기 · 먼지 · 색보정 — 3D 바깥의 평면 층이라 입체를 안 깨뜨림 ---------- */
  #fx, #ovfx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  /* 블룸: 아주 밝은 곳(등불·분수)만 골라 살짝 번지게. 종이 전체가 뿌옇게 되지 않도록 문턱을 높이고 약하게 */
  .fx-bloom { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s; mix-blend-mode: screen;
    backdrop-filter: brightness(0.42) contrast(6) saturate(1.3) blur(8px); -webkit-backdrop-filter: brightness(0.42) contrast(6) saturate(1.3) blur(8px); }
  /* 색보정·블룸·그늘은 책이 뜨는 순간부터 켬: 구름이 걷힐 때까지 기다리면 펼치는 동안 종이가 허옇게 바래 보였음 */
  #scene.is-open .fx-bloom { opacity: 0.1; }
  .fx-tone { position: absolute; inset: 0; backdrop-filter: none; transition: backdrop-filter 1.6s; }
  #scene.is-open .fx-tone { backdrop-filter: contrast(1.08) brightness(0.96) saturate(1.1); -webkit-backdrop-filter: contrast(1.08) brightness(0.96) saturate(1.1); }
  .fx-rays { position: absolute; inset: -10% -10% 0 -10%; opacity: 0; transition: opacity 2s; mix-blend-mode: screen;
    background: repeating-linear-gradient(116deg, rgba(255,226,170,0) 0px, rgba(255,226,170,0.1) 60px, rgba(255,226,170,0) 120px, rgba(255,226,170,0) 210px, rgba(255,236,190,0.07) 250px, rgba(255,226,170,0) 300px);
    -webkit-mask-image: radial-gradient(ellipse 72% 85% at 18% 0%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%); mask-image: radial-gradient(ellipse 72% 85% at 18% 0%, #000 0%, rgba(0,0,0,0.5) 45%, transparent 78%); }
  #scene.is-clear .fx-rays, #ovfx .fx-rays { opacity: 1; animation: rays 11s ease-in-out infinite alternate; }
  @keyframes rays { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
  .fx-grade { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s;
    background: radial-gradient(ellipse 48% 42% at 30% 22%, rgba(255,206,140,0.12), transparent 70%),
      radial-gradient(ellipse 74% 70% at 48% 50%, transparent 48%, rgba(16,12,30,0.58) 100%); }
  #scene.is-open .fx-grade { opacity: 1; }
  .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,244,214,0.95), rgba(255,226,170,0.35) 45%, transparent 70%); opacity: 0;
    animation: mote var(--d) linear var(--dl) infinite; }
  .mote.bokeh { filter: blur(2.5px); background: radial-gradient(circle, rgba(255,236,196,0.9), rgba(255,214,150,0.35) 55%, transparent 72%); }
  #fx .motes { opacity: 0; transition: opacity 2s; }
  #scene.is-unfolded #fx .motes { opacity: 1; }
  @keyframes mote { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
  #ovfx { z-index: 1; }
  #ovfx .fx-rays { opacity: 0.8; }
  #ovfx .fx-bloom { opacity: 0.16; }
  /* 지도 위 등불: 왼쪽 위가 따뜻하게 밝고, 가장자리는 어둑하게 */
  .ov-light { position: absolute; inset: 0; background:
      radial-gradient(ellipse 46% 44% at 34% 30%, rgba(255,214,150,0.14), transparent 70%),
      radial-gradient(ellipse 72% 70% at 50% 50%, transparent 50%, rgba(16,12,28,0.5) 100%); }
  #app.no-fx #fx, #app.no-fx #ovfx { display: none; }
  #scene.is-ready { cursor: grab; }
  #scene.is-dragging { cursor: grabbing; }
  .ui { position: absolute; z-index: 5; }
  #scene-title { top: 26px; opacity: 0; transition: opacity 0.6s; }
  #close { left: 22px; top: 20px; padding: 9px 18px 9px 14px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.42); background: rgba(28,18,10,0.6);
    color: #ecd9b0; font: 14px/1 var(--serif); letter-spacing: 0.12em; cursor: pointer; opacity: 0; transition: opacity 0.4s, background-color 0.2s, border-color 0.2s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  #close::before { content: '‹'; margin-right: 8px; font-size: 18px; vertical-align: -1px; color: var(--gold); }
  #close:hover { background: rgba(60,38,20,0.85); border-color: rgba(226,194,126,0.8); }
  #view-hint { left: 50%; bottom: 18px; transform: translateX(-50%); color: #c9b08a; font: 13px/1.4 var(--serif); letter-spacing: 0.04em; opacity: 0; transition: opacity 0.6s; white-space: nowrap; pointer-events: none; }
  #scene.is-clear #scene-title, #scene.is-clear #close { opacity: 1; }
  #scene.is-ready #view-hint { opacity: 0.7; }

  /* ---------- 스테이지 오가기: 아래 [⤴ 위로] 지금 판 이름 [→ 안쪽 스테이지들] ---------- */
  #stagebar { left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 999px; max-width: 86vw;
    border: 1px solid rgba(226,194,126,0.42); background: rgba(28,18,10,0.66); box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.5s; white-space: nowrap; }
  #scene.is-ready #stagebar { opacity: 1; pointer-events: auto; }
  #scene.is-editing #stagebar, #scene.is-placing #stagebar, #scene.look-l #stagebar, #scene.look-r #stagebar, #scene.is-moving #stagebar { opacity: 0; pointer-events: none; }
  #stagebar button { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.35); background: rgba(60,38,20,0.6); color: #ecd9b0; font: 13px/1 var(--serif); letter-spacing: 0.06em; cursor: pointer; }
  #stagebar button:hover { background: rgba(110,70,36,0.85); border-color: rgba(226,194,126,0.8); }
  #stagebar .sb-up[hidden] { display: none; }
  /* 이 마을의 장면들: 누르면 카메라가 지도 위로 날아가 그 장면으로 */
  #stagebar .sb-scenes { display: flex; gap: 2px; }
  #stagebar .sb-scenes button { border-color: transparent; background: transparent; font: 15px/1 var(--hand); letter-spacing: 0.1em; color: #cdb48a; }
  #stagebar .sb-scenes button.on { background: rgba(226,194,126,0.2); border-color: rgba(226,194,126,0.7); color: #fff3d6; }
  #stagebar .sb-sub { display: flex; gap: 4px; align-items: center; padding-left: 8px; border-left: 1px solid rgba(226,194,126,0.3); }
  #stagebar .sb-sub:empty, #stagebar .sb-sub.none { display: none; }
  #stagebar .sb-kids { display: flex; gap: 4px; overflow: hidden; }
  #stagebar .sb-kids button::before { content: '→ '; color: var(--gold); }
  /* 판 위 스테이지 자리: 옅은 점선 테 + 세워 둔 종이 깃발 (누르면 그 스테이지로 파고듦) */
  .stage-zone { position: absolute; box-sizing: border-box; border: 2px dashed rgba(120,60,30,0.38); border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
  #scene.is-ready .stage-zone { opacity: 1; }
  .flag { position: absolute; transform-origin: 50% 100%; cursor: pointer; transition: transform 0.75s cubic-bezier(.34,1.5,.64,1), opacity 0.4s; display: flex; flex-direction: column; align-items: center; }
  .flag b { display: block; padding: 0.35em 0.8em 0.4em; border-radius: 4px; background: linear-gradient(180deg, #fbf3df, #ead8b1); color: #5a2f18; font: 400 1em/1.1 var(--hand); letter-spacing: 0.08em; white-space: nowrap;
    box-shadow: 0 0 0 1.5px #8a5a33, 0 0.15em 0.4em rgba(40,22,8,0.35); }
  .flag i { display: block; width: 0.18em; flex: 1; background: linear-gradient(90deg, #6a4224, #a2744a, #6a4224); }
  .flag:hover b { background: linear-gradient(180deg, #fff8e6, #f3dfb2); box-shadow: 0 0 0 1.5px #a8482f, 0 0 0.8em rgba(255,200,120,0.8); }

  /* ---------- 양옆 면의 내용: 왼쪽 = 구역 목차 + 작은 지도, 오른쪽 = 작가의 기록 ---------- */
  /* 3D 면은 뒤집혀 누워 있어서 거울처럼 한 번 더 뒤집어 바로 읽히게. 누르면 카메라가 그 면을 내려다보고, 그때 또렷한 쓰기용 판을 겹쳐 띄움 */
  .flap { position: absolute; inset: 0; box-sizing: border-box; padding: 34px 30px 28px; transform: scaleX(-1); display: flex; flex-direction: column;
    color: #4a3020; font-family: var(--serif); pointer-events: auto; cursor: pointer; overflow: hidden; }
  .flap .lab { font: 11px/1 var(--serif); letter-spacing: 0.5em; text-indent: 0.5em; color: var(--accent); text-align: center; }
  .flap .nm { font: 400 24px/1.25 var(--hand); color: #3c2616; text-align: center; margin-top: 8px; letter-spacing: 0.08em; }
  .flap .orn { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; }
  .flap .orn i { width: 5px; height: 5px; transform: rotate(45deg); background: #b08650; }
  .flap .orn::before, .flap .orn::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(140,100,60,0.6), transparent); }
  .flap .mini { position: relative; margin: 10px auto 6px; flex: none; }
  .flap .mini img { display: block; width: 100%; height: 100%; border-radius: 2px; box-shadow: 0 0 0 1px rgba(120,85,50,0.55), 0 2px 6px rgba(60,35,15,0.25); }
  .flap .mini i { position: absolute; box-sizing: border-box; border: 1.5px solid rgba(168,72,47,0.7); background: rgba(255,236,190,0.1); }
  .flap .mini i.on { border-color: #a8482f; background: rgba(255,206,120,0.32); }
  .flap .mini i b { position: absolute; left: 2px; top: 2px; font: 700 9px/1 var(--serif); color: #fff6e2; background: rgba(168,72,47,0.85); padding: 2px 4px; border-radius: 2px; }
  .flap ol { list-style: none; margin: 6px 0 0; padding: 0; overflow: hidden; }
  .flap li { display: flex; gap: 10px; align-items: baseline; font: 15px/2 var(--serif); padding: 0 6px; border-bottom: 1px dashed rgba(120,85,50,0.3); }
  .flap li .no { min-width: 18px; color: #8a6440; font-size: 12px; }
  .flap li.on { color: var(--accent); }
  .flap li.on::after { content: '◀'; margin-left: auto; font-size: 10px; }
  .flap .tool { margin-top: auto; padding-top: 10px; font: 12px/1 var(--serif); letter-spacing: 0.24em; color: #8a6440; text-align: center; background: none; border: 0; }
  .flap .note { flex: 1; margin-top: 10px; white-space: pre-wrap; word-break: keep-all; overflow: hidden; color: #4a3020; font: 15px/28px var(--serif);
    background: repeating-linear-gradient(180deg, transparent 0 27px, rgba(120,85,50,0.28) 27px 28px); }
  .flap div.note:empty::before { content: attr(data-ph); color: #a08868; font-style: italic; }
  .flap .saved { font: italic 11px/1.4 var(--serif); color: #9a8266; margin-top: 8px; text-align: right; min-height: 15px; }
  #scene.look-l .cover-back.l, #scene.look-r .cover-back.r { filter: none; }
  /* 가까이 내려다볼 때 겹치는 쓰기용 판 (같은 모양 · 평면이라 글자가 또렷하고 바로 고칠 수 있음) */
  /* 숨길 때는 visibility 까지 감춤: 안의 .flap 이 pointer-events:auto 라서 투명해진 판이 그 자리에 남아 클릭을 가로채 끌기가 안 됐음 */
  #flappanel { left: 0; top: 0; transform-origin: 0 0; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.3s, visibility 0s 0.3s;
    background: linear-gradient(90deg, rgba(60,35,15,0.3), transparent 14%, transparent 86%, rgba(60,35,15,0.3)), url('assets/paper_card.jpg') center / cover;
    box-shadow: inset 0 0 0 12px #5a321b, inset 0 0 0 13px rgba(226,194,126,0.55), inset 0 0 30px 14px rgba(60,35,15,0.35); }
  #flappanel.on { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity 0.3s; }
  /* 3D 양옆 면도 다 펼쳐진 뒤에만 누를 수 있게 (펼치고 덮는 동안 지도 위 클릭을 가로채지 않게) */
  #scene:not(.is-ready) .flap { pointer-events: none; }
  #flappanel .flap { transform: none; cursor: default; }
  #flappanel .flap li, #flappanel .flap .mini i, #flappanel .flap .tool { cursor: pointer; }
  #flappanel .flap li:hover { background: rgba(255,236,190,0.45); }
  #flappanel .flap .tool:hover { color: var(--accent); }
  #flappanel textarea.note { border: 0; outline: 0; resize: none; width: 100%; padding: 0 2px; box-sizing: border-box; background-attachment: local; }
  #flappanel .fp-back { position: absolute; left: 18px; top: 14px; border: 0; background: none; color: #8a6440; font: 12px/1 var(--serif); letter-spacing: 0.12em; cursor: pointer; z-index: 1; }
  #flappanel .fp-back:hover { color: var(--accent); }

  /* ---------- 구역 나누기 (위에서 내려다본 판 위에 네모를 그어 정함) ---------- */
  #scene.is-editing .stand { visibility: hidden; }
  #zedit { opacity: 0; pointer-events: none; transition: opacity 0.3s; cursor: crosshair; touch-action: none; }
  #zedit.on { opacity: 1; pointer-events: auto; }
  #zedit .zbox { position: absolute; box-sizing: border-box; border: 2px solid rgba(255,226,160,0.9); background: rgba(255,214,140,0.14); cursor: move;
    box-shadow: 0 0 0 1px rgba(40,22,8,0.6), inset 0 0 0 1px rgba(40,22,8,0.35); }
  #zedit .zbox.sel { border-color: #ffd98a; background: rgba(255,200,110,0.26); box-shadow: 0 0 0 2px rgba(168,72,47,0.9), 0 0 18px rgba(255,200,110,0.5); }
  #zedit .zname { position: absolute; left: 6px; top: 6px; padding: 3px 8px; border-radius: 3px; background: rgba(28,18,10,0.78); color: #f4e4c0; font: 14px/1.2 var(--hand); letter-spacing: 0.06em; white-space: nowrap; pointer-events: none; }
  #zedit .zgrip { position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px; border-radius: 3px; background: #ffd98a; box-shadow: 0 0 0 2px rgba(40,22,8,0.8); cursor: nwse-resize; }
  #zedit-tools { left: 50%; top: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid rgba(226,194,126,0.45); background: rgba(28,18,10,0.86); color: #ecd9b0; font: 13px/1.4 var(--serif); box-shadow: 0 10px 28px rgba(0,0,0,0.45); white-space: nowrap; }
  #zedit-tools.on { display: flex; }
  #zedit-tools b { font: 400 17px/1 var(--hand); color: var(--gold); letter-spacing: 0.1em; margin-right: 4px; }
  #zedit-tools .tip { color: #b89a6c; font-size: 12px; }
  #zedit-tools input { width: 130px; padding: 5px 8px; border-radius: 4px; border: 1px solid rgba(226,194,126,0.5); background: rgba(255,246,226,0.92); color: var(--ink); font: 14px/1 var(--serif); }
  #zedit-tools button { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.5); background: rgba(60,38,20,0.8); color: #ecd9b0; font: 13px/1 var(--serif); cursor: pointer; }
  #zedit-tools button.go { background: #a8482f; border-color: #d98a62; color: #fff3df; }
  #zedit-tools button:disabled { opacity: 0.4; cursor: default; }
  /* ---------- 배치 고치기 (위에서 내려다본 판 위 그림을 끌어 옮기고, 기호를 더 놓음) ---------- */
  #scene.is-placing .flag, #scene.is-placing .stage-zone { visibility: hidden; }
  #scene.is-placing .piece { cursor: grab; }
  #scene.is-placing .piece.is-sel { filter: drop-shadow(0 0 calc(2px * var(--k, 1)) #fff6dc) drop-shadow(0 0 calc(9px * var(--k, 1)) rgba(255,180,90,1)); }
  #ptools { left: 50%; top: 18px; transform: translateX(-50%); display: none; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid rgba(226,194,126,0.45); background: rgba(28,18,10,0.88); color: #ecd9b0; font: 13px/1.4 var(--serif); box-shadow: 0 10px 28px rgba(0,0,0,0.45); white-space: nowrap; }
  #ptools.on { display: flex; }
  #ptools b { font: 400 17px/1 var(--hand); color: var(--gold); letter-spacing: 0.1em; }
  #ptools .tip { color: #b89a6c; font-size: 12px; }
  #ptools .pt-sel { min-width: 110px; color: #f4e4c0; }
  #ptools button { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.5); background: rgba(60,38,20,0.8); color: #ecd9b0; font: 13px/1 var(--serif); cursor: pointer; }
  #ptools button.go { background: #a8482f; border-color: #d98a62; color: #fff3df; }
  #ptools button:disabled { opacity: 0.4; cursor: default; }
  #palette { right: 14px; top: 80px; bottom: 80px; width: 236px; display: none; flex-direction: column; border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(226,194,126,0.45); background: rgba(28,18,10,0.9); box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
  #palette.on { display: flex; }
  #palette .pl-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 10px 6px; }
  #palette .pl-tabs button { padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(226,194,126,0.4); background: transparent; color: #d9c49a; font: 12px/1 var(--serif); cursor: pointer; }
  #palette .pl-tabs button.on { background: #a8482f; border-color: #d98a62; color: #fff3df; }
  #palette .pl-grid { flex: 1; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px 10px 12px; align-content: start; }
  #palette .pl-grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border-radius: 6px; border: 1px solid rgba(226,194,126,0.2); background: rgba(255,246,226,0.06); color: #d9c49a; font: 11px/1.2 var(--serif); cursor: pointer; }
  #palette .pl-grid button:hover { background: rgba(255,226,170,0.18); border-color: rgba(226,194,126,0.6); }
  #palette .pl-grid img { width: 84px; height: 70px; object-fit: contain; }
  /* ---------- 기록 크게 쓰기 (노트 한 장을 책 위에 펼쳐 놓은 종이처럼) ---------- */
  #recpanel { left: 50%; top: 50%; width: min(760px, 86vw); height: min(78vh, 760px); transform: translate(-50%, -48%); opacity: 0; pointer-events: none; visibility: hidden;
    transition: opacity 0.25s, transform 0.25s, visibility 0s 0.25s; z-index: 7; display: flex; flex-direction: column; box-sizing: border-box; padding: 28px 34px 20px; border-radius: 6px;
    background: url('assets/paper_card.jpg') center / cover, #f2e7cf; color: var(--ink);
    box-shadow: 0 30px 80px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(120,80,45,0.45), inset 0 0 0 8px rgba(255,248,230,0.35), inset 0 0 0 9px rgba(120,80,45,0.35); }
  #recpanel.on { opacity: 1; pointer-events: auto; visibility: visible; transform: translate(-50%, -50%); transition: opacity 0.25s, transform 0.25s; }
  #recpanel .rp-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid rgba(120,85,50,0.4); padding-bottom: 10px; }
  #recpanel .rp-kind { font: 12px/1 var(--serif); letter-spacing: 0.3em; color: #fff4e0; background: var(--accent); padding: 5px 10px; border-radius: 999px; }
  #recpanel .rp-title { flex: 1; font: 400 26px/1.2 var(--hand); color: #3c2616; background: transparent; border: 0; outline: none; }
  #recpanel .rp-date { font: 13px/1 var(--serif); color: #8a6440; }
  #recpanel .rp-body { flex: 1; margin-top: 12px; resize: none; border: 0; outline: none; background: repeating-linear-gradient(180deg, transparent 0 29px, rgba(120,85,50,0.25) 29px 30px); background-attachment: local;
    font: 16px/30px var(--serif); color: var(--ink); padding: 0 4px; }
  #recpanel .rp-foot { display: flex; align-items: center; gap: 10px; padding-top: 10px; font: 12px/1.3 var(--serif); color: #8a6a48; }
  #recpanel .rp-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #recpanel button { padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(120,85,50,0.5); background: rgba(255,250,236,0.6); color: #5a3a20; font: 13px/1 var(--serif); cursor: pointer; }
  #recpanel button.go { background: #a8482f; border-color: #a8482f; color: #fff3df; }
  #recpanel button[hidden] { display: none; }
  /* 오른쪽 면: 기록 목록 · 새 기록 */
  .flap .recs { flex: 1; overflow: hidden; margin-top: 6px; }
  .flap .rec { display: flex; gap: 8px; align-items: baseline; padding: 5px 4px; border-bottom: 1px dashed rgba(120,85,50,0.3); font: 14px/1.4 var(--serif); }
  .flap .rec .k { flex: none; font-size: 10px; letter-spacing: 0.2em; color: #fff4e0; background: #8a5a33; padding: 2px 6px; border-radius: 999px; }
  .flap .rec .k.세션 { background: #a8482f; } .flap .rec .k.사건 { background: #4b5f7a; } .flap .rec .k.메모 { background: #6b7a4b; }
  .flap .rec .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flap .rec .d { flex: none; font-size: 11px; color: #9a8266; }
  .flap .empty { font: italic 13px/1.6 var(--serif); color: #9a8266; padding: 8px 4px; }
  .flap .newrec { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .flap .newrec button, .flap .addrec { padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(120,85,50,0.45); background: rgba(255,250,236,0.6); color: #5a3a20; font: 12px/1 var(--serif); cursor: pointer; }
  .flap .newrec button.on { background: var(--accent); color: #fff3df; border-color: var(--accent); }
  .flap .newrec input { flex: 1; min-width: 120px; padding: 6px 8px; border: 1px solid rgba(120,85,50,0.45); border-radius: 4px; background: rgba(255,250,236,0.8); font: 13px/1 var(--serif); color: var(--ink); }
  #flappanel .flap .rec { cursor: pointer; }
  #flappanel .flap .rec:hover { background: rgba(255,236,190,0.45); }

  /* ---------- 카드: 책갈피에 끼운 장서표 ---------- */
  #card { position: absolute; right: 20px; top: 20px; bottom: 20px; width: 340px; z-index: 6; box-sizing: border-box; padding: 26px 26px 22px;
    background: url('assets/paper_card.jpg') center / cover, #f2e7cf; border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.4) inset, inset 0 0 0 1px rgba(120,80,45,0.45), inset 0 0 0 7px rgba(255,248,230,0.0), inset 0 0 0 8px rgba(120,80,45,0.35), inset 0 0 40px rgba(120,80,45,0.18);
    transform: translateX(380px) rotate(1.5deg); transition: transform 0.45s cubic-bezier(.2,.8,.2,1); overflow: auto; }
  #card.is-open { transform: translateX(0) rotate(0deg); }
  #card .kind { font: 12px/1 var(--serif); letter-spacing: 0.5em; color: var(--accent); text-align: center; margin-top: 4px; }
  #card .nm { font: 400 28px/1.25 var(--hand); color: #3c2616; margin-top: 10px; text-align: center; letter-spacing: 0.06em; min-height: 35px; }
  #card .orn { display: flex; align-items: center; gap: 12px; margin: 12px 0 2px; }

<script>
const VERSION = 3;
const SAVE = 'The Archive - 자료/마을 (시험).마을.json';
const LAYOUT = '.도구/창/popup/layout.json'; // 처음 배치 (저장본이 없을 때)
const Q = new URLSearchParams(location.search);
if (Q.get('snap')) document.documentElement.classList.add('snap');
// 두 곳에서 열림: 세계판 창(serve3.py, http) · 옵시디언 플러그인 「펼쳐지는 마을」(이 글을 액자 srcdoc 으로 넣고 <base> 와 MN_OBS 를 붙임).
// 옵시디언 안에서는 이 페이지가 보관소 파일을 직접 읽고 쓰지 못하므로 플러그인에 부탁함 (postMessage). 그림은 이 페이지 자리에서 상대 주소로
const OBS = Q.get('obs') === '1' || window.MN_OBS === true;
const VROOT = OBS ? '../../../' : '/vault/'; // 보관소 맨 위 (이 페이지는 .도구/창/popup/ 에 있음)
const vurl = (p) => VROOT + p.split('/').map(encodeURIComponent).join('/');
const ASSET = (p) => vurl(['The Archive - 자료', '기호', p].join('/'));
const LOCAL = (n) => 'assets/' + n; // 이 페이지 옆 assets/ (창: /popup/assets · 옵시디언: 같은 폴더)
const FOGS = [1, 2, 3, 4, 5, 6].map((i) => LOCAL(`cloud_${i}.png`)); // 종이 오림 구름
const M = 40; // 블럭 둘레 여백 (쪽 = bbox + 여백)
const PAD = 40; // 인쇄된 판 둘레의 종이 여백 (구운 쪽 그림과 같은 값)
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const clampv = (v, [a, b]) => Math.max(a, Math.min(b, v));
// 옵시디언 플러그인에 보관소 파일 읽기 부탁 (답이 4초 안에 없으면 없는 것으로)
const asks = new Map();
let askN = 0;
addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.mn === 'read' && asks.has(m.id)) { asks.get(m.id)(m.text); asks.delete(m.id); }
});
/** 보관소 파일 글 읽기 (없으면 null) */
async function readVault(p) {
  if (OBS) {
    return new Promise((res) => {
      const id = ++askN;
      asks.set(id, res);
      parent.postMessage({ mn: 'read', id, path: p }, '*');
      setTimeout(() => { if (asks.has(id)) { asks.delete(id); res(null); } }, 4000);
    });
  }
  try {
    const r = await fetch(vurl(p) + '?t=' + Date.now());
    return r.ok ? await r.text() : null;
  } catch (e) {
    return null;
  }
}

let town = null;
let saveTimer = null;
function bbox(pts) {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
async function loadTown() {
  try {
    const s = await readVault(SAVE);
    if (s) {
      const t = JSON.parse(s);
      if (t.version === VERSION) return t;
    }
  } catch (e) {}
  const L = JSON.parse(await readVault(LAYOUT));
  let n = 0;
  return {
    version: VERSION,
    blocks: Object.entries(L).map(([id, b]) => {
      const [x0, y0] = bbox(b.poly);
      return { id, name: b.name, poly: b.poly, items: b.items.map((it) => ({ id: 'i' + ++n, ...it, x: it.x + x0 - M, y: it.y + y0 - M, story: '' })) };
    }),
  };
}
function saveSoon() {
  clearTimeout(saveTimer);
  const marks = () => document.querySelectorAll('#card .saved, #flappanel .saved');
  marks().forEach((e) => { e.textContent = '저장 중…'; });
  saveTimer = setTimeout(async () => {
    const text = JSON.stringify(town, null, 1);
    if (OBS) parent.postMessage({ mn: 'save', path: SAVE, text }, '*'); // 옵시디언: 플러그인이 대신 씀
    else await fetch('/save?name=' + encodeURIComponent(SAVE), { method: 'POST', body: text });
    marks().forEach((e) => { e.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR'); });
    drawBoard(false);
  }, 600);
}
function el(cls, parent, tag = 'div') {
  const e = document.createElement(tag);
  e.className = cls;
  parent.appendChild(e);
  return e;
}
function placeBottom(im, it, ox = 0, oy = 0) {
  Object.assign(im.dataset, { w: it.w, cx: it.x - ox, by: it.y - oy });
  layBottom(im);
  if (!(im.complete && im.naturalWidth)) im.addEventListener('load', () => layBottom(im), { once: true });
}
/** 발치(가운데 아래)에 맞춰 크기·자리를 잡음. data-k 배 크게 깔고 standT 의 scale(1/k)로 줄이면 같은 크기로 보이면서 k배 촘촘하게 그려짐 */
function layBottom(im) {
  const w = Number(im.dataset.w), k = Number(im.dataset.k || 1);
  im.style.width = w * k + 'px';
  im.style.left = Number(im.dataset.cx) - (w * k) / 2 + 'px';
  if (im.naturalWidth) im.style.top = Number(im.dataset.by) - (im.naturalHeight * w * k) / im.naturalWidth + 'px';
}
/** 판 둘레의 지도: 판 자리(hx,hy,hw,hh)만 비운 네 띠에 지도 그림을 지도와 똑같은 자리로 깖. 처음엔 화면의 지도와 겹쳐 보이다가
 *  카메라가 다가가며 판과 함께 기울어짐 (지도 그 자리가 열리는 것처럼). 바깥으로 갈수록 어둠에 녹음 */
/** 판 둘레의 지도: 판 자리(hx,hy,hw,hh)만 비우고 마을 지도 전체를 깖 (네 띠). 장면 사이를 카메라로 옮겨 갈 때 지나가는 길이 모두 보이게.
 *  흐려도 되는 배경이라 작게 그려 늘림 (q). 지도 끝은 딱딱한 직선으로 보이지 않게 가장자리에서 투명하게 녹임 */
function buildSurround(parent, hx, hy, hw, hh, ox, oy, q = 3) {
  const MW = MAPW / MS, MH = MAPH / MS; // 마을 좌표로 본 지도 크기 (hx, hy 는 책 속 좌표 = 마을 좌표 - (ox, oy))
  const L = Math.min(-ox, hx), R = Math.max(MW - ox, hx + hw), T = Math.min(-oy, hy), B = Math.max(MH - oy, hy + hh);
  for (const [sx, sy, sw, sh] of [[L, T, R - L, hy - T], [L, hy + hh, R - L, B - hy - hh], [L, hy, hx - L, hh], [hx + hw, hy, R - hx - hw, hh]]) {
    if (sw <= 0 || sh <= 0) continue;
    const s = el('surround', parent);
    const pos = `${(L - sx) / q}px ${(T - sy) / q}px`, size = `${(R - L) / q}px ${(B - T) / q}px`;
    const fade = ['linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent)', 'linear-gradient(180deg, transparent, #000 9%, #000 93%, transparent)'];
    Object.assign(s.style, { left: sx + 'px', top: sy + 'px', width: sw / q + 'px', height: sh / q + 'px', transform: `scale(${q})`,
      backgroundImage: `url("${LOCAL('map_town.jpg')}")`, backgroundSize: `${MW / q}px ${MH / q}px`, backgroundPosition: `${(-ox - sx) / q}px ${(-oy - sy) / q}px`,
      webkitMaskImage: fade.join(', '), maskImage: fade.join(', '), webkitMaskPosition: `${pos}, ${pos}`, maskPosition: `${pos}, ${pos}`,
      webkitMaskSize: `${size}, ${size}`, maskSize: `${size}, ${size}`, webkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat',
      webkitMaskComposite: 'source-in', maskComposite: 'intersect' });
  }
}

// ---------- 마을 전체: 책상 위에 펼친 그림 지도 ----------
const ovmap = document.getElementById('ovmap');
const ovhits = document.getElementById('ovhits');
const MAPW = 2400, MAPH = 1500, MS = 1.5; // 지도 그림 = 마을 좌표 x 1.5
const OV = { s: 1 }; // 화면 px / 지도 그림 px
function fitOverview() {
  if (innerWidth < 100 || innerHeight < 100) return; // 창이 가려진 채로 열렸을 때: 보일 때 다시 맞춤
  OV.s = Math.min((innerWidth - 60) / MAPW, (innerHeight - 140) / MAPH);
  const w = MAPW * OV.s, h = MAPH * OV.s;
  Object.assign(ovmap.style, { width: w + 'px', height: h + 'px', left: (innerWidth - w) / 2 + 'px', top: Math.max(70, (innerHeight - h) / 2 + 10) + 'px' });
  document.getElementById('title').style.top = Math.max(14, parseFloat(ovmap.style.top) - 50) + 'px';
}
const poly = (pts) => 'polygon(' + pts.map(([x, y]) => `${x}px ${y}px`).join(',') + ')';
const NS = 'http://www.w3.org/2000/svg';
function drawBoard() {
  ovhits.innerHTML = '<defs><filter id="ovsoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter></defs>';
  for (const b of town.blocks) {
    const pg = document.createElementNS(NS, 'polygon');
    pg.setAttribute('points', b.poly.map(([x, y]) => `${x * MS},${y * MS}`).join(' '));
    pg.dataset.id = b.id;
    pg.addEventListener('click', () => openBlock(b));
    const t = document.createElementNS(NS, 'title');
    t.textContent = b.name + ' · 눌러서 펼치기';
    pg.appendChild(t);
    ovhits.appendChild(pg);
    for (const it of b.items) {
      if (!(it.story && it.story.trim())) continue;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', it.x * MS);
      c.setAttribute('cy', it.y * MS + 8);
      c.setAttribute('r', 9);
      ovhits.appendChild(c);
    }
  }
}

// ---------- 빛 (HD-2D 풍) ----------
function makeMotes(box, n) {
  for (let i = 0; i < n; i++) {
    const m = el('mote', box);
    const sz = 2 + Math.random() * 4;
    Object.assign(m.style, { width: sz + 'px', height: sz + 'px', left: Math.random() * 75 + '%', top: 8 + Math.random() * 80 + '%' });
    m.style.setProperty('--d', 7 + Math.random() * 9 + 's');
    m.style.setProperty('--dl', -Math.random() * 14 + 's');
    m.style.setProperty('--o', (0.25 + Math.random() * 0.55).toFixed(2));
    m.style.setProperty('--dx', (Math.random() - 0.3) * 90 + 'px');
    m.style.setProperty('--dy', -(40 + Math.random() * 110) + 'px');
  }
}
/** 눈앞을 지나는 큰 빛망울 (흐릿하고 느리게 떠오름 — 카메라 가까이 떠다니는 빛가루) */
function makeBokeh(box, n) {
  for (let i = 0; i < n; i++) {
    const m = el('mote bokeh', box);
    const sz = 10 + Math.random() * 16;
    Object.assign(m.style, { width: sz + 'px', height: sz + 'px', left: Math.random() * 100 + '%', top: 30 + Math.random() * 70 + '%' });
    m.style.setProperty('--d', 16 + Math.random() * 14 + 's');
    m.style.setProperty('--dl', -Math.random() * 30 + 's');
    m.style.setProperty('--o', (0.1 + Math.random() * 0.18).toFixed(2));
    m.style.setProperty('--dx', (Math.random() - 0.5) * 160 + 'px');
    m.style.setProperty('--dy', -(120 + Math.random() * 220) + 'px');
  }
}
makeMotes(document.querySelector('#fx .motes'), 48);
makeBokeh(document.querySelector('#fx .motes'), 12);
makeMotes(document.querySelector('#ovfx .motes'), 22);
// 하늘의 종이 구름: 가까운 것(위·크고 짙고 빠름) … 먼 것(지평선 쪽·작고 옅고 느림)
(() => {
  const sky = document.getElementById('sky');
  for (let i = 0; i < 7; i++) {
    const far = i / 6;
    const c = el('sky-cloud', sky, 'img');
    c.src = FOGS[(i * 5) % FOGS.length];
    c.draggable = false;
    c.style.width = 380 - far * 230 + 'px';
    c.style.top = 44 + far * 25 + Math.random() * 3 + '%'; // 하늘 판이 화면보다 위로 길어서, 화면에서 보이는 아래쪽에만
    const d = 110 + far * 140;
    c.style.setProperty('--d', d + 's');
    c.style.setProperty('--dl', -Math.random() * d + 's');
    c.style.setProperty('--o', (0.78 - far * 0.38).toFixed(2));
    c.style.setProperty('--b', (0.72 + far * 0.3).toFixed(2));
  }
})();
if (Q.get('fx') === '0') document.getElementById('app').classList.add('no-fx');
const LAMPS = ['자연/11', '공공/11']; // 빛나는 것: 가로등 · 빛 구슬 탑

// ---------- 책 펼치기 (정면 시점 · 마우스로 각도 돌리기) ----------
const app = document.getElementById('app');
const ov = document.getElementById('ov');
const scene = document.getElementById('scene');
const book = document.getElementById('book');
const bookz = document.getElementById('bookz');
let BZ = 1; // 책 속 배율 (zoom) — 화면 배율과 같게 맞춰 선명하게
const card = document.getElementById('card');
const VIEW = { tilt: 72, yaw: 0, zoom: 1 };

  // 덮개 두 짝 (겉 = 그 자리 지도 그림, 안 = 종이 = 양옆 면). 지도에서 펼칠 땐 닫힌 채로, 판을 바꿀 땐 열린 채로 깖
  const CW = w + 2 * PAD, CH = h + 2 * PAD;
  const closed = opts.doors === 'closed';
  const doors = ['l', 'r'].map((s) => {
    const x = s === 'l' ? -PAD : -PAD + CW / 2;
    const cb = add('cover-back ' + s);
    Object.assign(cb.style, { left: x + 'px', top: -PAD + 'px', width: CW / 2 + 'px', height: CH + 'px', opacity: closed || opts.flapsFade ? 0 : 1 });
    let cv = null;
    if (!stage) {
      cv = add('cover ' + s);
      Object.assign(cv.style, { left: x + 'px', top: -PAD + 'px', width: CW / 2 + 'px', height: CH + 'px', visibility: closed ? '' : 'hidden',
        backgroundImage: `url("${LOCAL('map_town.jpg')}")`, backgroundSize: `${MAPW / MS}px ${MAPH / MS}px`, backgroundPosition: `${-ox - x}px ${-oy + PAD}px` });
    }
    return { s, cv, cb };
  });
  // 열림: 왼짝은 왼쪽 모서리를 축으로 왼쪽으로, 오른짝은 오른쪽 모서리를 축으로 오른쪽으로 넘어가 지도 위에 누움 (열린 채 남음)
  const setDoors = (open) => doors.forEach(({ s, cv, cb }) => {
    const deg = open ? (s === 'l' ? -180 : 180) : 0;
    if (cv) cv.style.transform = `translateZ(2.2px) rotateY(${deg}deg)`;
    cb.style.transform = `translateZ(1.6px) rotateY(${deg}deg)`;
  });
  setDoors(!closed);
  return { pieces, fogs, backs, doors, setDoors, page, flags, parentPage };
}
/** 그림 하나 (+ 받침 · 그림자 · 등불 번짐). up: 처음부터 서 있게 */
function makePiece(it, V, add, flat, up) {
  const { ox, oy } = V;
  const p = { it, y: it.y - oy };
  p.cast = flat('tab ptab'); // 종이 받침 (그림 발치에 붙인 접힌 띠)
  p.shd = flat('shade', 'img');
  p.shd.src = ASSET(it.asset);
  p.shd.draggable = false;
  p.ct = flat('contact');
  p.im = add('stand piece' + (it.kind === 'person' ? ' person' : ''), 'img');
  p.im.src = ASSET(it.asset);
  p.im.draggable = false;
  if (LAMPS.some((k) => it.asset.includes(k))) p.glow = add('stand glow');
  relayPiece(p, V);
  p.im.dataset.up = up ? '1' : '0';
  p.im.style.transform = standT(p.im);
  if (up) {
    for (const d of [p.ct, p.cast, p.shd]) d.classList.add('is-up');
    p.im.classList.add('is-up');
  }
  if (p.glow) {
    p.glow.dataset.up = up ? '1' : '0';
    p.glow.style.transform = standT(p.glow);
    if (up) p.glow.classList.add('is-up');
  }
  p.im.onclick = (e) => {
    e.stopPropagation();
    const o = openState;
    if (!scene.classList.contains('is-clear') || drag?.moved || o?.look || o?.editing || o?.placing || o?.busy) return;
    p.im.classList.remove('hop');
    void p.im.offsetWidth;
    p.im.classList.add('hop');
    showCard(it, p.im);
  };
  return p;
}
/** 그림의 자리·크기를 it 에 맞춰 다시 잡음 (배치 고치기에서 옮기거나 크기를 바꿀 때도) */
function relayPiece(p, V) {
  const { it } = p, { ox, oy } = V;
  const tw = Math.max(12, it.w * 0.6);
  Object.assign(p.cast.style, { left: it.x - ox - tw / 2 + 'px', top: it.y - oy - 0.5 + 'px', width: tw + 'px', height: Math.max(8, Math.min(20, it.w * 0.15)) + 'px' });
  placeBottom(p.shd, it, ox, oy);
  Object.assign(p.ct.style, { left: it.x - ox + 'px', top: it.y - oy + 'px', width: it.w * 0.8 + 'px', height: it.w * 0.12 + 'px' });
  p.im.dataset.w = it.w; // 촘촘함(k)은 그대로 두고 자리만
  p.im.dataset.cx = it.x - ox;
  p.im.dataset.by = it.y - oy;
  if (!p.im.dataset.k) placeBottom(p.im, it, ox, oy); else layBottom(p.im);
  p.y = it.y - oy;
  if (p.glow) {
    const G = Math.max(it.w * 1.7, 64), im = p.im, glow = p.glow;
    glow.style.width = G + 'px';
    glow.style.left = it.x - ox - G / 2 + 'px';
    const setG = () => {
      const ph = (im.naturalHeight * it.w) / im.naturalWidth;
      const head = ph * (it.asset.includes('자연/11') ? 0.9 : 0.86);
      glow.style.height = head + G / 2 + 'px';
      glow.style.top = it.y - oy + 0.6 - head - G / 2 + 'px';
      glow.style.background = `radial-gradient(circle ${G / 2}px at 50% ${G / 2}px, rgba(255,236,190,0.75), rgba(255,206,130,0.32) 30%, rgba(255,190,110,0.1) 60%, transparent 100%)`;
    };
    if (im.complete && im.naturalWidth) setG(); else im.addEventListener('load', setG, { once: true });
  }
}
function foldPiece(p) {
  p.im.classList.remove('is-up');
  p.im.style.transition = 'transform 0.45s cubic-bezier(.45,.05,.55,.95)';
  p.im.dataset.up = '0';
  p.im.style.transform = standT(p.im);
  for (const d of [p.ct, p.cast, p.shd]) d.classList.remove('is-up');
  if (p.glow) { p.glow.classList.remove('is-up'); p.glow.dataset.up = '0'; p.glow.style.transform = standT(p.glow); }
}
function standPiece(p) {
  p.im.style.transition = '';
  p.im.dataset.up = '1';
  p.im.style.transform = standT(p.im);
  for (const d of [p.ct, p.cast, p.shd]) d.classList.add('is-up');
  if (p.glow) { p.glow.dataset.up = '1'; p.glow.style.transform = standT(p.glow); setTimeout(() => p.glow.classList.add('is-up'), 500); }
  setTimeout(() => p.im.classList.add('is-up'), 750);
}
const setFlag = (f, up) => { f.dataset.up = up ? '1' : '0'; f.style.transform = standT(f); };
function setBack({ bd, foot }, up) {
  bd.style.transition = up ? '' : 'transform 0.5s cubic-bezier(.5,0,.85,.45), opacity 0.35s 0.1s';
  bd.dataset.up = up ? '1' : '0';
  bd.style.transform = standT(bd);
  bd.style.opacity = up ? 1 : 0;
  foot.classList.toggle('is-up', up);
}
const setFlaps = (o, on) => o.doors.forEach(({ cb }) => { cb.style.transition = 'transform 1.05s cubic-bezier(.45,.05,.3,1), filter 1.4s, opacity 0.6s'; cb.style.opacity = on ? 1 : 0; });
/** 판을 깐 뒤의 상태 (펼친 판의 모든 것) */
function boardState(V, parts) {
  let tall = 0;
  for (const p of parts.pieces) if (p.im.naturalWidth) tall = Math.max(tall, (p.im.naturalHeight * p.it.w) / p.im.naturalWidth);
  const o = { root: V.root, b: V.root, stage: V.stage, key: boardKey(V.root, V.stage), name: boardName(V.root, V.stage), V, w: V.w, h: V.h, ox: V.ox, oy: V.oy,
    ...parts, tall: Math.max(tall, 130), focus: null };
  // 덮개 안쪽 면 = 양옆 면 (왼쪽 스테이지 목차 · 오른쪽 기록). 누르면 카메라가 그 면을 내려다봄
  for (const d of o.doors) {
    const f = el('flap', d.cb);
    f.onclick = () => { if (!drag?.moved) lookFlap(d.s); };
    o[d.s === 'l' ? 'flapL' : 'flapR'] = f;
  }
  return o;
}
/** 판에 깐 그림을 다 풀어 둠 (덜 풀린 그림은 크롬이 빈칸·흐린 채로 먼저 그려서 유령처럼 비쳤음) */
async function decodeBoard(root, ms) {
  const decodes = [...bookz.querySelectorAll('img')].map((im) => im.decode().catch(() => {}));
  for (const n of [`page_${root.id}.jpg`, 'map_town.jpg']) {
    const im = new Image();
    im.src = LOCAL(n);
    decodes.push(im.decode().catch(() => {}));
  }
  await Promise.race([Promise.all(decodes), wait(ms)]);
}

let opening = false; // 그림을 푸는 동안 (아직 openState 전) 두 번 눌러 겹쳐 열리지 않게
async function openBlock(b) {
  if (openState || opening) return;
  opening = true;
  VIEW.tilt = INIT_VIEW.tilt;
  VIEW.yaw = INIT_VIEW.yaw;
  VIEW.zoom = 1;
  const V = viewOf(b, null);
  // 펼쳤을 때 화면 배율을 미리 어림해서 그만큼 크게 깔아 둠
  BZ = 0;
  setBZ(capBZ(1.08 * Math.min((innerWidth - 300) / (V.w + 2 * PAD), (innerHeight * 0.64) / ((V.h + 2 * PAD) * Math.cos((72 * Math.PI) / 180) + 130), 3.2), V.w, V.h));
  book.style.width = V.w * BZ + 'px';
  book.style.height = V.h * BZ + 'px';
  const parts = buildBoard(V, { fogs: true, doors: 'closed' });
  await decodeBoard(b, 1500);
  const o = (openState = boardState(V, parts));
  opening = false;
  const { pieces, fogs, backs, doors, setDoors, flags } = o;
  fillFlaps(o);
  // 펼친 자세의 크기를 먼저 재고 그 배율로 깔아 둠 (펼친 끝에 다시 그리며 화질이 툭 바뀌지 않게)
  layoutOpen(o);
  setBZ(wantBZ(o));
  setPieceRes();
  // 시작: 화면의 지도와 똑같은 자리 · 크기 · 기울기 (위에서 내려다본 지도 한 장) — 그대로 카메라만 다가감
  book.style.transition = 'none';
  book.style.transform = BT(...mapPose(o));
  scene.classList.add('is-open');
  app.classList.add('is-open');
  document.getElementById('scene-title').textContent = o.name;
  void book.offsetWidth;
  await wait(60);
  // 1) 카메라가 그 구역으로 천천히 다가가며 눈높이로 내려옴 (둘레 지도도 같이 기울며 어둠에 잠김)
  book.style.transition = 'transform 1.9s cubic-bezier(.5,0,.2,1)';
  book.style.transform = bookT(o);
  // 2) 다가가는 도중에 지도 그 자리가 가운데서 갈라져 양옆으로 열림 → 안개 낀 장면, 뒤 배경 막이 먼저 섬
  await wait(850);
  // 다 가려진 화면의 지도와 그 빛 효과는 아예 뺌: 안 보이는데도 그래픽 메모리를 차지해서 책 그림이 밀려나 사라졌음 (덮을 때 다시 넣음)
  ov.style.display = 'none';
  scene.classList.add('is-unfolded');
  doors.forEach(({ cb }) => { cb.style.opacity = 1; });
  setDoors(true);
  // 덮개가 실제로 움직이기 시작한 때부터 잼: 화면이 바쁘면 덮개가 늦게 출발해서, 시간만 재면 구름이 덮개를 뚫고 먼저 일어났음
  const doorAnim = doors[0].cv.getAnimations()[0];
  if (doorAnim) await Promise.race([doorAnim.ready, wait(500)]);
  [...fogs].sort((a, c) => a.dataset.y - c.dataset.y).forEach((f, i) => setTimeout(() => {
    f.dataset.up = '1';
    f.style.opacity = 1;
    f.style.transform = standT(f);
    f._tab.classList.add('is-up');
  }, 640 + i * 40)); // 표지가 반 넘게 열린 뒤에 (표지를 뚫고 보이지 않게)
  // 3) 구름이 앞에서부터 양옆으로 빠지고, 빠진 자리부터 일어섬 (맨 뒤 풍경 막은 구름이 빠지기 시작할 때 섬)
  await wait(1500);
  scene.classList.add('is-clear');
  // 다 열린 덮개의 지도 쪽 겉면(뒤집혀 안 보임)은 꺼서 그래픽 메모리를 돌려받음 — 종이 안쪽 면은 양옆에 펼쳐진 채 남김. 덮을 때 다시 켬
  doors.forEach(({ cv }) => { cv.style.visibility = 'hidden'; });
  backs.forEach((bk, i) => setTimeout(() => setBack(bk, true), 120 + i * 180));
  // 구름은 종이라 책 밖으로 나갈 수 없으니, 옆으로 밀리기 시작하면서 안개 걷히듯 책 위에서 스러짐 (책 가장자리까지만)
  [...fogs].sort((a, c) => c.dataset.y - a.dataset.y).forEach((f, i) => setTimeout(() => {
    f.classList.add('is-off');
    f.dataset.dx = Math.round(f.dataset.dir * o.w * (0.3 + 0.1 * Math.random()));
    f.style.transform = standT(f);
    f.style.opacity = 0;
    f._tab.style.transition = 'transform 1.5s cubic-bezier(.55,0,.25,1), opacity 0.6s 0.2s';
    f._tab.style.transform = `translateX(${f.dataset.dx}px)`;
    f._tab.classList.remove('is-up');
    setTimeout(() => { f.style.display = 'none'; f._tab.style.display = 'none'; }, 1800); // 빠져나간 구름은 아예 뺌 (메모리)
  }, Math.floor(i / 3) * 200 + Math.random() * 90));
  [...pieces].sort((a, c) => c.y - a.y).forEach((p, i) => setTimeout(() => standPiece(p), 250 + (1 - p.y / o.h) * 1100 + i * 25));
  flags.forEach((f, i) => setTimeout(() => setFlag(f, true), 1300 + i * 120));
  await wait(2200);
  if (openState !== o || o.closing) return;
  scene.classList.add('is-ready');
  drawStageUI(o);
  if (o.closeAsap) { closeBlock(); return; } // 펼치는 동안 덮기를 눌렀으면 다 펼쳐진 지금 덮음
  rezoomSoon(100); // 펼침이 끝났으니 실제 화면 배율에 맞춰 한 번 다시 그림
}

/** 지금 카메라가 보는 모습 (판을 바꿀 때 새 판을 똑같이 보이게 깔려고): 화면 (cx, cy) 에 마을 좌표 (fx, fy) 를 배율 S 로 */
function poseOf(o) {
  const F = focusOf(o);
  return { fx: o.ox + o.w / 2 + F.fx, fy: o.oy + o.h / 2 + F.fy, S: o.s * VIEW.zoom * F.k, cy: F.sy ?? o.cy };
}
/** 판 바꾸기: 새 판을 깔고, 카메라를 지금과 똑같이 보이게 맞춰서 툭 바뀌지 않게 (위아래 판은 마을 좌표를 같이 쓰므로 그대로 겹침) */
async function swapTo(V, pose, opts) {
  const old = openState;
  const parts = buildBoard(V, { doors: 'open', ...opts });
  await decodeBoard(V.root, 700);
  const N = (openState = boardState(V, parts));
  N.busy = true;
  fillFlaps(N);
  layoutOpen(N);
  N.focus = { kind: 'swap', cx: pose.fx - N.ox, cy: pose.fy - N.oy, k: pose.S / (N.s * VIEW.zoom), sy: pose.cy };
  setBZ(wantBZ(N));
  // 판 크기가 바뀌었으니 책 크기도 (배율이 그대로면 setBZ 가 그냥 돌아가서, 옛 판 크기가 남아 돌림 중심이 어긋나 화면이 툭 튀었음)
  book.style.width = N.w * BZ + 'px';
  book.style.height = N.h * BZ + 'px';
  setPieceRes();
  book.style.transition = 'none';
  book.style.transform = bookT(N);
  void book.offsetWidth;
  document.getElementById('scene-title').textContent = N.name;
  if (old) old.swapped = true;
  return N;
}
/** 스테이지로 파고들기: 바깥 그림은 눕고 카메라가 그 자리로 다가가 → 같은 자리에서 그 스테이지 판으로 바뀌고 → 제자리로 맞추며 그 스테이지의 것들이 일어섬 */
async function enterStage(stage) {
  const o = openState;
  if (!o || o.busy || o.closing || o.look || o.editing || o.placing || !scene.classList.contains('is-ready')) return;
  o.busy = true;
  hideCard();
  scene.classList.add('is-moving');
  const V = viewOf(o.root, stage);
  const extra = new Set(stage.items || []);
  o.pieces.forEach((p, i) => { if (!inRect(p.it, V)) setTimeout(() => foldPiece(p), i * 10); });
  o.flags.forEach((f) => setFlag(f, false));
  o.backs.forEach((bk) => setBack(bk, false));
  setFlaps(o, false);
  // 스테이지 판을 펼쳤을 때의 배율만큼 다가감 (바뀐 뒤 움직임이 작게)
  const sS = 1.08 * Math.min((innerWidth - 300) / (V.w + 2 * PAD), (innerHeight * 0.64) / ((V.h + 2 * PAD) * Math.cos((72 * Math.PI) / 180) + o.tall), 3.2);
  VIEW.zoom = 1;
  o.focus = { kind: 'dive', cx: (V.x0 + V.x1) / 2 - o.ox, cy: (V.y0 + V.y1) / 2 - o.oy, k: Math.max(1, sS / o.s) };
  moveCamera(o, 1.15);
  await wait(1200);
  const N = await swapTo(V, poseOf(o), { up: (it) => !extra.has(it), flapsFade: true });
  N.focus = null;
  moveCamera(N, 0.9);
  N.pieces.forEach((p, i) => { if (p.im.dataset.up !== '1') setTimeout(() => standPiece(p), 300 + i * 40); });
  N.flags.forEach((f, i) => setTimeout(() => setFlag(f, true), 500 + i * 120));
  N.backs.forEach((bk, i) => setTimeout(() => setBack(bk, true), 200 + i * 160));
  setTimeout(() => setFlaps(N, true), 300);
  setTimeout(() => N.parentPage?.classList.add('dim'), 350);
  await wait(950);
  N.busy = false;
  scene.classList.remove('is-moving');
  drawStageUI(N);
}
/** 위 판으로 나오기: 이 스테이지에만 있는 것들이 눕고 → 같은 자리에서 위 판으로 바뀌고 → 카메라가 물러나며 바깥 그림이 일어섬 */
async function leaveStage(fast) {
  const o = openState;
  if (!o || !o.stage || o.busy || o.closing) return;
  if (o.look || o.editing || o.placing) return;
  o.busy = true;
  hideCard();
  scene.classList.add('is-moving');
  const st = o.stage, parent = st.parent ? stageById(o.root, st.parent) : null;
  const extra = new Set(st.items || []);
  o.pieces.forEach((p) => { if (extra.has(p.it)) foldPiece(p); });
  o.parentPage?.classList.remove('dim'); // 위 판 종이와 같은 밝기로 돌아간 뒤 바꿈
  o.flags.forEach((f) => setFlag(f, false));
  o.backs.forEach((bk) => setBack(bk, false));
  setFlaps(o, false);
  await wait(fast ? 220 : 480);
  const SV = viewOf(o.root, st);
  const N = await swapTo(viewOf(o.root, parent), poseOf(o), { up: (it) => inRect(it, SV) && !extra.has(it), flapsFade: true });
  N.focus = null;
  moveCamera(N, fast ? 0.7 : 1.15);
  N.pieces.forEach((p, i) => { if (p.im.dataset.up !== '1') setTimeout(() => standPiece(p), 250 + i * 18); });
  N.flags.forEach((f, i) => setTimeout(() => setFlag(f, true), 600 + i * 100));
  N.backs.forEach((bk, i) => setTimeout(() => setBack(bk, true), 300 + i * 160));
  setTimeout(() => setFlaps(N, true), 400);
  await wait(fast ? 750 : 1200);
  N.busy = false;
  scene.classList.remove('is-moving');
  drawStageUI(N);
}

async function closeBlock() {
  if (!openState || openState.closing) return;
  if (!scene.classList.contains('is-ready')) { openState.closeAsap = true; return; } // 아직 펼치는 중: 예약된 동작과 엉키지 않게 다 펼쳐진 뒤 덮음
  hideCard();
  closeRecord();
  // 스테이지 나누기 · 배치 고치기 · 양옆 면 보기 중이면 그냥 접고 판 전체로 (덮는 길은 늘 지역 판에서)
  if (openState.editing) endStageEdit(false, true);
  if (openState.placing) endPlace(true);
  flappanel.classList.remove('on');
  clearTimeout(openState.lookTimer);
  scene.classList.remove('look-l', 'look-r');
  openState.look = null;
  while (openState.stage) { // 스테이지 안이면 지역 판까지 차례로 나옴
    if (openState.busy) await wait(200);
    else await leaveStage(true);
  }
  const o = openState;
  o.focus = null;
  o.closing = true;
  scene.classList.remove('is-ready');
  const { pieces, fogs, backs, w, h, doors, setDoors, flags } = o;
  VIEW.yaw = 0;
  VIEW.tilt = 72;
  VIEW.zoom = 1;
  // 펼침의 거꾸로 (약 2초): 보던 각도를 정면으로 되돌리면서, 뒤에서부터 차례로 눕고 → 덮개가 덮이고 → 지도 자리로 돌아가 녹아듦
  book.style.transition = 'transform 0.6s cubic-bezier(.2,.8,.2,1)';
  book.style.transform = BT(o.cx, o.cy, w, h, o.s, VIEW.tilt, 0);
  scene.classList.remove('is-clear');
  // 1) 뒤쪽부터 접혀 눕는다 (종이가 툭 넘어가듯 가속). 받침·그림자·번짐은 그림과 함께 걷힘
  [...pieces].sort((a, c) => a.y - c.y).forEach((p, i) => setTimeout(() => {
    foldPiece(p);
    p.im.style.transition = 'transform 0.5s cubic-bezier(.45,.05,.55,.95)'; // 눈높이에서는 뒤로 기우는 초반이 잘 안 보이므로 고르게
  }, 80 + (1 - p.y / h) * 220 + i * 10));
  flags.forEach((f) => setFlag(f, false));
  backs.forEach((bk, i) => setTimeout(() => setBack(bk, false), i * 120));
  fogs.forEach((f) => { f.style.transition = 'none'; f.style.opacity = 0; f._tab.classList.remove('is-up'); });
  // 2) 다 눕기 전에 양옆에 펼쳐져 있던 덮개 두 짝이 넘어와 가운데서 만나 판을 덮음 (덮개 날이 지나갈 즈음엔 모두 누워 있음)
  await wait(320);
  scene.classList.add('is-closing');
  doors.forEach(({ cv, cb }) => { cv.style.visibility = ''; cb.style.opacity = 1; });
  setDoors(false);
  // 3) 덮개가 거의 닫히면 카메라가 천천히 물러나 위에서 내려다본 지도 자리로 돌아가고, 끝자락에 화면의 지도와 겹쳐 바뀜
  await wait(950);
  scene.classList.remove('is-unfolded');
  ov.style.display = ''; // 지도 자리를 재려면 먼저 넣어 둠 (아직 투명)
  book.style.transition = 'transform 1.3s cubic-bezier(.5,0,.25,1)';
  book.style.transform = BT(...mapPose(o));
  await wait(950);
  // 카메라가 거의 다 물러난 뒤에야 화면의 지도가 0.8초에 걸쳐 돌아오고, 장면은 0.5초 뒤부터 사라짐 (어긋난 지도 두 장이 겹쳐 보이지 않게)
  scene.classList.remove('is-open');
  app.classList.remove('is-open');
  await wait(1000);
  book.style.transition = 'none';
  bookz.innerHTML = '';
  scene.classList.remove('is-closing');
  openState = null;
}

// ---------- 아래 막대: [⤴ 위로] 지금 판 이름 [→ 안쪽 스테이지] ----------
const stagebar = document.getElementById('stagebar');
const flappanel = document.getElementById('flappanel');
const zedit = document.getElementById('zedit');
const ztools = document.getElementById('zedit-tools');
function moveCamera(o, sec) {
  book.style.transition = `transform ${sec}s cubic-bezier(.55,0,.25,1)`;
  book.style.transform = bookT(o, card.classList.contains('is-open'));
  skyFollow(sec + 's');
  rezoomSoon(sec * 1000 + 80);
}
function drawStageUI(o) {
  // 이 마을의 장면들 (지금 장면은 밝게 — 스테이지 안이면 눌러서 그 장면으로 나옴)
  const sc = stagebar.querySelector('.sb-scenes');
  sc.innerHTML = '';
  for (const b of town.blocks) {
    const bt = el(b === o.root ? 'on' : '', sc, 'button');
    bt.textContent = b.name;
    bt.onclick = () => (b === o.root ? o.stage && toRootThen() : travelTo(b));
  }
  const up = stagebar.querySelector('.sb-up');
  up.hidden = !o.stage;
  up.textContent = o.stage ? '⤴ ' + (o.stage.parent ? stageById(o.root, o.stage.parent)?.name : o.root.name) : '⤴ 위로';
  const kids = stagebar.querySelector('.sb-kids');
  kids.innerHTML = '';
  for (const s of childStages(o.root, o.stage)) {
    const bt = el('', kids, 'button');

    bt.onclick = () => enterStage(s);
  }
  stagebar.querySelector('.sb-sub').classList.toggle('none', !o.stage && !kids.children.length);
  fillFlaps(o);
}
/** 스테이지 안이면 지역 판까지 차례로 나온 뒤 할 일 */
async function toRootThen(then) {
  while (openState && openState.stage) {
    if (openState.busy) await wait(150);
    else await leaveStage(true);
  }
  if (then) then();
}

/** 같은 마을의 다른 장면으로: 그림이 눕고 덮개(그 자리 지도 그림)가 닫히며 카메라가 떠오름 → 지도 위를 날아가 →
 *  그 장면 위에서 내려앉으며 덮개가 열리고 그림이 일어섬. 책을 덮지 않음 (둘레 지도가 마을 전체라 지나가는 길이 이어짐) */
async function travelTo(b) {
  let o = openState;
  if (!o || o.busy || o.closing || o.editing || o.placing || !scene.classList.contains('is-ready') || b === o.root) return;
  if (o.look) { leaveFlap(); await wait(600); }
  if (o.stage) { await toRootThen(); o = openState; }
  if (!o || o.busy) return;
  o.busy = true;
  hideCard();
  closeRecord();
  scene.classList.add('is-moving');
  // 1) 지금 장면을 접고 덮개를 닫으며 떠오름
  o.pieces.forEach((p, i) => setTimeout(() => foldPiece(p), i * 12));
  o.flags.forEach((f) => setFlag(f, false));
  o.backs.forEach((bk) => setBack(bk, false));
  await wait(260);
  o.doors.forEach(({ cv, cb }) => { if (cv) cv.style.visibility = ''; cb.style.opacity = 1; });
  o.setDoors(false);
  const HIGH = 46; // 날아갈 때의 기울기 (지도를 내려다봄)
  VIEW.tilt = HIGH;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  o.focus = { kind: 'rise', cx: o.w / 2, cy: o.h / 2, k: 0.72 };
  moveCamera(o, 1.1);
  await wait(1150);
  // 2) 같은 자리에서 그 장면 판으로 바꿔 깔고 (덮개가 닫혀 있어 지도 그대로), 지도 위를 날아감
  const N = await swapTo(viewOf(b, null), poseOf(o), { doors: 'closed', up: () => false });
  N.focus = { kind: 'fly', cx: N.w / 2, cy: N.h / 2, k: N.focus.k, sy: N.focus.sy };
  moveCamera(N, 1.25);
  await wait(1150);
  // 3) 내려앉으며 덮개가 열리고, 다 열리면 배경 막 · 그림 · 깃발이 일어섬
  N.focus = null;
  VIEW.tilt = INIT_VIEW.tilt;
  moveCamera(N, 1.2);
  await wait(250);
  N.doors.forEach(({ cb }) => { cb.style.opacity = 1; });
  N.setDoors(true);
  await wait(900);
  N.doors.forEach(({ cv }) => { if (cv) cv.style.visibility = 'hidden'; });
  N.backs.forEach((bk, i) => setTimeout(() => setBack(bk, true), i * 160));
  [...N.pieces].sort((a, c) => c.y - a.y).forEach((p, i) => setTimeout(() => standPiece(p), 120 + (1 - p.y / N.h) * 600 + i * 20));
  N.flags.forEach((f, i) => setTimeout(() => setFlag(f, true), 700 + i * 120));
  await wait(1300);
  N.busy = false;
  scene.classList.remove('is-moving');
  drawStageUI(N);
}
stagebar.querySelector('.sb-up').onclick = () => leaveStage();
function fillFlaps(o) {
  if (o.flapL) fillFlap(o.flapL, 'l', o, false);
  if (o.flapR) fillFlap(o.flapR, 'r', o, false);
}

/** 양옆 면의 내용: 왼쪽 = 이 판의 스테이지 목차 + 작은 지도, 오른쪽 = 이 판의 기록 (노트). 3D 면(보기용)과 내려다볼 때 겹치는 판(live, 쓰기용)이 같은 모양 */
function fillFlap(box, side, o, live) {
  box.innerHTML = '';
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  el('lab', box).textContent = side === 'l' ? '스 테 이 지' : '기 록';
  el('nm', box).textContent = o.stage ? o.stage.name : o.root.name;
  el('', el('orn', box), 'i');
  if (side === 'l') {
    const kids = childStages(o.root, o.stage);
    // 마을 지도: 이 마을의 장면들 (지금 장면은 붉게, 누르면 그 장면으로 날아감) + 지금 판 안의 스테이지 자리. 목차가 다 들어가고 남는 높이만큼만
    const room = CH - 62 - 82 - (kids.length + (o.stage ? 1 : 0)) * 30 - 2 * 30 - 18;
    const mw0 = CW / 2 - 64, mh = Math.min(room, (mw0 * MAPH) / MAPW);
    const mini = el('mini', box);
    Object.assign(mini.style, { width: (mh * MAPW) / MAPH + 'px', height: mh + 'px', display: mh < 46 ? 'none' : '' });
    const im = el('', mini, 'img');
    im.src = LOCAL('map_town.jpg');
    im.draggable = false;
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${MAPW / MS} ${MAPH / MS}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;overflow:visible';
    mini.appendChild(svg);
    for (const b of town.blocks) {
      const pg = document.createElementNS(NS, 'polygon');
      pg.setAttribute('points', b.poly.map(([x, y]) => `${x},${y}`).join(' '));
      const on = b === o.root;
      pg.setAttribute('style', `fill:${on ? 'rgba(168,72,47,0.38)' : 'rgba(255,236,190,0.12)'};stroke:${on ? '#a8482f' : 'rgba(90,50,24,0.7)'};stroke-width:${on ? 9 : 5};stroke-linejoin:round;cursor:${live && !on ? 'pointer' : 'default'}`);
      const t = document.createElementNS(NS, 'title');
      t.textContent = b.name;
      pg.appendChild(t);
      if (live && !on) pg.addEventListener('click', () => leaveFlap(() => travelTo(b)));
      svg.appendChild(pg);
    }
    for (const s of kids) {
      const r = document.createElementNS(NS, 'rect');
      for (const [k, v] of Object.entries({ x: s.x, y: s.y, width: s.w, height: s.h })) r.setAttribute(k, v);
      r.setAttribute('style', 'fill:none;stroke:#fff3d6;stroke-width:4;stroke-dasharray:10 6');
      svg.appendChild(r);
    }
    const ol = el('', box, 'ol');
    if (o.stage) {
      const li = el('', ol, 'li');
      el('no', li, 'span').textContent = '⤴';
      el('', li, 'span').textContent = (o.stage.parent ? stageById(o.root, o.stage.parent)?.name : o.root.name) + ' (위 판)';
      if (live) li.onclick = () => leaveFlap(() => leaveStage());
    }
    kids.forEach((s, i) => {
      const li = el('', ol, 'li');
      el('no', li, 'span').textContent = i + 1;
      el('', li, 'span').textContent = s.name || '이름 없는 스테이지';
      if (live) li.onclick = () => leaveFlap(() => enterStage(s));
    });
    if (!kids.length) el('empty', box).textContent = '아직 스테이지가 없어요. 아래 「스테이지 나누기」로 이 판의 한 자리를 떼어 따로 들어가는 판을 만들어요.';
    const tools = el('tools', box);
    tools.style.cssText = 'margin-top:auto;display:flex;justify-content:center;gap:16px';
    for (const [t, fn] of [['✎ 스테이지 나누기', () => startStageEdit()], ['✎ 배치 고치기', () => startPlace()]]) {
      const tool = el('tool', tools, live ? 'button' : 'div');
      tool.style.marginTop = '0';
      tool.textContent = t;
      if (live) tool.onclick = fn;
    }
  } else {
    const list = el('recs', box);
    el('empty', list).textContent = '기록을 찾는 중…';
    listRecords(o).then((recs) => {
      if (!box.isConnected) return;
      list.innerHTML = '';
      if (!recs.length) el('empty', list).textContent = '아직 이 판의 기록이 없어요.' + (live ? '' : ' 눌러서 「새 기록」을 적어요.');
      for (const r of recs) {
        const row = el('rec', list);
        const k = el('k ' + (r.fm['종류'] || ''), row, 'span');
        k.textContent = r.fm['종류'] || '기록';
        el('t', row, 'span').textContent = r.fm['제목'] || r.path.split('/').pop().replace(/\.md$/, '');
        el('d', row, 'span').textContent = String(r.fm['날짜'] || '');
        if (live) row.onclick = () => openRecord(r.path);
      }
    });
    if (live) {
      // 새 기록: 종류를 고르고 제목을 쓰면 그 종류의 폴더에 노트가 생기고 바로 크게 펼쳐짐
      const nr = el('newrec', box);
      let kind = '세션';
      const kb = REC_KINDS.map((k) => {
        const bt = el(k === kind ? 'on' : '', nr, 'button');
        bt.textContent = k;
        bt.onclick = () => { kind = k; kb.forEach((x) => x.classList.toggle('on', x === bt)); };
        return bt;
      });
      const title = el('', nr, 'input');
      title.placeholder = '제목 (예: 첫 만남)';
      const go = el('addrec', nr, 'button');
      go.textContent = '＋ 새 기록';
      go.onclick = async () => {
        const t = title.value.trim();
        if (!t) { title.focus(); return; }
        go.disabled = true;
        const path = await newRecord(o, kind, t);
        go.disabled = false;
        title.value = '';
        fillFlap(o.flapR, 'r', o, false);
        fillFlap(box, 'r', o, true);
        if (path) openRecord(path);
      };
      title.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
    }
  }
}
/** 양옆 면을 보는 카메라: 위에서 내려다보며 그 면이 화면에 꽉 차게 (글을 읽고 쓰기 좋게) */
function flapFocus(o, side) {
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  const k = Math.min((innerWidth * 0.46) / (CW / 2), (innerHeight * 0.84) / CH) / o.s;
  return { kind: 'flap', side, cx: side === 'l' ? -PAD - CW / 4 : -PAD + CW + CW / 4, cy: -PAD + CH / 2, k, sy: innerHeight * 0.5 };
}
function lookFlap(side) {
  const o = openState;
  if (!o || o.closing || o.busy || o.look || o.editing || o.placing || !scene.classList.contains('is-ready')) return;
  hideCard();
  o.look = { side, tilt: VIEW.tilt, yaw: VIEW.yaw };
  o.focus = flapFocus(o, side);
  VIEW.tilt = 0;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  scene.classList.add('look-' + side);
  moveCamera(o, 1.1);
  clearTimeout(o.lookTimer);
  o.lookTimer = setTimeout(() => showFlapPanel(o, side), 1150);
}
/** 카메라가 다 내려다본 뒤, 그 면과 똑같은 자리 · 크기로 쓰기용 판을 겹쳐 띄움 (위에서 본 면은 원근이 없어 네모 그대로) */
function showFlapPanel(o, side) {
  if (openState !== o || !o.look || o.look.side !== side) return;
  const cb = o.doors.find((d) => d.s === side).cb;
  const r = cb.getBoundingClientRect();
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  fillFlap(flappanel.querySelector('.flap'), side, o, true);
  Object.assign(flappanel.style, { width: CW / 2 + 'px', height: CH + 'px', borderRadius: side === 'l' ? '6px 0 0 6px' : '0 6px 6px 0',
    transform: `translate(${r.left}px, ${r.top}px) scale(${r.width / (CW / 2)})` });
  flappanel.classList.add('on');
}
/** 면에서 판으로 돌아감 (then: 돌아가며 이어서 할 일 — 스테이지로 파고들기 등) */
function leaveFlap(then) {
  const o = openState;
  if (!o || !o.look) return;
  flappanel.classList.remove('on');
  clearTimeout(o.lookTimer);
  scene.classList.remove('look-l', 'look-r');
  VIEW.tilt = o.look.tilt;
  VIEW.yaw = o.look.yaw;
  o.look = null;
  o.focus = null;
  if (typeof then === 'function') { then(); if (openState === o && !o.busy) moveCamera(o, 1.1); return; }
  moveCamera(o, 1.1);
}
flappanel.querySelector('.fp-back').onclick = () => leaveFlap();

// ---------- 스테이지 나누기: 위에서 내려다본 판 위에 네모를 긋고, 옮기고, 크기를 바꾸고, 이름을 붙임 (그 네모가 따로 들어가는 판이 됨) ----------
function startStageEdit() {
  const o = openState;
  if (!o || o.closing || o.busy || o.editing || o.placing) return;
  hideCard();
  flappanel.classList.remove('on');
  clearTimeout(o.lookTimer);
  scene.classList.remove('look-l', 'look-r');
  o.look = null;
  const CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  o.editing = { zones: childStages(o.root, o.stage).map((s) => ({ id: s.id, name: s.name, x: s.x, y: s.y, w: s.w, h: s.h })), sel: -1 };
  o.focus = { kind: 'edit', cx: o.w / 2, cy: o.h / 2, k: Math.min((innerWidth * 0.62) / CW, (innerHeight * 0.74) / CH) / o.s, sy: innerHeight * 0.53 };
  VIEW.tilt = 0;
  VIEW.yaw = 0;
  VIEW.zoom = 1;
  scene.classList.add('is-editing');
  moveCamera(o, 1.1);
  setTimeout(() => {
    if (openState !== o || !o.editing) return;
    const r = o.page.getBoundingClientRect();
    Object.assign(zedit.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    zedit.classList.add('on');
    ztools.classList.add('on');
    drawZoneEdit(o);
  }, 1150);
}
function drawZoneEdit(o) {
  const E = o.editing, CW = o.w + 2 * PAD, CH = o.h + 2 * PAD;
  zedit.innerHTML = '';
  E.zones.forEach((z, i) => {
    const d = el('zbox' + (i === E.sel ? ' sel' : ''), zedit);
    Object.assign(d.style, { left: ((z.x - o.ox + PAD) / CW) * 100 + '%', top: ((z.y - o.oy + PAD) / CH) * 100 + '%', width: (z.w / CW) * 100 + '%', height: (z.h / CH) * 100 + '%' });
    d.dataset.i = i;
    el('zname', d).textContent = `${i + 1}. ${z.name || '이름 없음'}`;
    el('zgrip', d).dataset.i = i;
  });
  const nm = ztools.querySelector('.zt-name'), del = ztools.querySelector('.zt-del');
  nm.disabled = del.disabled = E.sel < 0;
  nm.value = E.sel < 0 ? '' : E.zones[E.sel].name;
}
zedit.addEventListener('pointerdown', (e) => {
  const o = openState;
  if (!o || !o.editing) return;
  e.preventDefault();
  const E = o.editing, CW = o.w + 2 * PAD;
  const r = zedit.getBoundingClientRect();
  const per = CW / r.width; // 화면 1px = 마을 좌표 몇
  const at = (ev) => ({ x: (ev.clientX - r.left) * per + o.ox - PAD, y: (ev.clientY - r.top) * per + o.oy - PAD });
  const p0 = at(e);
  let mode, i;
  if (e.target.classList.contains('zgrip')) { mode = 'size'; i = Number(e.target.dataset.i); }
  else if (e.target.classList.contains('zbox')) { mode = 'move'; i = Number(e.target.dataset.i); }
  else { mode = 'new'; E.zones.push({ id: 's' + Date.now().toString(36), name: `스테이지 ${E.zones.length + 1}`, x: p0.x, y: p0.y, w: 0, h: 0 }); i = E.zones.length - 1; }
  E.sel = i;
  const z = E.zones[i], z0 = { ...z };
  zedit.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const p = at(ev), dx = p.x - p0.x, dy = p.y - p0.y;
    if (mode === 'move') { z.x = z0.x + dx; z.y = z0.y + dy; }
    else if (mode === 'size') { z.w = Math.max(24, z0.w + dx); z.h = Math.max(24, z0.h + dy); }
    else { z.x = Math.min(p0.x, p.x); z.y = Math.min(p0.y, p.y); z.w = Math.abs(dx); z.h = Math.abs(dy); }
    drawZoneEdit(o);
  };
  const up = () => {

/** 스테이지와 그 안쪽 스테이지 모두 (지울 때) */
const subtree = (root, s) => [s, ...childStages(root, s).flatMap((c) => subtree(root, c))];
async function endStageEdit(save, quiet) {
  const o = openState;
  if (!o || !o.editing) return;
  if (save) {
    const all = stagesOf(o.root);
    const kept = new Set(o.editing.zones.map((z) => z.id));
    const gone = childStages(o.root, o.stage).filter((s) => !kept.has(s.id)).flatMap((s) => subtree(o.root, s));
    const lost = gone.reduce((n, s) => n + (s.items || []).length, 0);
    if (gone.length && (lost || gone.length > 1) && !confirm(`지우는 스테이지 ${gone.length}곳과 그 안에 더 놓은 그림 ${lost}개도 같이 지워져요. 지울까요?\n(그 스테이지에 단 기록 노트는 지우지 않아요)`)) return;
    for (const g of gone) all.splice(all.indexOf(g), 1);
    const { x0, y0, x1, y1 } = o.V;
    for (const z of o.editing.zones) {
      // 이 판 안으로 맞춤
      const x = clampv(z.x, [x0, x1 - 24]), y = clampv(z.y, [y0, y1 - 24]);
      const rect = { name: z.name.trim() || '이름 없는 스테이지', x: Math.round(x), y: Math.round(y), w: Math.round(Math.min(z.w, x1 - x)), h: Math.round(Math.min(z.h, y1 - y)) };

  }
  o.editing = null;

  ztools.classList.remove('on');

  await refreshBoard(o);
}
/** 같은 판을 다시 깔아 바뀐 것(스테이지 · 배치)을 보여 주고, 눈높이 제자리로 */
async function refreshBoard(o, lying) {

  N.parentPage?.classList.add('dim');
  if (lying) return N;
  N.focus = null;
  VIEW.tilt = Math.max(VIEW.tilt, LIM.tilt[0]);

  await wait(1150);
  N.busy = false;
  drawStageUI(N);
  return N;
}

// ---------- 배치 고치기: 위에서 내려다본 판에서 그림을 끌어 옮기고, 크기를 바꾸고, 기호를 더 놓음 ----------
const ptools = document.getElementById('ptools');

/** 배치 고치기 중 그림 끌기 (위에서 내려다보므로 화면 1px = 1/S 마을 좌표) */

  if (!p) return;
